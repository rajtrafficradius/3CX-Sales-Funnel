[project]
name = "funnel-agent"
version = "0.1.0"
description = "3CX Sales-Funnel AI Reporting Agent: classifies 3CX calls against the BDE sales funnel and reports per-BDE and overall."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.39",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "tenacity>=8.4",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "weasyprint>=62",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
funnel-agent = "funnel_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
