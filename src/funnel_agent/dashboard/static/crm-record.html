<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme-v2");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booking record · 3CX Funnel</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>">
<style>
  :root{
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14); --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --good-soft:rgba(74,222,128,.13); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.13);
    --bad:#f87171; --bad-soft:rgba(248,113,113,.12); --hot:#fb7185; --purple:#a78bfa; --chip:#1a2433;
    --r1:8px; --r2:10px; --r3:12px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --elev2:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -16px rgba(0,0,0,.80);
    --mat-elev:inset 0 1px 0 rgba(255,255,255,.035),0 1px 2px rgba(0,0,0,.34),0 6px 16px -12px rgba(0,0,0,.60);
    --t-eyebrow:10.5px; --t-cap:12px; --t-body:13px; --t-base:14px; --t-strong:16px;
  }
  :root[data-theme=light]{
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#f3f6fb; --panel3:#eaf0f7;
    --line:#e2e8f1; --line-soft:#eef2f8; --line2:#d3dbe6; --chip:#f0f4fa;
    --txt:#17202e; --txt-dim:#3a4658; --muted:#616d80; --faint:#93a0b2;
    --good:#15a34a; --good-soft:rgba(21,163,74,.10); --warn:#c07806; --warn-soft:rgba(192,120,6,.10);
    --bad:#dc2626; --bad-soft:rgba(220,38,38,.08); --hot:#e11d48; --purple:#7c3aed;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --elev2:0 1px 0 rgba(0,0,0,.02) inset,0 10px 26px -18px rgba(20,30,50,.35);
    --mat-elev:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(20,30,50,.06),0 6px 16px -12px rgba(20,30,50,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:var(--t-base)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums slashed-zero}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent-soft)}
  *{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid transparent;background-clip:padding-box;border-radius:8px}
  *::-webkit-scrollbar-track{background:transparent}
  input,select,button,textarea{font:inherit}
  /* ---- top bar ---- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;background:linear-gradient(180deg,var(--panel),var(--bg));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;line-height:0}
  .brand img{height:26px;display:block;filter:brightness(0) invert(1);opacity:.92}
  :root[data-theme=light] .brand img{filter:none;opacity:1}
  .htext .over{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:800}
  header h1.htitle{font-size:var(--t-strong);margin:0;font-weight:800;letter-spacing:.2px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1}
  .who{font-size:var(--t-cap);color:var(--muted)}
  .backlink{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);font-weight:700;font-size:var(--t-cap);white-space:nowrap;transition:border-color .14s,color .14s}
  .backlink:hover{border-color:var(--line2);color:var(--txt)}
  .backlink:focus-visible{outline:none;box-shadow:var(--ring)}
  /* ---- shell ---- */
  .wrap{max-width:1500px;margin:0 auto;padding:18px 22px 46px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--mat-elev)}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .retry{margin-top:4px;background:var(--panel2);color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}
  .retry:hover{border-color:var(--accent)}
  .dim{color:var(--faint)}
  .sent{display:inline-block;font-size:11px;font-weight:800;color:#0f7a45;background:#e7f6ee;border:1px solid #bfe6cf;border-radius:999px;padding:2px 8px;vertical-align:middle}
  .mono{font-variant-numeric:tabular-nums;color:var(--txt-dim)}
  /* pills / tags / badges */
  .lpill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
  .spill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:3px 11px;border-radius:20px;border:1px solid;white-space:nowrap}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;border:1px solid;white-space:nowrap;text-transform:capitalize}
  .badge .d{width:7px;height:7px;border-radius:50%}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--txt-dim)}
  .tag.good{color:var(--good);background:var(--good-soft);border-color:rgba(74,222,128,.3)}
  .tag.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(251,191,36,.3)}
  .tag.build{color:#4aa3ff;background:rgba(74,163,255,.12);border-color:rgba(74,163,255,.35)}
  .tag.bad{color:#f87171;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.32)}
  @keyframes tagpulse{0%,100%{opacity:1}50%{opacity:.5}}
  .pbar{height:7px;border-radius:5px;background:var(--chip);margin-top:7px;overflow:hidden;min-width:150px}
  .pbar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#1f5fd0,#17a8e6);background-size:200% 100%;transition:width .6s ease;animation:pbarflow 1.6s linear infinite}
  @keyframes pbarflow{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.18)}
  /* ---- hero ---- */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--elev2)}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
  .hero-main{min-width:0}
  .hbadges{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .hco{font-size:25px;font-weight:800;letter-spacing:-.4px;margin:0;line-height:1.12;word-break:break-word}
  .hmeta{margin-top:7px;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;color:var(--muted);font-size:var(--t-body)}
  .hmeta .mi{display:inline-flex;align-items:center;gap:5px}
  .hmeta svg{width:14px;height:14px;color:var(--faint)}
  .stars{color:var(--warn);font-weight:800;letter-spacing:-1px}
  .hcontact{margin-top:9px;color:var(--txt-dim);font-size:var(--t-body)}
  .hcontact b{color:var(--txt)}
  .qactions{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}
  .qa{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt-dim);font-weight:700;font-size:12.5px;transition:border-color .12s,color .12s,background .12s}
  .qa:hover{border-color:var(--accent);color:var(--accent)}
  .qa:focus-visible{outline:none;box-shadow:var(--ring)}
  .qa svg{width:15px;height:15px}
  .qa.primary{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4);color:var(--good)}
  .qa.primary:hover{border-color:var(--good)}
  /* meeting cube (hero right) */
  .mcube{flex:none;min-width:230px;background:linear-gradient(160deg,var(--panel2),var(--panel3));border:1px solid var(--line2);border-radius:var(--r3);padding:15px 17px;display:flex;flex-direction:column;gap:4px}
  .mcube .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:800}
  .mcube .count{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.4px;line-height:1.15;margin-top:2px}
  .mcube .when{font-size:var(--t-body);color:var(--txt-dim);margin-top:3px;font-weight:600}
  .mcube .est{margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .mcube .stagesel{margin-top:12px}
  .mcube label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:800;margin-bottom:5px}
  .mcube select{width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;font-weight:700;cursor:pointer}
  .mcube select:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  /* ---- KPI strip ---- */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;box-shadow:var(--elev1)}
  .kpi .t{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:800}
  .kpi .n{font-size:17px;font-weight:800;color:var(--txt);margin-top:3px;line-height:1.2}
  .kpi .n.sm{font-size:13px}
  /* ---- 3-col grid ---- */
  .grid3{display:grid;grid-template-columns:296px minmax(0,1fr) 320px;gap:16px;align-items:start}
  @media(max-width:1180px){.grid3{grid-template-columns:1fr minmax(0,1.4fr)}.col-right{grid-column:1 / -1}}
  @media(max-width:820px){.grid3{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--elev1);margin-bottom:16px}
  .panel-h{padding:12px 16px;border-bottom:1px solid var(--line);font-size:var(--t-cap);font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .panel-h .rt{margin-left:auto;font-weight:700;text-transform:none;letter-spacing:0}
  .panel-b{padding:14px 16px}
  /* key-value list */
  .kv{display:flex;flex-direction:column;gap:12px}
  .kv .row{display:flex;flex-direction:column;gap:3px}
  .kv .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:800}
  .kv .v{font-size:var(--t-body);color:var(--txt-dim);line-height:1.5;word-break:break-word}
  .kv .v a{word-break:break-all}
  /* BANT chips */
  .bant{display:flex;flex-wrap:wrap;gap:7px}
  .bchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:11.5px;font-weight:700;color:var(--txt-dim);cursor:help}
  .bchip .ck{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex:none}
  .bchip.yes{border-color:rgba(74,222,128,.35);background:var(--good-soft);color:var(--good)}
  .bchip.yes .ck{background:var(--good);color:#04120a}
  .bchip.no{border-color:var(--line);color:var(--faint)}
  .bchip.no .ck{background:var(--line2);color:var(--faint)}
  /* scorecard bars */
  .scores{margin-top:8px}
  .score{display:flex;align-items:center;gap:10px;font-size:11.5px;height:20px;margin-bottom:9px}
  .score:last-child{margin-bottom:0}
  .score .slk{flex:0 0 94px;color:var(--muted);font-weight:700;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score .track{flex:1 1 auto;height:6px;border-radius:4px;background:var(--panel3);overflow:hidden;min-width:0}
  .score .fill{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .score .sv{flex:0 0 30px;color:var(--txt-dim);font-weight:800;text-align:right;white-space:nowrap}
  /* brief */
  .brief p{margin:0 0 10px;font-size:var(--t-body);color:var(--txt-dim);line-height:1.6}
  .brief .sub{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:800;margin:14px 0 7px;display:flex;align-items:center;gap:7px}
  .signals{display:flex;flex-wrap:wrap;gap:6px}
  .sig{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--good-soft);color:var(--good);border:1px solid rgba(74,222,128,.28)}
  .sig.obj{background:var(--bad-soft);color:var(--bad);border-color:rgba(248,113,113,.28)}
  .points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .points li{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r2);padding:9px 12px}
  .points .pt{font-size:var(--t-body);color:var(--txt);font-weight:700;line-height:1.45}
  .points .wy{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .tips li{font-size:12.5px;color:var(--txt-dim);line-height:1.5;padding-left:18px;position:relative}
  .tips li::before{content:'💡';position:absolute;left:0;top:0;font-size:11px}
  /* reveal asset */
  .sitebtn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:10px;border:1px solid rgba(74,222,128,.4);background:var(--good-soft);color:var(--good);font-weight:800;font-size:13px}
  .sitebtn:hover{border-color:var(--good)}
  /* SMS chat */
  .chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:2px}
  .bub{max-width:82%;padding:8px 12px;border-radius:13px;font-size:12.5px;line-height:1.45;position:relative}
  .bub .bt{display:block;font-size:10px;margin-top:4px;opacity:.7}
  .bub.in{align-self:flex-start;background:var(--panel3);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--txt-dim)}
  .bub.out{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(91,140,255,.3);border-bottom-right-radius:4px;color:var(--txt)}
  .bub.out .bt{text-align:right}
  /* events */
  .events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .ev{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px}
  .ev .ei{flex:none;font-size:15px;line-height:1.2;margin-top:1px}
  .ev .ec{min-width:0;flex:1}
  .ev .et{font-size:12.5px;color:var(--txt);font-weight:700;line-height:1.35}
  .ev .es{font-size:11px;color:var(--muted);margin-top:2px}
  .ev .estat{margin-left:auto;flex:none}
  /* transcript */
  details.txd>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:var(--t-cap);font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:8px}
  details.txd>summary::-webkit-details-marker{display:none}
  details.txd>summary::before{content:'▸';color:var(--faint);transition:transform .15s}
  details.txd[open]>summary::before{transform:rotate(90deg)}
  .transcript{white-space:pre-wrap;background:var(--panel3);border-top:1px solid var(--line);padding:14px 16px;max-height:46vh;overflow:auto;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt-dim)}
  /* timeline */
  ul.tl{list-style:none;margin:0;padding:6px 4px 4px;position:relative}
  ul.tl::before{content:'';position:absolute;left:22px;top:14px;bottom:14px;width:2px;background:var(--line)}
  .tl-item{position:relative;display:flex;gap:14px;padding:8px 8px 8px 0}
  .tl-mark{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);color:var(--k);z-index:1;box-shadow:0 0 0 4px var(--panel)}
  .tl-mark svg{width:15px;height:15px}
  .tl-body{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
  .tl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .tl-kind{font-weight:800;font-size:var(--t-cap)}
  .tl-author{font-size:11px;color:var(--muted);font-weight:600}
  .tl-when{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
  .tl-text{margin-top:4px;font-size:var(--t-body);color:var(--txt-dim);line-height:1.5;word-break:break-word}
  .tbadges{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .tplayer{margin-top:9px;width:100%;height:34px;display:block}
  .tl-empty{color:var(--muted);text-align:center;padding:26px 0}
  /* right: action panel */
  .qoutcomes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
  .qo{padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt-dim);font-weight:700;font-size:12px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .qo:hover{border-color:var(--accent);color:var(--accent)}
  .qo:focus-visible{outline:none;box-shadow:var(--ring)}
  .qo.good:hover{border-color:var(--good);color:var(--good);background:var(--good-soft)}
  .qo.bad:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
  .qo.warn:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:800;margin-bottom:5px}
  .field input,.field textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .field textarea{resize:vertical;min-height:70px;line-height:1.5}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px 14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:800;font-size:var(--t-body);cursor:pointer;transition:filter .12s,opacity .12s}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn.ghost{background:var(--panel2);color:var(--txt-dim);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .qedit{margin-top:13px;border-top:1px solid var(--line);padding-top:13px}
  .qedit label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:800;margin-bottom:7px}
  .qrow{display:flex;gap:8px}
  .qrow input{flex:1;min-width:0;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;font-variant-numeric:tabular-nums}
  .qrow input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .savedline{margin-top:12px;font-size:11px;color:var(--faint);line-height:1.5}
  .unreadbar{display:flex;align-items:center;gap:9px;background:var(--bad-soft);border:1px solid rgba(248,113,113,.3);border-radius:var(--r2);padding:9px 12px;margin-bottom:14px;font-size:12.5px;color:var(--txt-dim)}
  .unreadbar button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--accent);font-weight:700;font-size:11px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  /* toast */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);z-index:120;background:var(--panel3);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-weight:700;font-size:13px;box-shadow:var(--elev2);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:rgba(248,113,113,.5);color:var(--bad)}
  .skwrap{display:grid;grid-template-columns:296px minmax(0,1fr) 320px;gap:16px}
  @media(max-width:820px){.skwrap{grid-template-columns:1fr}}
  .sk{height:200px;border-radius:var(--r3);background:linear-gradient(100deg,var(--panel) 30%,var(--panel3) 50%,var(--panel) 70%);background-size:220% 100%;animation:sh 1.4s ease-in-out infinite}
  @keyframes sh{0%{background-position:140% 0}100%{background-position:-40% 0}}
  @media (prefers-reduced-motion:reduce){.sk{animation:none}}
  /* theme button */
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:17px;cursor:pointer;box-shadow:var(--elev1);display:flex;align-items:center;justify-content:center}
  .tr-theme-btn:hover{border-color:var(--accent)}
  /* persistent icon rail */
  :root{--rail-w:58px;--rail-open:238px}
  body{padding-left:var(--rail-w)}
  .tr-rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail-w);z-index:60;box-sizing:border-box;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 0;overflow:hidden;transition:width .19s cubic-bezier(.4,0,.2,1),box-shadow .19s}
  .tr-rail:hover,.tr-rail:focus-within{width:var(--rail-open);box-shadow:22px 0 48px -30px rgba(8,12,20,.6)}
  :root[data-theme=light] .tr-rail{box-shadow:none}
  :root[data-theme=light] .tr-rail:hover,:root[data-theme=light] .tr-rail:focus-within{box-shadow:22px 0 48px -30px rgba(20,30,50,.35)}
  .tr-rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
  .tr-rail-nav::-webkit-scrollbar{width:0}
  .tr-rail-foot{flex:none;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .tr-rail-item,.tr-rail-user{display:flex;align-items:center;height:42px;margin:0 8px;border-radius:10px;color:var(--txt-dim);text-decoration:none;font-weight:600;font-size:13.5px;overflow:hidden;white-space:nowrap;transition:background .12s,color .12s}
  .tr-rail-item:hover{background:var(--panel2);color:var(--txt)}
  .tr-rail-item.active{background:var(--accent-soft);color:var(--accent)}
  .tr-rail-item .ic,.tr-rail-user .ic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail svg{width:20px;height:20px;flex:none}
  .tr-rail .lbl{opacity:0;transition:opacity .16s;letter-spacing:-.1px}
  .tr-rail:hover .lbl,.tr-rail:focus-within .lbl{opacity:1}
  .tr-rail-user .av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .tr-rail-user .lbl{font-weight:600;font-size:12.5px;color:var(--txt-dim);overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .tr-rail-brand{position:relative;display:block;height:46px;margin:2px 8px 8px;color:var(--txt-dim)}
  .tr-rail-brand .barsic{position:absolute;left:0;top:0;width:42px;height:46px;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .15s}
  .tr-rail-brand .barsic svg{width:23px;height:23px}
  .tr-rail-brand .fulllogo{position:absolute;left:12px;top:50%;transform:translateY(-50%);height:24px;opacity:0;transition:opacity .18s;pointer-events:none;max-width:none;filter:brightness(0) invert(1)}
  :root[data-theme=light] .tr-rail-brand .fulllogo{filter:none}
  .tr-rail:hover .tr-rail-brand .barsic,.tr-rail:focus-within .tr-rail-brand .barsic{opacity:0}
  .tr-rail:hover .tr-rail-brand .fulllogo,.tr-rail:focus-within .tr-rail-brand .fulllogo{opacity:1}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logo.png" alt="Traffic Radius" /></a>
  <div class="htext"><div class="over">Lisa · Booking record</div><h1 class="htitle" id="crumb">Booking record</h1></div>
  <span class="spacer"></span>
  <a class="backlink" href="/lisa-crm">&larr; Booked CRM</a>
  <span class="who" id="who"></span>
</header>

<div class="wrap" id="wrap" aria-busy="true">
  <div class="skwrap"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const STAGES=[
  {id:'new',label:'New',c:'#8b96a6'},
  {id:'confirming',label:'Confirming',c:'#fbbf24'},
  {id:'confirmed',label:'Confirmed',c:'#5b8cff'},
  {id:'revealed',label:'Revealed',c:'#a78bfa'},
  {id:'won',label:'Won',c:'#4ade80'},
  {id:'lost',label:'Lost',c:'#f87171'},
  {id:'no_show',label:'No-show',c:'#fb923c'}
];
const LINE={lisa4:{label:'Website',full:'Lisa 4 · Website build',c:'#5b8cff'},lisa5:{label:'Growth',full:'Lisa 5 · Growth marketing',c:'#4ade80'},lisa1:{label:'Marketing',full:'Lisa 1 · Marketing',c:'#a78bfa'}};
const TEMP={hot:{c:'#fb7185',label:'Hot'},warm:{c:'#fbbf24',label:'Warm'},cold:{c:'#60a5fa',label:'Cold'}};
const TZ='Australia/Melbourne';
const D9=(location.pathname.split('/').filter(Boolean).pop()||'').replace(/[^0-9]/g,'');
const wrap=document.getElementById('wrap'), who=document.getElementById('who'), crumb=document.getElementById('crumb'), toastEl=document.getElementById('toast');
let REC=null, toastTimer=null;

const IC={
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  sms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  briefcase:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  sys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>'
};
const KIND={
  lisa_call:{label:'Lisa call',c:'#5b8cff',ic:IC.phone},
  bde_call:{label:'Alfred (BDE) call',c:'#a78bfa',ic:IC.user},
  sms:{label:'SMS',c:'#4ade80',ic:IC.sms},
  note:{label:'Note',c:'#fbbf24',ic:IC.note},
  system:{label:'System',c:'#697384',ic:IC.sys}
};

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function phone(d9){return d9?('0'+String(d9)):'';}
async function api(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}

function toDate(s){if(!s)return null;let str=String(s);if(!/[zZ]|[+-]\d\d:?\d\d$/.test(str))str+='Z';const d=new Date(str.replace(' ','T'));return isNaN(d)?null:d;}
// live build % — elapsed since building started vs a typical ~11min Opus build, capped so it never shows 100% until truly built
function buildMins(r){var ba=toDate(r.site_building_at);if(!ba)return 0;return Math.max(0,Math.round((Date.now()-ba.getTime())/60000));}
function ymdNum(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);return Date.UTC(+o.year,+o.month-1,+o.day);}
function frel(s){const d=toDate(s);if(!d)return '';
  const diff=Math.round((ymdNum(d)-ymdNum(new Date()))/86400000);
  const time=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d);
  let day;
  if(diff===0)day='Today';else if(diff===1)day='Tomorrow';else if(diff===-1)day='Yesterday';
  else day=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'}).format(d);
  return day+' '+time;
}
function fdt(s){const d=toDate(s);if(!d)return '';return new Intl.DateTimeFormat('en-AU',{timeZone:TZ,day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}).format(d);}
function countdown(s){const d=toDate(s);if(!d)return null;
  const days=Math.round((ymdNum(d)-ymdNum(new Date()))/86400000);
  if(days<0)return {t:Math.abs(days)+(Math.abs(days)===1?' day ago':' days ago'),past:true};
  if(days===0)return {t:'Today',soon:true};
  if(days===1)return {t:'Tomorrow',soon:true};
  return {t:'in '+days+' days'};
}
function toLocalInput(s){const d=toDate(s);if(!d)return '';const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fmtDur(sec){sec=Math.round(sec||0);if(sec<=0)return '';if(sec<60)return sec+'s';const m=Math.floor(sec/60),s=sec%60;return m+'m'+(s?(' '+s+'s'):'');}
function tri(v){return v===true?'yes':(v===false?'no':'na');}
function gcalUrl(r){const d=toDate(r.meeting_at);if(!d)return '';
  const e=new Date(d.getTime()+15*60000);const z=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d\d\d/,'');
  const text=encodeURIComponent((r.agent==='lisa5'?'Growth reveal: ':'Website reveal: ')+(r.company||''));
  const det=encodeURIComponent('Reveal call with '+(r.contact_name||'prospect')+' · '+phone(r.dest9)+(r.share_token?('\n'+location.origin+'/api/lisa4/site/public/'+r.share_token):''));
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+text+'&dates='+z(d)+'/'+z(e)+'&details='+det;}

function toast(msg,err){toastEl.textContent=msg;toastEl.classList.toggle('err',!!err);toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),err?4200:2200);}
function stageOptions(cur){return STAGES.map(s=>`<option value="${s.id}"${s.id===cur?' selected':''}>${s.label}</option>`).join('');}
function pill(label,c){return `<span class="spill" style="color:${c};background:${c}22;border-color:${c}55">${esc(label)}</span>`;}

/* ---------- hero ---------- */
function heroBadges(r){
  const line=LINE[r.agent]||LINE.lisa1, st=STAGES.find(x=>x.id===r.stage)||STAGES[0], q=r.qual||{};
  const b=[`<span class="lpill" style="color:${line.c};background:${line.c}22;border-color:${line.c}55">${line.label}</span>`, pill(st.label,st.c)];
  if(r.lead_source) b.push(`<span class="spill" style="color:#5b9dff;background:#5b9dff1f;border-color:#5b9dff55" title="Data source of this lead">📍 ${esc(r.lead_source)}</span>`);
  if(r.gbp_url) b.push(`<a class="spill" href="${esc(r.gbp_url)}" target="_blank" rel="noopener" style="color:#34d399;background:#34d39918;border-color:#34d39955;text-decoration:none" title="Google Business Profile — proof of the Google Maps source">Google profile ↗</a>`);
  const t=(q.lead_temperature||'').toLowerCase(); if(TEMP[t])b.push(`<span class="badge" style="color:${TEMP[t].c};border-color:${TEMP[t].c}66;background:${TEMP[t].c}1a"><span class="d" style="background:${TEMP[t].c}"></span>${TEMP[t].label} lead</span>`);
  if(q.booking_status)b.push(`<span class="badge" style="color:var(--txt-dim);border-color:var(--line2);background:var(--panel2)">📌 ${esc(q.booking_status)}</span>`);
  if(q.qualified===true)b.push(`<span class="badge" style="color:var(--good);border-color:rgba(74,222,128,.4);background:var(--good-soft)">✓ Qualified</span>`);
  if(r.unread)b.push('<span class="udot" title="Unread reply"></span>');
  return b.join('');
}
function heroMeta(r){
  const ci=r.company_intel||{}, m=[];
  const ind=ci.industry||ci.sub_industry||(r.qual&&r.qual.prospect_industry);
  if(ind)m.push(`<span class="mi">${IC.briefcase}${esc(ind)}</span>`);
  const loc=[ci.suburb,ci.state].filter(Boolean).join(', ')||ci.address;
  if(loc)m.push(`<span class="mi">${IC.pin}${esc(loc)}</span>`);
  if(ci.gmaps_rating){const rv=ci.gmaps_reviews?(' · '+ci.gmaps_reviews+' reviews'):'';m.push(`<span class="mi"><span class="stars">★ ${esc(ci.gmaps_rating)}</span>${esc(rv)}</span>`);}
  if(ci.employees)m.push(`<span class="mi">${IC.user}${esc(ci.employees)} staff</span>`);
  if(ci.revenue_musd)m.push(`<span class="mi">$${esc(ci.revenue_musd)}M rev</span>`);
  return m.join('');
}

/* ---------- BANT / qualification ---------- */
function bantChips(r){
  const q=r.qual||{}, ev=q.evidence||{};
  const items=[['authority','Authority'],['problem','Problem'],['budget','Budget'],['urgency','Urgency'],['aspiration','Aspiration']];
  return items.map(([k,lab])=>{
    const v=q[k], cls=v===true?'yes':'no', mark=v===true?'✓':(v===false?'–':'?');
    const tip=(ev[k]&&ev[k].evidence)?ev[k].evidence:'';
    return `<span class="bchip ${cls}"${tip?` title="${esc(tip)}"`:''}><span class="ck">${mark}</span>${lab}</span>`;
  }).join('');
}
function scoreBars(sc){
  if(!sc||typeof sc!=='object')return '';
  const order=['opening','discovery','pitch','objection_handling','close'];
  const keys=order.filter(k=>k in sc).concat(Object.keys(sc).filter(k=>!order.includes(k)));
  const rows=keys.map(k=>{const v=Math.max(0,Math.min(5,+sc[k]||0));
    return `<div class="score"><span class="slk">${esc(k.replace(/_/g,' '))}</span><span class="track"><span class="fill" style="width:${v/5*100}%"></span></span><span class="sv">${v}/5</span></div>`;});
  return `<div class="scores">${rows.join('')}</div>`;
}

/* ---------- closer brief ---------- */
function briefCard(r){
  const q=r.qual||{}, ev=q.evidence||{};
  const parts=[];
  const summary=ev.prospect_summary||q.problem_summary||r.booking_summary;
  if(summary)parts.push(`<p>${esc(summary)}</p>`);
  const sigs=(ev.buying_signals||[]).filter(Boolean);
  if(sigs.length)parts.push(`<div class="sub">Buying signals</div><div class="signals">${sigs.map(s=>`<span class="sig">✓ ${esc(s)}</span>`).join('')}</div>`);
  const objs=(ev.objections||[]).filter(Boolean);
  const objList=objs.length?objs:(r.main_objection?[r.main_objection]:[]);
  if(objList.length)parts.push(`<div class="sub">Objections to expect</div><div class="signals">${objList.map(s=>`<span class="sig obj">${esc(typeof s==='string'?s:(s.objection||JSON.stringify(s)))}</span>`).join('')}</div>`);
  const pts=(ev.next_call_points||[]).filter(Boolean);
  if(pts.length)parts.push(`<div class="sub">What to cover on the reveal</div><ul class="points">${pts.map(p=>{
    const point=typeof p==='string'?p:(p.point||''); const why=typeof p==='object'?(p.why||''):'';
    return `<li><div class="pt">${esc(point)}</div>${why?`<div class="wy">${esc(why)}</div>`:''}</li>`;}).join('')}</ul>`);
  else if(ev.next_step)parts.push(`<div class="sub">Next step</div><p>${esc(ev.next_step)}</p>`);
  const tips=(ev.coaching_tips||[]).filter(Boolean);
  if(tips.length)parts.push(`<div class="sub">Coaching</div><ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`);
  if(!parts.length)return '';
  const eng=[ev.engagement,ev.prospect_sentiment,ev.who_answered&&ev.who_answered.replace(/_/g,' ')].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  return `<div class="panel"><div class="panel-h">Call prep — what to say ${eng?`<span class="rt">${eng}</span>`:''}</div><div class="panel-b brief">${parts.join('')}</div></div>`;
}

/* ---------- SMS chat ---------- */
function smsChat(thread){
  if(!thread||!thread.length)return '';
  const bub=thread.map(s=>{const inb=(s.direction||'').toLowerCase()==='inbound';
    return `<div class="bub ${inb?'in':'out'}">${esc(s.body||'')}<span class="bt">${esc(fdt(s.created_at))}</span></div>`;}).join('');
  return `<div class="panel"><div class="panel-h">SMS conversation <span class="rt">${thread.length} message${thread.length===1?'':'s'}</span></div><div class="panel-b"><div class="chat">${bub}</div></div></div>`;
}

/* ---------- events ---------- */
function eventsList(events){
  if(!events||!events.length)return '';
  const ic={reveal:'🌐',meeting:'📅',retry:'🔄',callback:'📞'};
  const li=events.map(e=>{const done=(e.status||'')==='done';
    const stat=e.status?`<span class="estat"><span class="tag ${e.status==='pending'?'warn':(done?'':'good')}">${esc(e.status)}</span></span>`:'';
    return `<li class="ev"><span class="ei">${ic[e.type]||'•'}</span><div class="ec"><div class="et">${esc(e.title||e.type)}</div><div class="es">${esc(frel(e.start_at))}${e.bde_name?' · '+esc(e.bde_name):''}</div></div>${stat}</li>`;}).join('');
  return `<div class="panel"><div class="panel-h">Meetings & follow-ups</div><div class="panel-b"><ul class="events">${li}</ul></div></div>`;
}

/* ---------- timeline ---------- */
function tItem(t){
  const cfg=KIND[t.kind]||KIND.system;
  let label=cfg.label, body=esc(t.body||''), extra='';
  const m=t.meta||{};
  if(t.kind==='sms'){const dm=/^SMS (inbound|outbound):\s*/i.exec(t.body||'');if(dm){label='SMS '+(dm[1].toLowerCase()==='inbound'?'received':'sent');body=esc((t.body||'').slice(dm[0].length));}}
  if(t.kind==='lisa_call'){const badges=[];if(m.booked)badges.push('<span class="tag good">Meeting agreed</span>');if(m.dur_s)badges.push('<span class="tag">'+esc(fmtDur(m.dur_s))+'</span>');if(badges.length)extra+='<div class="tbadges">'+badges.join('')+'</div>';if(m.recording)extra+='<audio class="tplayer" controls preload="none" src="'+esc(m.recording)+'"></audio>';}
  if(t.kind==='bde_call'&&m.outcome)extra+='<div class="tbadges"><span class="tag">'+esc(m.outcome)+'</span></div>';
  if(t.kind==='bde_call'&&m.rec_call_id)extra+='<audio class="tplayer" controls preload="none" src="/api/call/'+encodeURIComponent(m.rec_call_id)+'/recording"></audio>';
  const author=t.author?('<span class="tl-author">'+esc(t.author)+'</span>'):'';

function renderError(e){
  wrap.setAttribute('aria-busy','false');
  const msg=(!D9)?'No booking id in the URL.':'Could not load this record.';
  wrap.innerHTML='<div class="card"><div class="empty">'+esc(msg)+'<br><a class="backlink" href="/lisa-crm" style="display:inline-block;margin-top:12px">← Back to Booked CRM</a>'+
    (D9?'<div style="margin-top:10px"><button class="retry" type="button" id="retryBtn">Retry</button></div><div class="dim" style="margin-top:8px;font-size:12px">'+esc(e&&e.message||'')+'</div>':'')+
    '</div></div>';
  const rb=document.getElementById('retryBtn');if(rb)rb.onclick=loadRecord;
}

function wire(){
  const stageSel=document.getElementById('stageSel');
  stageSel.onchange=async()=>{try{await post('/api/lisa/crm/update',{dest9:D9,fields:{stage:stageSel.value}});toast('Stage updated');await loadRecord();}catch(e){toast('Failed: '+e.message,true);loadRecord();}};
  document.querySelectorAll('.qo').forEach(b=>b.onclick=async()=>{
    const fields={stage:b.dataset.stage,outcome:b.dataset.outcome};
    try{await post('/api/lisa/crm/update',{dest9:D9,fields});toast(b.dataset.outcome+' ✓');await loadRecord();}catch(e){toast('Failed: '+e.message,true);}
  });
  const saveBtn=document.getElementById('saveBtn');
  saveBtn.onclick=async()=>{
    const naAt=document.getElementById('naAtEl').value;
    const fields={owner:document.getElementById('ownerEl').value.trim(),next_action:document.getElementById('naEl').value.trim(),next_action_at:naAt?new Date(naAt).toISOString():null,outcome:document.getElementById('outEl').value.trim()};
    saveBtn.disabled=true;
    try{await post('/api/lisa/crm/update',{dest9:D9,fields});toast('Saved');await loadRecord();}catch(e){toast('Save failed: '+e.message,true);saveBtn.disabled=false;}
  };
  const noteBtn=document.getElementById('noteBtn'), noteEl=document.getElementById('noteEl');
  noteBtn.onclick=async()=>{const b=noteEl.value.trim();if(!b){noteEl.focus();return;}noteBtn.disabled=true;
    try{await post('/api/lisa/crm/note',{dest9:D9,body:b});toast('Note added');await loadRecord();}catch(e){toast('Failed: '+e.message,true);noteBtn.disabled=false;}};
  const qBtn=document.getElementById('qBtn');
  if(qBtn)qBtn.onclick=async()=>{const t=parseInt(document.getElementById('qTotal').value||'1000',10)||1000;qBtn.disabled=true;
    try{await post('/api/lisa/crm/quote',{dest9:D9,total:t});toast('Quotation updated · A$'+t.toLocaleString());await loadRecord();}
    catch(e){toast('Failed: '+e.message,true);qBtn.disabled=false;}};

  // ---- LINE-BY-LINE QUOTE PRICING (Alfred prices each prospect himself) ----------------------
  // The 6-item ratio split is only a starting point. Whatever he types here is authoritative: the
  // total becomes the sum of his lines and is never rescaled back to the standard weighting.
  const DEFAULT_LINES=[
    ['UX/UI Design & Art Direction','Bespoke identity, layout system, type scale & colour.'],
    ['Front-End Engineering','Modern component build — responsive, fast, smooth routing.'],
    ['Copywriting & Content Structuring','Professional copy and section architecture across all pages.'],
    ['Motion & Interaction Design','Scroll reveals, kinetic type, page transitions.'],
    ['Brand Asset Integration','Logo, embedded premium fonts & optimised imagery.'],
    ['Testing, QA & Launch','Cross-device QA, accessibility & performance pass, go-live.']];
  const qBody=document.getElementById('qBody');
  if(qBody){
    const fmt=n=>'A$'+(Number(n)||0).toLocaleString();
    function sum(){let s=0;qBody.querySelectorAll('input.qamt').forEach(i=>{s+=parseFloat(i.value||'0')||0;});
      const el=document.getElementById('qSum'); if(el)el.textContent=fmt(s); return s;}
    function addRow(name,desc,amt){
      const tr=document.createElement('tr');
      tr.innerHTML='<td style="padding:3px 6px"><input class="qname" style="width:100%" value=""></td>'
        +'<td style="padding:3px 6px"><input class="qdesc" style="width:100%" value=""></td>'
        +'<td style="padding:3px 6px"><input class="qamt" type="number" min="0" step="10" style="width:100%;text-align:right" value=""></td>'
        +'<td style="padding:3px 2px"><button class="btn ghost qdel" type="button" title="Remove this line" '
        +'style="width:auto;padding:2px 8px;font-size:13px;line-height:1">&times;</button></td>';
      // set via .value (never innerHTML) so a quote line can't inject markup
      tr.querySelector('.qname').value=name||''; tr.querySelector('.qdesc').value=desc||'';
      tr.querySelector('.qamt').value=(amt==null?'':amt);
      tr.querySelector('.qdel').onclick=()=>{tr.remove();sum();};
      tr.querySelectorAll('input').forEach(i=>i.addEventListener('input',sum));
      qBody.appendChild(tr); sum();
    }
    function seed(){
      qBody.innerHTML='';
      const it=(REC&&REC.quote_items)||[];
      if(it.length){ it.forEach(x=>addRow(x.name,x.desc,x.amount)); }
      else{ // pre-fill with the standard split of the current total so he edits rather than types from scratch
        const tot=parseInt((document.getElementById('qTotal')||{}).value||'1000',10)||1000;
        const w=[0.22,0.30,0.17,0.14,0.07,0.10];
        DEFAULT_LINES.forEach((l,i)=>addRow(l[0],l[1],Math.round(tot*w[i]/5)*5));
      }
      sum();
    }
    const tgl=document.getElementById('qLinesToggle'), box=document.getElementById('qLines');
    if(tgl)tgl.onclick=()=>{const open=box.style.display!=='none';
      box.style.display=open?'none':'block'; if(!open&&!qBody.children.length)seed();};
    if(box.style.display!=='none')seed();
    const add=document.getElementById('qAdd'); if(add)add.onclick=()=>addRow('','',0);
    const save=document.getElementById('qLinesSave');
    if(save)save.onclick=async()=>{
      const items=[];
      qBody.querySelectorAll('tr').forEach(tr=>{
        const n=(tr.querySelector('.qname')||{}).value||'', d=(tr.querySelector('.qdesc')||{}).value||'';
        const a=parseFloat((tr.querySelector('.qamt')||{}).value||'0')||0;
        if(n.trim()||a>0) items.push({name:n.trim(),desc:d.trim(),amount:Math.round(a)});
      });
      if(!items.length){toast('Add at least one line, or use Reset to standard',true);return;}
      save.disabled=true;
      try{const res=await post('/api/lisa/crm/quote',{dest9:D9,items:items});
        toast('Quotation repriced · '+fmt((res&&res.quote_total)||sum()));await loadRecord();}
      catch(e){toast('Failed: '+e.message,true);save.disabled=false;}};
    const rst=document.getElementById('qLinesReset');
    if(rst)rst.onclick=async()=>{ // items:[] clears the custom pricing back to the standard split
      if(!confirm('Clear your custom lines and go back to the standard 6-item split?'))return;
      rst.disabled=true;
      const t=parseInt((document.getElementById('qTotal')||{}).value||'1000',10)||1000;
      try{await post('/api/lisa/crm/quote',{dest9:D9,total:t,items:[]});

      catch(e){toast('Failed: '+e.message,true);rst.disabled=false;}};

               email:(document.getElementById('edEmail').value||'').trim(),

    const fields={};
    Object.keys(cur).forEach(k=>{if(cur[k]!==orig[k])fields[k]=cur[k];});

    catch(e){toast('Failed: '+e.message,true);genAuditBtn.disabled=false;genAuditBtn.textContent=_t;}};
}

function fmtSecs(s){s=+s||0;if(s<60)return s+'s';var m=Math.floor(s/60),r=s%60;return m+'m'+(r?' '+r+'s':'');}
function renderEngagement(d){
  var el=document.getElementById('engBody'); if(!el)return;
  var a=(d&&d.assets)||[];
  var rt=document.getElementById('engRt'); if(rt)rt.textContent=(d&&d.engaged)?'✓ engaged':'not opened yet';
  if(!a.length){el.innerHTML='<span class="dim">Nothing opened yet. As soon as the prospect opens an asset, taps an SMS link or opens an email, it shows here.</span>';return;}
  var rows=a.map(function(x){
    var v;
    if(!x.opened){v='<span class="dim">Not opened yet</span>';}
    else{
      var bits=[];
      if(x.kind==='sms'){bits.push('<span class="tag good">● Link clicked'+(x.clicks>1?' '+x.clicks+'×':'')+'</span>');}
      else if(x.kind==='email'){bits.push('<span class="tag good">● Email opened'+(x.opens>1?' '+x.opens+'×':'')+'</span>');}
      else{bits.push('<span class="tag good">● Opened'+(x.opens>1?' '+x.opens+'×':'')+'</span>');
        if(x.max_scroll)bits.push('scrolled '+x.max_scroll+'%');
        if(x.total_secs)bits.push(fmtSecs(x.total_secs));
        if(x.clicks)bits.push('clicked from SMS');}
      v=bits.join(' · ');
    }
    return '<div class="row"><span class="k">'+esc(x.label)+'</span><span class="v">'+v+'</span></div>';
  }).join('');
  el.innerHTML='<div class="kv">'+rows+'</div>';
}
async function loadEngagement(){try{var d=await api('/api/lisa/crm/engagement/'+encodeURIComponent(D9));renderEngagement(d);}catch(e){var el=document.getElementById('engBody');if(el)el.innerHTML='<span class="dim">—</span>';}}

var _devPoll=null;
async function loadRecord(){
  if(!D9){renderError(new Error('missing dest9'));return;}
  try{const rec=await api('/api/lisa/crm/record/'+encodeURIComponent(D9));if(!rec||!rec.dest9){renderError(new Error('Not found'));return;}renderRecord(rec);
    loadEngagement();
    // real-time development status: while the site is queued/building, refresh every 15s until it's live
    if(_devPoll){clearTimeout(_devPoll);_devPoll=null;}
    if(rec.site_status==='building'||rec.site_status==='queued'){_devPoll=setTimeout(loadRecord,15000);}
  }
  catch(e){renderError(e);}
}
window.loadRecord=loadRecord;

(async function(){try{const me=await api('/api/me');who.textContent=(me.name||me.email||'');}catch(e){}loadRecord();})();
