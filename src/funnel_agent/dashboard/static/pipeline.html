<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme-v2");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline · 3CX Funnel</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
  :root{
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14); --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1a2433;
    --r1:8px; --r2:10px; --r3:12px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --elev2:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -16px rgba(0,0,0,.80);
    --t-eyebrow:10.5px; --t-cap:12px; --t-body:13px; --t-base:14px; --t-strong:16px; --t-fig:22px;
    --tier-hot:#f87171; --tier-warm:#fbbf24; --tier-cool:#7e8a9c;
  }
  /* light theme (default) */
  :root[data-theme=light]{
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#f3f6fb; --panel3:#eaf0f7;
    --line:#e2e8f1; --line-soft:#eef2f8; --line2:#d3dbe6; --chip:#f0f4fa;
    --txt:#17202e; --txt-dim:#3a4658; --muted:#616d80; --faint:#93a0b2;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --elev2:0 1px 0 rgba(0,0,0,.02) inset,0 10px 26px -18px rgba(20,30,50,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:var(--t-base)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;padding-left:58px;background:linear-gradient(180deg,var(--panel),var(--bg));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:5px 10px;line-height:0;box-shadow:var(--elev1)}
  .brand img{height:26px;display:block}
  header h1{font-size:var(--t-strong);margin:0;font-weight:800;letter-spacing:.2px}
  .spacer{flex:1}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r1);padding:7px 11px;font:inherit}
  select:focus{outline:none;box-shadow:var(--ring);border-color:var(--accent)}
  .who{font-size:var(--t-cap);color:var(--muted)}
  main{max-width:1180px;margin:0 auto;padding:22px}
  .over{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:800}
  .htitle{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:2px 0 4px}
  .hblurb{color:var(--muted);font-size:var(--t-cap);max-width:760px;margin:0 0 16px;line-height:1.55}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);font-weight:700;font-size:var(--t-cap);cursor:pointer}
  .tab:hover{border-color:var(--line2)}
  .tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .tab .n{opacity:.7;font-weight:600;margin-left:4px}
  /* Fresh · running ads = the DATA POOL (source universe), shown on top, distinct from the stages */
  #pool{margin-bottom:14px}
  .pool-card{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;cursor:pointer;
    background:linear-gradient(120deg,var(--accent-soft),transparent);border:1px solid var(--accent);
    border-radius:var(--r3);padding:13px 18px;transition:box-shadow .15s}
  .pool-card:hover{box-shadow:var(--ring)}
  .pool-card.active{box-shadow:var(--ring)}
  .pool-card .pl{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.7px;color:var(--accent);font-weight:800}
  .pool-card .pv{font-size:var(--t-strong);font-weight:800;color:var(--txt)}
  .pool-card .pv b{color:var(--accent);font-variant-numeric:tabular-nums}
  .pool-card .ps{font-size:var(--t-cap);color:var(--muted);flex:1 1 260px;min-width:180px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--elev2);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:var(--t-cap)}
  thead th{text-align:left;color:var(--faint);font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .biz{font-weight:700;color:var(--txt)}
  .dom{color:var(--muted);font-size:11px}
  .num{font-variant-numeric:tabular-nums;color:var(--txt-dim)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
  .t-hot{color:var(--tier-hot);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)}
  .t-warm{color:var(--tier-warm);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
  .t-cool,.t-none{color:var(--muted);background:var(--chip)}
  .next-ok{color:var(--good);font-weight:700}
  .next-none{color:var(--faint)}
  .muted{color:var(--muted)} .small{font-size:var(--t-cap)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .sub{font-size:11px;color:var(--muted)}
  /* loading spinner + skeleton */
  .loadwrap{padding:46px 20px;text-align:center;color:var(--muted);font-size:var(--t-cap)}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:9px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
  .tab .n.ldg{opacity:.35;animation:tabpulse 1.1s ease-in-out infinite}
  @keyframes tabpulse{50%{opacity:.7}}
  /* pagination */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:11px 14px;border-top:1px solid var(--line-soft);background:var(--panel2)}
  .pager .pgi{font-size:var(--t-cap);color:var(--muted)}
  .pager .pgi b{color:var(--txt-dim);font-variant-numeric:tabular-nums}
  .pager .pgc{display:flex;align-items:center;gap:10px}
  .pager .pgn{font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums}
  .pgbtn{background:var(--panel);color:var(--txt-dim);border:1px solid var(--line);border-radius:var(--r1);
    padding:6px 12px;font:inherit;font-size:var(--t-cap);font-weight:700;cursor:pointer}
  .pgbtn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
  .pgbtn[disabled]{opacity:.4;cursor:not-allowed}
  /* existing-agency assignment controls (in-board) */
  .assign{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
  .assign select{padding:5px 8px;font-size:var(--t-cap);max-width:150px}
  /* ---- theme toggle + nav drawer (shared) ---- */
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:17px;cursor:pointer;box-shadow:var(--elev1);display:flex;align-items:center;justify-content:center}
  .tr-theme-btn:hover{border-color:var(--accent)}

  /* ---- persistent icon rail (Claude-style): always-visible slim nav that expands on hover ---- */
  :root{--rail-w:58px;--rail-open:238px}
  body{padding-left:var(--rail-w)}
  html.tv body{padding-left:0}
  html.tv .tr-rail{display:none}
  .tr-rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail-w);z-index:60;box-sizing:border-box;
    background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:10px 0;overflow:hidden;transition:width .19s cubic-bezier(.4,0,.2,1),box-shadow .19s}
  .tr-rail:hover,.tr-rail:focus-within{width:var(--rail-open);box-shadow:22px 0 48px -30px rgba(8,12,20,.6)}
  .tr-rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
  .tr-rail-nav::-webkit-scrollbar{width:0}
  .tr-rail-foot{flex:none;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .tr-rail-item,.tr-rail-user{display:flex;align-items:center;height:42px;margin:0 8px;border-radius:10px;
    color:var(--txt-dim);text-decoration:none;font-weight:600;font-size:13.5px;overflow:hidden;white-space:nowrap;
    transition:background .12s,color .12s}
  .tr-rail-item:hover{background:var(--panel2);color:var(--txt)}
  .tr-rail-item.active{background:var(--accent-soft);color:var(--accent)}
  .tr-rail-item .ic,.tr-rail-user .ic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail svg{width:20px;height:20px;flex:none}
  .tr-rail .lbl{opacity:0;transition:opacity .16s;letter-spacing:-.1px}
  .tr-rail:hover .lbl,.tr-rail:focus-within .lbl{opacity:1}
  .tr-rail-user .av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .tr-rail-user .lbl{font-weight:600;font-size:12.5px;color:var(--txt-dim);overflow:hidden;text-overflow:ellipsis;max-width:150px}
  :root[data-theme=light] .tr-rail{box-shadow:none}
  :root[data-theme=light] .tr-rail:hover,:root[data-theme=light] .tr-rail:focus-within{box-shadow:22px 0 48px -30px rgba(20,30,50,.35)}
  /* ===== PREMIUM POLISH — bring the pipeline board up to the dashboard's craft: layered material
     elevation, editorial letter-spacing, instrument-grade numerals, refined tabs + tables. Appended
     last so it wins the cascade; verified in both themes. Structure/DOM untouched. ===== */
  :root{
    --mat-elev:       inset 0 1px 0 rgba(255,255,255,.035), 0 1px 2px rgba(0,0,0,.34), 0 6px 16px -12px rgba(0,0,0,.60);
    --mat-elev-hover: inset 0 1px 0 rgba(255,255,255,.05),  0 1px 2px rgba(0,0,0,.38), 0 10px 24px -14px rgba(0,0,0,.70);
    --mat-elev-hero:  inset 0 1px 0 rgba(255,255,255,.05),  0 1px 2px rgba(0,0,0,.40), 0 18px 42px -24px rgba(0,0,0,.82);
  }
  :root[data-theme=light]{
    --mat-elev:       inset 0 1px 0 rgba(255,255,255,.90), 0 1px 2px rgba(20,30,50,.06), 0 6px 16px -12px rgba(20,30,50,.16);
    --mat-elev-hover: inset 0 1px 0 rgba(255,255,255,1),   0 1px 2px rgba(20,30,50,.08), 0 10px 24px -14px rgba(20,30,50,.22);
    --mat-elev-hero:  inset 0 1px 0 rgba(255,255,255,1),   0 1px 2px rgba(20,30,50,.07), 0 18px 42px -26px rgba(20,30,50,.26);
  }
  body{font-variant-numeric:tabular-nums slashed-zero;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  /* masthead + eyebrow + blurb */
  header h1{letter-spacing:-.35px}
  #ptitle{letter-spacing:-.4px;font-weight:820}
  .over{letter-spacing:.09em}
  .hblurb{letter-spacing:-.003em;line-height:1.6}
  .sectionlabel,.pl{letter-spacing:.09em}
  /* elevated stage tabs (keep the pill shape, add depth + calm hover) */
  .tab{letter-spacing:-.05px;box-shadow:var(--mat-elev);
    transition:color .14s,background .14s,border-color .14s,box-shadow .14s,transform .14s}
  .tab:hover{box-shadow:var(--mat-elev-hover);transform:translateY(-1px)}
  .tab.active{box-shadow:var(--mat-elev-hover)}
  .tab .n{font-variant-numeric:tabular-nums;letter-spacing:.01em}
  /* cards + data-pool card: material depth */
  .card{box-shadow:var(--mat-elev-hero);transition:box-shadow .15s ease,border-color .15s ease}
  .pool-card{box-shadow:var(--mat-elev)}
  .pool-card .pv b{font-variant-numeric:tabular-nums slashed-zero}
  /* tables: crisper header, calm row hover, tighter name tracking */
  thead th{letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.02),0 1px 0 var(--line)}
  :root[data-theme=light] thead th{box-shadow:inset 0 1px 0 rgba(255,255,255,.70),0 1px 0 var(--line)}
  tbody tr{transition:background .12s}
  .biz{letter-spacing:-.1px}
  .num,.pager .pgi b,.pager .pgn{font-variant-numeric:tabular-nums slashed-zero}
  /* pager sits like a card footer */
  .pager{box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
  /* header logo: drop the stark white chip; adapt to the theme (full colour on light, crisp white
     on dark) so the wordmark reads on the dark app bar without a box. */
  .brand{background:transparent !important;border:0 !important;box-shadow:none !important;padding:0 !important}
  .brand img{filter:brightness(0) invert(1);opacity:.92}
  :root[data-theme=light] .brand img{filter:none;opacity:1}
  /* rail brand: collapsed = the 3-bar chart mark; expanded = the REAL logo image (exact wordmark),
     crossfaded. White on the dark rail, full colour on light. */
  .tr-rail-brand{position:relative;display:block;height:46px;margin:2px 8px 8px;color:var(--txt-dim)}
  .tr-rail-brand .barsic{position:absolute;left:0;top:0;width:42px;height:46px;display:flex;align-items:center;
    justify-content:center;opacity:1;transition:opacity .15s}
  .tr-rail-brand .barsic svg{width:23px;height:23px}
  .tr-rail-brand .fulllogo{position:absolute;left:12px;top:50%;transform:translateY(-50%);height:24px;
    opacity:0;transition:opacity .18s;pointer-events:none;max-width:none;filter:brightness(0) invert(1)}
  :root[data-theme=light] .tr-rail-brand .fulllogo{filter:none}
  .tr-rail:hover .tr-rail-brand .barsic,.tr-rail:focus-within .tr-rail-brand .barsic{opacity:0}
  .tr-rail:hover .tr-rail-brand .fulllogo,.tr-rail:focus-within .tr-rail-brand .fulllogo{opacity:1}
  @media (prefers-reduced-motion:reduce){.tab,.card{transition:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logo.png" alt="Traffic Radius" /></a>
  <div><div class="over">Pipeline board</div><h1 id="ptitle">Pipeline</h1></div>
  <span class="spacer"></span>
  <select id="bdeFilter" style="display:none"></select>
  <span class="who" id="who"></span>
</header>
<main>
  <div id="pool"></div>
  <div class="over" style="margin:2px 0 8px">Pipeline stages</div>
  <div class="tabs" id="tabs"></div>
  <p class="hblurb" id="blurb"></p>
  <div class="toolbar" id="toolbar"></div>
  <div class="card"><div id="board"><div class="loadwrap"><span class="spin"></span>Loading…</div></div></div>
</main>

<script>
const $=s=>document.querySelector(s);
// The pipelines are the follow-up buckets a fresh Google-Ads call flows into once it's worked.
// Architecture unchanged; the calling universe is the confirmed-Google-Ads pool.
const STAGES={
  p1:{label:'RPC callback',blurb:'We reached the decision-maker and they asked us to call back — warm, keep the thread alive and lock the meeting.',icon:'\u{1F4DE}',win:true},
  p3:{label:'Gatekeeper callback',blurb:'We got a gatekeeper, not the decision-maker yet — get through and secure a direct line / callback time.',icon:'\u{1F6E1}️',win:true},
  p4:{label:'Fresh · running ads',blurb:'The full confirmed-Google-Ads data pool — every callable business. Those already worked flow into the pipeline stages above; the rest are fresh first-contacts.',icon:'\u{1F195}',win:false},
  retry:{label:'Retry calls',blurb:'Dialed but never connected — no answer, voicemail. Re-call at a different time (a fresh 3CX/Aircall line often gets a pickup); stops after the attempt cap.',icon:'\u{1F504}',win:true},
  reached:{label:'Reached DM · no next step',blurb:'We spoke to the decision-maker but they left no callback or booking (often a soft “not interested” or “send me info”). Warmer than a cold no-answer — keep calling (different time / a different BDE) until they show interest; every call carries the full history.',icon:'\u{1F464}',win:true},
  p5:{label:'Booked',blurb:'Meeting secured — confirm and prepare the session.',icon:'✅',win:true},
  p2:{label:'Existing agency',blurb:'Already working with another agency — nurture until their contract is up, and stay top-of-mind for the switch. Assign a BDE, mark DND or re-sync the rotation right here.',icon:'\u{1F501}',win:true},
};
// Fresh · running ads (p4) is the DATA POOL (the confirmed-Google-Ads source universe), not a
// pipeline stage — it's rendered separately on top. The pipeline STAGES a prospect flows through:
const ORDER=['p1','p3','retry','reached','p5','p2'];
// Human-readable URL slug per stage: /pipeline/gatekeeper-callback instead of /pipeline/p3.
const SLUG={p1:'rpc-callback',p3:'gatekeeper-callback',retry:'retry-calls',reached:'reached-no-next-step',p5:'booked',p2:'existing-agency'};
const BY_SLUG=Object.fromEntries(Object.entries(SLUG).map(([k,v])=>[v,k]));
// /datapool = the Fresh data pool (p4); /pipeline/<slug> = a pipeline stage (legacy /pipeline/p1 codes still work).
let seg=(location.pathname.split('/').filter(Boolean)[1]||'').toLowerCase();
let stage=(location.pathname==='/datapool')?'p4':(BY_SLUG[seg]||seg||'p1');
if(!STAGES[stage]) stage='p1';
let bde='ALL', win='all', counts={}, page=0;
const PAGE=100;   // rows per page — the board paginates so EVERY prospect is reachable
const WINDOWS=[['all','All time'],['today','Today'],['d3','3d'],['d7','7d'],['d14','14d'],['d30','30d']];

async function api(u,o){const r=await fetch(u,o);let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));return j;}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(s){if(!s)return '';try{const d=new Date(s.replace(' ','T'));if(isNaN(d))return s.slice(0,10);return d.toLocaleDateString('en-AU',{timeZone:'Australia/Melbourne',day:'numeric',month:'short'});}catch(e){return s.slice(0,10);}}
function tierClass(t){t=(t||'').toLowerCase();if(t.includes('super')||t==='hot')return 't-hot';if(t==='warm')return 't-warm';return 't-cool';}

function renderPool(){
  const n = counts.p4!=null ? Number(counts.p4).toLocaleString() : '…';
  $('#pool').innerHTML =
    `<div class="pool-card${stage==='p4'?' active':''}" onclick="location.href='/datapool'" title="Open the data pool">
      <span class="pl">\u{1F4CA} Data pool</span>
      <span class="pv">\u{1F3AF} Fresh · running ads <b>${n}</b></span>
      <span class="ps">The confirmed Google-Ads calling universe — every callable business. Those already worked show in the stages below; the rest are fresh first-contacts.<br><span style="opacity:.8">Source: D&amp;B company database · confirmed running Google Ads via DataForSEO Ads Transparency Center.</span></span>
    </div>`;
}
function renderTabs(){
  // Every stage (incl. Existing agency = p2) is an in-board tab now: /pipeline/<slug>. The old standalone
  // /pipeline2 assignment board is merged into the Existing-agency tab (it redirects here).
  $('#tabs').innerHTML=ORDER.map(s=>`<a class="tab${s===stage?' active':''}" href="/pipeline/${SLUG[s]||s}">${STAGES[s].icon} ${STAGES[s].label}${counts[s]!=null?`<span class="n">${counts[s]}</span>`:''}</a>`).join('');
}
function renderToolbar(){
  const meta=STAGES[stage];
  $('#toolbar').innerHTML = meta.win ? WINDOWS.map(w=>`<button class="tab${w[0]===win?' active':''}" onclick="setWin('${w[0]}')">${w[1]}</button>`).join('') : '';
}
window.setWin=function(w){win=w;page=0;renderToolbar();loadBoard();};

function row(r){
  // Name column: company name, else classified company, else domain. NEVER the phone number
  // (it's already shown in its own column) — falling back to it made the board show phone-as-name.
  const biz=esc(r.business_name||r.prospect_company||r.domain||'—');
  const key=(r.dest_number||'').replace(/[^0-9]/g,'');
  const nc=r.next_call_at;
  const ncTxt=nc?`<span class="next-ok">${esc(fmtDate(nc))}</span>${r.next_call_bde?` <span class="sub">${esc(r.next_call_bde)}</span>`:''}`:'<span class="next-none">—</span>';
  const bizCell=`<td><a href="/prospect/${encodeURIComponent(key||r.domain||'')}"><span class="biz">${biz}</span></a>${r.domain?`<div class="dom">${esc(r.domain)}</div>`:''}</td>`;
  if(stage==='p4'){   // confirmed-ads pool: business · phone · industry · revenue · next call
    return `<tr>${bizCell}
      <td class="num">${esc(r.dest_number||'—')}</td>
      <td>${r.industry?esc(r.industry):'<span class="muted">—</span>'}</td>
      <td class="r num">${r.revenue_musd!=null?('$'+Math.round(r.revenue_musd)+'M'):''}</td>
      <td>${ncTxt}</td>
    </tr>`;
  }
  const tier=r.lead_temperature;
  const tierCell=tier?`<span class="pill ${tierClass(tier)}">${esc(tier)}</span>`:'';
  return `<tr>${bizCell}
    <td class="num">${esc(r.dest_number||'')}</td>
    <td>${tierCell}</td>
    <td class="r num">${r.ncalls!=null?r.ncalls:''}</td>
    <td class="num">${esc(fmtDate(r.started_at))}</td>
    <td>${ncTxt}</td>
    <td>${esc(r.bde||r.next_call_bde||'')}</td>
  </tr>`;
}

function pager(total){
  // total = full count for this stage (server-provided). Page through it so every prospect is reachable.
  if(!total || total<=PAGE) return '';
  const pages=Math.ceil(total/PAGE), from=page*PAGE+1, to=Math.min(total,(page+1)*PAGE);
  return `<div class="pager">
    <span class="pgi">Showing <b>${from.toLocaleString()}–${to.toLocaleString()}</b> of <b>${total.toLocaleString()}</b></span>
    <span class="pgc">
      <button class="pgbtn" ${page<=0?'disabled':''} onclick="goPage(${page-1})">‹ Prev</button>
      <span class="pgn">Page ${page+1} / ${pages}</span>
      <button class="pgbtn" ${page>=pages-1?'disabled':''} onclick="goPage(${page+1})">Next ›</button>
    </span></div>`;
}
window.goPage=function(p){ if(p<0)return; page=p; loadBoard(); window.scrollTo({top:0,behavior:'smooth'}); };

// ---- Existing agency (p2) = the assignment board, rendered IN this pipeline board (assign BDE /
// DND / cadence / sync). Reads /api/pipeline2 (the same 104 GAds prospects the old page showed). ----
let P2={can:false, roster:[]};
function p2Row(r){
  const due = r.next_action_at ? (new Date(String(r.next_action_at).replace(' ','T'))<=new Date()) : true;
  const name = esc(r.business_name||r.domain||'—');
  const key=(r.dest_number||r.dest9||'');
  const prospect = `<td><a href="/prospect/${encodeURIComponent(key)}"><span class="biz">${name}</span></a>`
    + `<div class="dom">${esc(r.dest_number||'')}${r.domain?' · '+esc(r.domain):''}</div></td>`;
  const status = r.dnd
    ? `<span class="pill t-hot" title="${esc(r.dnd_reason||'')}${r.dnd_by?' ('+esc(r.dnd_by)+')':''}">🚫 DND</span>`
    : (due?`<span class="pill t-warm">Due now</span>`:`<span class="pill t-cool">Scheduled</span>`)
      + (r.override_by?` <span class="pill t-cool" title="set by ${esc(r.override_by)}">override</span>`:'');
  const contract = r.contract_end ? `📄 ${esc(r.contract_end)}` : `<span class="muted">~${r.cadence_days||30}d</span>`;
  let cells = prospect + `<td>${esc(r.last_bde||'—')}</td>`;
  if(P2.can) cells += `<td><b>${esc(r.assigned_bde||'—')}</b></td>`;
  cells += `<td class="num">${esc(fmtDate(r.next_action_at))}</td><td>${contract}</td>`
    + `<td class="r num">${r.attempts!=null?r.attempts:''}</td><td>${status}</td>`;
  if(P2.can){
    const opts=P2.roster.map(b=>`<option ${b===r.assigned_bde?'selected':''}>${esc(b)}</option>`).join('');
    const dndBtn = r.dnd
      ? `<button class="pgbtn dndbtn" data-d="${esc(r.dest9)}" data-on="0">Un-DND</button>`
      : `<button class="pgbtn dndbtn" data-d="${esc(r.dest9)}" data-on="1" title="Mark do-not-call">🚫</button>`;
    cells += `<td><span class="assign"><select class="rsel" data-d="${esc(r.dest9)}">${opts}</select>`
      + ` <button class="pgbtn rbtn" data-d="${esc(r.dest9)}">Set</button> ${dndBtn}</span></td>`;
  }
  return `<tr class="${due?'':''}">${cells}</tr>`;
}
async function loadBoardP2(silent){
  if(!silent) $('#board').innerHTML='<div class="loadwrap"><span class="spin"></span>Loading…</div>';
  try{
    const d=await api(`/api/pipeline2?bde=${encodeURIComponent(bde)}&window=${win}`);
    P2.can=!!d.can_assign; P2.roster=d.roster||[];
    const rows=d.rows||[];
    if(!rows.length){$('#board').innerHTML='<div class="empty">No existing-agency prospects'+(bde!=='ALL'?' for '+esc(bde):'')+' right now.</div>';return;}
    const head = P2.can
      ? '<th>Prospect</th><th>Last caller</th><th>Next BDE</th><th>Due</th><th>Contract / cadence</th><th class="r">Attempts</th><th>Status</th><th>Reassign</th>'
      : '<th>Prospect</th><th>Last caller</th><th>Due</th><th>Contract / cadence</th><th class="r">Attempts</th><th>Status</th>';
    const sync = P2.can?`<div class="pager"><span class="pgi">${rows.length} existing-agency prospect${rows.length===1?'':'s'} · Google-Ads-confirmed</span><button class="pgbtn" id="p2sync" title="Recalculate the BDE rotation">↻ Sync assignments</button></div>`:'';
    $('#board').innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${rows.map(p2Row).join('')}</tbody></table>${sync}`;
    const sb=document.getElementById('p2sync');
    if(sb) sb.onclick=async()=>{ try{ const j=await api('/api/pipeline2/sync',{method:'POST'}); alert('Synced: '+(j.stats?j.stats.prospects:'?')+' prospects, '+(j.stats?j.stats.reassigned:'?')+' reassigned'); loadBoardP2(); }catch(e){ alert('Sync error: '+e.message); } };
  }catch(e){ if(!silent) $('#board').innerHTML='<div class="empty">Could not load ('+esc(e.message)+').</div>'; }
}
// reassign / DND actions (delegated, only fire on the agency board's controls)
document.addEventListener('click', async e=>{
  const dnd=e.target.closest('.dndbtn');
  if(dnd){ const dest9=dnd.dataset.d, on=dnd.dataset.on==='1'; let reason='';
    if(on){ reason=prompt('Reason for DND (do not call):','Asked to be removed'); if(reason===null) return; }
    try{ await api(`/api/pipeline2/${encodeURIComponent(dest9)}/dnd`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dnd:on,reason})}); loadBoardP2(); }
    catch(err){ alert('Error: '+err.message); } return; }
  const b=e.target.closest('.rbtn'); if(!b) return;
  const dest9=b.dataset.d; const sel=document.querySelector(`.rsel[data-d="${CSS.escape(dest9)}"]`);
  try{ await api(`/api/pipeline2/${encodeURIComponent(dest9)}/assign`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bde:sel?sel.value:''})}); loadBoardP2(); }
  catch(err){ alert('Error: '+err.message); }
});

async function loadBoard(silent){
  if(stage==='p2') return loadBoardP2(silent);
  if(!silent) $('#board').innerHTML='<div class="loadwrap"><span class="spin"></span>Loading…</div>';
  try{
    const d=await api(`/api/pipeline5-prospects?pipeline=${stage}&window=${win}&bde=${encodeURIComponent(bde)}&limit=${PAGE}&offset=${page*PAGE}&gads_only=1`);
    const rows=d.rows||[];
    const total=(d.total!=null)?d.total:rows.length;
    if(!rows.length && page>0){ page=0; return loadBoard(silent); }   // ran past the last page → snap back
    if(!rows.length){$('#board').innerHTML='<div class="empty">Nothing in this pipeline'+(bde!=='ALL'?' for '+esc(bde):'')+' right now.</div>';return;}
    const head = stage==='p4'
      ? '<th>Business</th><th>Phone</th><th>Industry</th><th class="r">Revenue</th><th>Next call</th>'
      : `<th>Prospect</th><th>Phone</th><th>Temp</th><th class="r">Calls</th><th>Last call</th><th>Next call</th><th>BDE</th>`;
    $('#board').innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${rows.map(row).join('')}</tbody></table>${pager(total)}`;
  }catch(e){ if(!silent) $('#board').innerHTML='<div class="empty">Could not load ('+esc(e.message)+').</div>'; }
}

// Live auto-refresh: the pipeline counts + board update as BDEs keep calling (the cloud loop ingests
// and re-classifies new calls continuously). Poll every 60s; skip while the tab is hidden.
async function refreshCounts(){
  try{
    const p=await api('/api/pipelines5?gads_only=1');
    (p.rows||[]).forEach(r=>{counts[r.pipeline]=Object.values(r.counts||{}).length?Math.max(...Object.values(r.counts)):null;});
    if(p.pools){counts.p4=p.pools.running_ads; counts.retry=p.pools.retry; counts.reached=p.pools.reached; if(p.pools.p2!=null)counts.p2=p.pools.p2;}
    renderPool(); renderTabs();
  }catch(e){}
}
(function(){  // LIVE: refresh on server push (SSE /api/events) + 60s poll fallback; pause when hidden
  var es,rt; function go(){ if(!document.hidden){ refreshCounts(); loadBoard(true); } }
  setInterval(go,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) go(); });
  (function s(){ try{ es=new EventSource('/api/events'); es.addEventListener('refresh',go);
    es.onerror=function(){ if(es&&es.readyState===2&&!rt) rt=setTimeout(function(){rt=null;s();},5000); }; }catch(e){} })();
})();

async function boot(){
  const meta=STAGES[stage]||STAGES.p1;
  document.title=meta.label+' — Pipeline';
  $('#ptitle').textContent=meta.label;
  $('#blurb').textContent=meta.blurb;
  // Render the chrome + START the board rows fetch IMMEDIATELY. The tab counts and BDE filter load
  // in PARALLEL (they used to block the board for ~4s) and fill in as they arrive.
  renderPool(); renderTabs(); renderToolbar();
  loadBoard();
  api('/api/me').then(me=>{
    $('#who').textContent=(me.name||me.email||'')+' · '+(me.role||'');
    if(me.role!=='bde'){   // admin / BDM / manager / kiosk get a BDE picker (a BDE sees only their own)
      api('/api/summary').then(s=>{
        $('#bdeFilter').innerHTML=['<option value="ALL">All BDEs</option>'].concat((s.bdes||[]).filter(b=>b!=='ALL').map(b=>`<option>${esc(b)}</option>`)).join('');
        $('#bdeFilter').style.display=''; $('#bdeFilter').onchange=()=>{bde=$('#bdeFilter').value;page=0;loadBoard();};
      }).catch(()=>{});
    }
  }).catch(()=>{});
  api('/api/pipelines5?gads_only=1').then(p=>{
    (p.rows||[]).forEach(r=>{counts[r.pipeline]=Object.values(r.counts||{}).length?Math.max(...Object.values(r.counts)):null;});
    if(p.pools){counts.p4=p.pools.running_ads; counts.retry=p.pools.retry; counts.reached=p.pools.reached; if(p.pools.p2!=null)counts.p2=p.pools.p2;}
    renderPool(); renderTabs();
  }).catch(()=>{});
}
boot();
</script>
