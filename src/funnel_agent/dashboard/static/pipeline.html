<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline — 3CX Funnel</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14); --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1a2433;
    --r1:8px; --r2:10px; --r3:12px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --elev2:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -16px rgba(0,0,0,.80);
    --t-eyebrow:10.5px; --t-cap:12px; --t-body:13px; --t-base:14px; --t-strong:16px; --t-fig:22px;
    --tier-hot:#f87171; --tier-warm:#fbbf24; --tier-cool:#7e8a9c;
  }
  /* light theme (default) */
  :root[data-theme=light]{
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#f3f6fb; --panel3:#eaf0f7;
    --line:#e2e8f1; --line-soft:#eef2f8; --line2:#d3dbe6; --chip:#f0f4fa;
    --txt:#17202e; --txt-dim:#3a4658; --muted:#616d80; --faint:#93a0b2;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --elev2:0 1px 0 rgba(0,0,0,.02) inset,0 10px 26px -18px rgba(20,30,50,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:var(--t-base)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;padding-left:58px;background:linear-gradient(180deg,var(--panel),var(--bg));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:5px 10px;line-height:0;box-shadow:var(--elev1)}
  .brand img{height:24px;display:block}
  header h1{font-size:var(--t-strong);margin:0;font-weight:800;letter-spacing:.2px}
  .spacer{flex:1}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r1);padding:7px 11px;font:inherit}
  select:focus{outline:none;box-shadow:var(--ring);border-color:var(--accent)}
  .who{font-size:var(--t-cap);color:var(--muted)}
  main{max-width:1180px;margin:0 auto;padding:22px}
  .over{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:800}
  .htitle{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:2px 0 4px}
  .hblurb{color:var(--muted);font-size:var(--t-cap);max-width:760px;margin:0 0 16px;line-height:1.55}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);font-weight:700;font-size:var(--t-cap);cursor:pointer}
  .tab:hover{border-color:var(--line2)}
  .tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .tab .n{opacity:.7;font-weight:600;margin-left:4px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--elev2);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:var(--t-cap)}
  thead th{text-align:left;color:var(--faint);font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .biz{font-weight:700;color:var(--txt)}
  .dom{color:var(--muted);font-size:11px}
  .num{font-variant-numeric:tabular-nums;color:var(--txt-dim)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
  .t-hot{color:var(--tier-hot);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3)}
  .t-warm{color:var(--tier-warm);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
  .t-cool,.t-none{color:var(--muted);background:var(--chip)}
  .next-ok{color:var(--good);font-weight:700}
  .next-none{color:var(--faint)}
  .muted{color:var(--muted)} .small{font-size:var(--t-cap)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .sub{font-size:11px;color:var(--muted)}
  /* ---- theme toggle + nav drawer (shared) ---- */
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:17px;cursor:pointer;box-shadow:var(--elev1);display:flex;align-items:center;justify-content:center}
  .tr-theme-btn:hover{border-color:var(--accent)}
  .tr-nav-btn{position:fixed;top:13px;left:14px;z-index:96;width:34px;height:34px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--txt-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;transition:background .12s,color .12s,border-color .12s}
  .tr-nav-btn:hover{background:var(--panel2);border-color:var(--line);color:var(--txt)}
  .tr-drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--panel);border-right:1px solid var(--line);box-shadow:0 24px 60px -24px rgba(8,12,20,.55);transform:translateX(-102%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:101;padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .tr-drawer.open{transform:none}
  .tr-drawer-hd{padding:6px 10px 12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;font-size:11px;color:var(--faint)}
  .tr-drawer a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--txt-dim);font-weight:600;font-size:13.5px}
  .tr-drawer a:hover{background:var(--panel2);color:var(--txt)}
  .tr-drawer a.active{background:var(--accent-soft);color:var(--accent)}
  .tr-drawer a .i{width:20px;text-align:center;font-size:15px}
  .tr-drawer-backdrop{position:fixed;inset:0;background:rgba(8,12,20,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
  .tr-drawer-backdrop.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/static/logo.png" alt="Traffic Radius" onerror="this.parentElement.textContent='Traffic Radius'"></a>
  <div><div class="over">Pipeline board</div><h1 id="ptitle">Pipeline</h1></div>
  <span class="spacer"></span>
  <select id="bdeFilter" style="display:none"></select>
  <span class="who" id="who"></span>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <p class="hblurb" id="blurb"></p>
  <div class="toolbar" id="toolbar"></div>
  <div class="card"><div id="board"><div class="empty">Loading…</div></div></div>
</main>

<script>
const $=s=>document.querySelector(s);
const STAGES={
  p1:{label:'RPC callback',blurb:'We reached the decision-maker and they asked us to call back — warm, keep the thread alive and lock the meeting.',icon:'\u{1F4DE}',win:true},
  p3:{label:'Gatekeeper callback',blurb:'We got a gatekeeper, not the decision-maker yet — get through and secure a direct line / callback time.',icon:'\u{1F6E1}️',win:true},
  p4:{label:'Fresh worklist',blurb:'Not yet worked — first-contact pool (running-ads and captured prospects prioritised).',icon:'\u{1F195}',win:false},
  p5:{label:'Booked',blurb:'Meeting secured — confirm and prepare the session.',icon:'✅',win:true},
};
const ORDER=['p1','p3','p4','p5'];
const stage=(location.pathname.split('/').filter(Boolean)[1]||'p1').toLowerCase();
let bde='ALL', win='d30', counts={};
const WINDOWS=[['d1','Today'],['d3','3d'],['d7','7d'],['d14','14d'],['d30','30d']];

async function api(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(s){if(!s)return '';try{const d=new Date(s.replace(' ','T'));if(isNaN(d))return s.slice(0,10);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});}catch(e){return s.slice(0,10);}}
function tierClass(t){t=(t||'').toLowerCase();if(t.includes('super')||t==='hot')return 't-hot';if(t==='warm')return 't-warm';return 't-cool';}

function renderTabs(){
  $('#tabs').innerHTML=ORDER.map(s=>`<a class="tab${s===stage?' active':''}" href="/pipeline/${s}">${STAGES[s].icon} ${STAGES[s].label}${counts[s]!=null?`<span class="n">${counts[s]}</span>`:''}</a>`).join('')
    +`<a class="tab" href="/pipeline2">\u{1F501} Existing agency</a>`;
}
function renderToolbar(){
  const meta=STAGES[stage];
  $('#toolbar').innerHTML = meta.win ? WINDOWS.map(w=>`<button class="tab${w[0]===win?' active':''}" onclick="setWin('${w[0]}')">${w[1]}</button>`).join('') : '';
}
window.setWin=function(w){win=w;renderToolbar();loadBoard();};

function row(r){
  const biz=esc(r.business_name||r.prospect_company||r.dest_number||'—');
  const key=(r.dest_number||'').replace(/[^0-9]/g,'');
  const nc=r.next_call_at;
  const ncTxt=nc?`<span class="next-ok">${esc(fmtDate(nc))}</span>${r.next_call_bde?` <span class="sub">${esc(r.next_call_bde)}</span>`:''}`:'<span class="next-none">—</span>';
  const tier=r.lead_temperature;
  const tierCell=tier?`<span class="pill ${tierClass(tier)}">${esc(tier)}</span>`:(r.p4_subpipeline?`<span class="pill t-cool">${esc((r.p4_subpipeline||'').replace('fresh_','').replace('_',' '))}</span>`:'');
  return `<tr>
    <td><a href="/prospect/${encodeURIComponent(key||r.domain||'')}"><span class="biz">${biz}</span></a>${r.domain?`<div class="dom">${esc(r.domain)}</div>`:''}</td>
    <td class="num">${esc(r.dest_number||'')}</td>
    <td>${tierCell}</td>
    <td class="r num">${r.ncalls!=null?r.ncalls:''}</td>
    <td class="num">${esc(fmtDate(r.started_at))}</td>
    <td>${ncTxt}</td>
    <td>${esc(r.bde||r.next_call_bde||'')}</td>
  </tr>`;
}

async function loadBoard(){
  $('#board').innerHTML='<div class="empty">Loading…</div>';
  try{
    const d=await api(`/api/pipeline5-prospects?pipeline=${stage}&window=${win}&bde=${encodeURIComponent(bde)}`);
    const rows=d.rows||[];
    if(!rows.length){$('#board').innerHTML='<div class="empty">No prospects in this pipeline'+(bde!=='ALL'?' for '+esc(bde):'')+' right now.</div>';return;}
    $('#board').innerHTML=`<table><thead><tr>
      <th>Prospect</th><th>Phone</th><th>${STAGES[stage].win?'Temp':'Status'}</th><th class="r">Calls</th><th>Last call</th><th>Next call</th><th>BDE</th>
    </tr></thead><tbody>${rows.map(row).join('')}</tbody></table>`;
  }catch(e){$('#board').innerHTML='<div class="empty">Could not load ('+esc(e.message)+').</div>';}
}

async function boot(){
  const meta=STAGES[stage]||STAGES.p1;
  document.title=meta.label+' — Pipeline';
  $('#ptitle').textContent=meta.label;
  $('#blurb').textContent=meta.blurb;
  // BDE filter + counts
  try{
    const me=await api('/api/me'); $('#who').textContent=(me.name||me.email||'')+' · '+(me.role||'');
    if(me.role==='manager'||me.role==='admin'||me.role==='kiosk'){
      const s=await api('/api/summary');
      $('#bdeFilter').innerHTML=['<option value="ALL">All BDEs</option>'].concat((s.bdes||[]).filter(b=>b!=='ALL').map(b=>`<option>${esc(b)}</option>`)).join('');
      $('#bdeFilter').style.display=''; $('#bdeFilter').onchange=()=>{bde=$('#bdeFilter').value;loadBoard();};
    }
  }catch(e){}
  try{ const p=await api('/api/pipelines5'); (p.rows||[]).forEach(r=>{counts[r.pipeline]=Object.values(r.counts||{}).length?Math.max(...Object.values(r.counts)):null;}); if(p.pools)counts.p4=p.pools.total; }catch(e){}
  renderTabs(); renderToolbar(); loadBoard();
}
boot();
</script>
<button class="tr-theme-btn" title="Toggle light / dark" aria-label="Toggle theme" onclick="var e=document.documentElement,n=e.getAttribute('data-theme')==='light'?'dark':'light';e.setAttribute('data-theme',n);try{localStorage.setItem('tr-theme',n)}catch(x){};this.textContent=n==='light'?'\u{1F319}':'☀️'">🌙</button>
<button class="tr-nav-btn" aria-label="Open navigation menu" onclick="var d=document.querySelector('.tr-drawer'),b=document.querySelector('.tr-drawer-backdrop');d.classList.toggle('open');b.classList.toggle('open')">☰</button>
<div class="tr-drawer-backdrop" onclick="document.querySelector('.tr-drawer').classList.remove('open');this.classList.remove('open')"></div>
<nav class="tr-drawer" aria-label="Main navigation">
  <div class="tr-drawer-hd">Navigate</div>
  <a href="/" data-nav="/"><span class="i">📊</span> Dashboard</a>
  <a href="/calendar" data-nav="/calendar"><span class="i">📅</span> Calendar</a>
  <a href="/next-calls" data-nav="/next-calls"><span class="i">⭐</span> Next calls</a>
  <a href="/pipeline/p1" data-nav="/pipeline"><span class="i">🚦</span> Call pipelines</a>
  <a href="/database" data-nav="/database"><span class="i">🗄️</span> Prospect database</a>
  <a href="/pipeline2" data-nav="/pipeline2"><span class="i">🔁</span> Agency pipeline</a>
  <a href="/coaching" data-nav="/coaching"><span class="i">🎯</span> Coaching</a>
  <a href="/admin" data-nav="/admin" class="tr-admin" style="display:none"><span class="i">⚙️</span> Admin</a>
</nav>
<script>(function(){document.querySelectorAll('.tr-drawer a').forEach(function(a){var dn=a.getAttribute('data-nav'),p=location.pathname;if(dn===p||(dn!=='/'&&p.indexOf(dn+'/')===0))a.classList.add('active')});fetch('/api/me').then(function(r){return r.json()}).then(function(m){if(m&&m.role==='admin'){var el=document.querySelector('.tr-drawer a.tr-admin');if(el)el.style.display=''}}).catch(function(){});document.addEventListener('keydown',function(e){if(e.key==='Escape'){var d=document.querySelector('.tr-drawer'),b=document.querySelector('.tr-drawer-backdrop');if(d)d.classList.remove('open');if(b)b.classList.remove('open')}})})();
(function(){var el=document.documentElement;var b=document.querySelector('.tr-theme-btn');if(b)b.textContent=el.getAttribute('data-theme')==='light'?'\u{1F319}':'☀️';})();</script>
</body>
</html>
