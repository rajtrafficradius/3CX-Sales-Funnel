<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Traffic Radius</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14);
    --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1a2433;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r1:8px; --r2:10px; --r3:12px; --r4:14px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --elev2:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -16px rgba(0,0,0,.80);
    --t-micro:10px; --t-eyebrow:10.5px; --t-meta:11px; --t-cap:12px;
    --t-body:13px; --t-base:14px; --t-strong:16px; --t-fig:22px; --t-kpi:27px; --t-h1:30px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1100px 560px at 82% -12%,#10161f 0%,#0a0d13 60%) fixed,var(--bg);
    color:var(--txt);font:var(--t-base)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:var(--accent-soft)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);
    padding:32px 30px 26px;width:min(400px,92vw);box-shadow:var(--elev2)}

  /* brand + heading block */
  .brandrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{background:#fff;border-radius:var(--r2);padding:8px 12px;display:inline-flex;line-height:0;
    box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .logo img{height:28px;display:block}
  .eyebrow{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
    font-weight:700;margin-bottom:3px}
  .brandtxt{display:flex;flex-direction:column;line-height:1.2}
  .brandtxt .t{font-size:var(--t-base);font-weight:700;letter-spacing:-.1px}
  .brandtxt .s{font-size:var(--t-meta);color:var(--muted);font-weight:500}

  h1{font-size:20px;line-height:1.25;margin:0 0 5px;font-weight:750;letter-spacing:-.3px}
  p.sub{color:var(--txt-dim);font-size:var(--t-body);margin:0 0 20px}

  label{display:block;font-size:var(--t-eyebrow);color:var(--muted);margin:16px 0 6px;
    text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:var(--r2);padding:11px 12px;font:inherit;
    transition:border-color .14s,box-shadow .14s,background .14s}
  input::placeholder{color:var(--faint)}
  input:hover{border-color:var(--line2)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}

  button{width:100%;margin-top:24px;background:var(--accent);color:#fff;border:1px solid var(--accent);
    border-radius:var(--r2);padding:12px;font:inherit;font-weight:700;letter-spacing:.1px;cursor:pointer;
    transition:filter .14s,box-shadow .14s}
  button:hover{filter:brightness(1.06)}
  button:focus-visible{outline:none;box-shadow:var(--ring)}

  .err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:var(--bad);
    border-radius:var(--r2);padding:10px 12px;font-size:var(--t-body);font-weight:600;
    margin-bottom:16px;display:none}
  .err.show{display:block}

  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft);
    font-size:var(--t-cap);color:var(--muted);line-height:1.5}

  /* ---- light theme (toggle) — only neutral tokens flip; accent stays ---- */
  :root[data-theme=light]{
    --bg:#f4f7fb; --panel:#ffffff; --panel2:#f1f5fa; --panel3:#e8eef6;
    --line:#dbe2ec; --line-soft:#e7edf4; --line2:#c8d2df; --chip:#eef3f9;
    --txt:#1a2331; --txt-dim:#39465a; --muted:#5f6b7d; --faint:#8994a6;
    --good:#15a34a; --warn:#c07806; --bad:#dc2626;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --elev2:0 1px 0 rgba(0,0,0,.02) inset,0 10px 26px -18px rgba(20,30,50,.35);
  }
  :root[data-theme=light] body{background:var(--bg);color:var(--txt)}
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;
    border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:17px;line-height:1;cursor:pointer;box-shadow:var(--elev1);display:flex;
    align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .tr-theme-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brandrow">
    <span class="logo"><img src="/logo.png" alt="Traffic Radius" /></span>
    <div class="brandtxt">
      <span class="t">Traffic Radius</span>
      <span class="s">Sales Analytics</span>
    </div>
  </div>

  <div class="eyebrow">Sales Funnel Reporting</div>
  <h1>Sign in</h1>
  <p class="sub">Use your work email and password to access the dashboard.</p>

  <div class="err" id="err">Incorrect email or password.</div>

  <label for="email">Work email</label>
  <input id="email" name="email" type="email" autocomplete="username" placeholder="name@trafficradius.com.au" required autofocus />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required />
  <button type="submit">Sign in</button>

  <p class="foot">Access is restricted to Traffic Radius staff. Contact your admin if you're locked out or need a password reset.</p>
</form>
<script>
  if(new URLSearchParams(location.search).get('e')) document.getElementById('err').classList.add('show');
</script>
<script>(function(){
  var el=document.documentElement;
  function cur(){return el.getAttribute("data-theme")==="light"?"light":"dark";}
  var b=document.createElement("button");b.className="tr-theme-btn";
  b.title="Toggle light / dark theme";b.setAttribute("aria-label","Toggle theme");
  function paint(){b.textContent=cur()==="light"?"\u{1F319}":"\u2600\uFE0F";}
  b.onclick=function(){var n=cur()==="light"?"dark":"light";el.setAttribute("data-theme",n);
    try{localStorage.setItem("tr-theme",n);}catch(e){}paint();};
  paint();(document.body||el).appendChild(b);
})();</script>
</body>
</html>
