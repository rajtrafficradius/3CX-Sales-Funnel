<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prospect Database — Traffic Radius</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2430;--line:#2a3240;--txt:#e6edf3;--muted:#8b949e;--accent:#3b82f6;
        --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#11161f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
  header a{color:var(--accent);text-decoration:none;font-size:13px}
  header h1{font-size:17px;margin:0;font-weight:700}
  .brand{display:flex;align-items:center;background:#fff;border-radius:10px;padding:5px 10px;line-height:0}
  .brand img{height:24px;display:block}
  .spacer{flex:1}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  main{max-width:1480px;margin:0 auto;padding:18px 22px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .stat .n{font-size:22px;font-weight:760}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input,select{background:#0b0f15;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px}
  input:focus,select:focus{outline:1px solid var(--accent)}
  #search{flex:1;min-width:240px}
  button{font:inherit;background:#0b0f15;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)} button:disabled{opacity:.4;cursor:default}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:#141b24;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);z-index:1}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:rgba(59,130,246,.07)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700}
  .p1{background:rgba(59,130,246,.16);color:#7cb0ff}.p2{background:rgba(168,85,247,.16);color:#c79bf7}
  .ok{background:rgba(34,197,94,.16);color:#86efac}.none{background:rgba(148,163,184,.14);color:#cbd5e1}
  .muted{color:var(--muted)}
  .dom{color:var(--accent)}
  .pager{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:12px;color:var(--muted);font-size:13px}
  .flash{animation:flash 1.2s ease}@keyframes flash{0%{background:rgba(34,197,94,.18)}100%{background:transparent}}
  /* coverage stat cards double as multi-select filter toggles */
  .stat.cov{cursor:pointer;user-select:none;transition:border-color .12s,box-shadow .12s}
  .stat.cov:hover{border-color:var(--accent)}
  .stat.cov.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:rgba(59,130,246,.12)}
  .stat.cov.active .l{color:#9ec3ff}
  /* live result summary + active-filter pills */
  .resultbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:4px 0 12px;min-height:30px}
  .resultcount{font-size:14px;color:var(--muted)}
  .resultcount b{font-size:21px;color:var(--txt);font-weight:820;vertical-align:-1px}
  .fpill{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 8px 4px 12px;font-size:12px;color:var(--txt)}
  .fpill button{all:unset;cursor:pointer;color:var(--muted);font-weight:800;line-height:1;padding:0 1px}
  .fpill button:hover{color:var(--bad)}
  #clearAll{border-color:rgba(239,68,68,.5);color:#fca5a5;padding:5px 11px;font-size:12px}
  #clearAll:hover{border-color:var(--bad);background:rgba(239,68,68,.08)}
  .trkchip{background:#0b0f15;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .trkchip:hover{border-color:var(--accent);color:var(--txt)}
  .trkchip.active{background:rgba(59,130,246,.16);border-color:var(--accent);color:#cfe0ff;font-weight:700}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" title="Traffic Radius"><img src="/logo.png" alt="Traffic Radius" /></a>
  <a href="/">&larr; Dashboard</a>
  <h1>Prospect Database</h1>
  <span class="spacer"></span>
  <span class="live"><span class="dot"></span><span id="liveText">live</span></span>
  <a href="/logout" style="font-size:13px">Sign out</a>
</header>

<main>
  <div class="stats" id="stats"></div>
  <!-- Row 1: who -->
  <div class="bar">
    <input id="search" type="search" placeholder="🔎 Search business name, website, or phone…" autocomplete="off" />
    <select id="source">
      <option value="">All sources</option>
      <option value="raghav">Raghav (D&amp;B)</option>
      <option value="raven">Raven</option>
      <option value="3cx_calls">3CX calls</option>
    </select>
    <select id="revenue">
      <option value="">All revenue</option>
      <option value="lt1">&lt; $1M</option>
      <option value="1-10">$1M – $10M</option>
      <option value="10-50">$10M – $50M</option>
      <option value="50-100">$50M – $100M</option>
      <option value="100up">$100M+</option>
    </select>
    <input id="industry" type="search" placeholder="Industry…" autocomplete="off" style="max-width:150px;flex:0 1 150px" />
    <input id="state" type="search" placeholder="State / location…" autocomplete="off" style="max-width:150px;flex:0 1 150px" />
    <select id="enriched">
      <option value="">All enrichment</option>
      <option value="yes">Enriched</option>
      <option value="no">Not enriched</option>
    </select>
  </div>
  <!-- Row 2: paid ads (Transparency = primary) -->
  <div class="bar covbar">
    <span class="muted" style="font-size:12px;font-weight:700;letter-spacing:.3px">PAID ADS</span>
    <select id="paidAds">
      <option value="">All</option>
      <option value="google">🎯 Running Google Ads (Transparency · confirmed)</option>
      <option value="meta">📘 Has Meta pixel</option>
      <option value="both">Google + Meta</option>
      <option value="either">Any paid ads</option>
      <option value="none">No paid ads (scanned)</option>
      <option value="unscanned">Not scanned yet</option>
    </select>
    <select id="transparency">
      <option value="">Transparency: any</option>
      <option value="checked">Transparency checked</option>
      <option value="running">Confirmed running Google Ads</option>
      <option value="not_running">Checked · not running</option>
    </select>
    <span class="muted" style="font-size:12px">Tracking tags:</span>
    <button class="trkchip" data-trk="google_ads">Google Ads</button>
    <button class="trkchip" data-trk="meta_pixel">Meta Pixel</button>
    <button class="trkchip" data-trk="gtm">GTM</button>
    <button class="trkchip" data-trk="ga4">GA4</button>
    <button class="trkchip" data-trk="bing">Bing</button>
    <button class="trkchip" data-trk="tiktok">TikTok</button>
    <button class="trkchip" data-trk="linkedin">LinkedIn</button>
  </div>
  <div class="resultbar" id="resultbar"></div>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>Business</th><th>Website</th><th>Paid ads</th><th>Source</th><th>Industry</th><th>Sub-industry</th><th>Location</th>
        <th class="num">Businesses</th><th class="num">Total revenue</th><th class="num">Employees</th>
        <th class="num">Contacts</th><th>Phone</th><th>Enriched</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="13" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="pager">
    <span id="rangeText"></span>
    <button id="prev">‹ Prev</button>
    <button id="next">Next ›</button>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=n=>(n==null||n===''?'—':Number(n).toLocaleString());
let offset=0, limit=50, total=0, lastToken=null;
let _rowSeq=0, _statSeq=0;           // guards: ignore out-of-order fetch responses
let searchTimer;
const cov=new Set();                 // active coverage facets — multi-select, combined with AND
const trk=new Set();                 // active tracking-tag chips — OR-combined
const COV=[['scanned','✅ Scanned'],['transparency','🔭 Transparency checked'],['apollo','🏢 Apollo'],
           ['intel','🧩 Website intel'],['whois','🌐 WHOIS'],['dataforseo','📊 DataForSEO']];
const COVLBL=Object.fromEntries(COV);
const PA_LBL={google:'🎯 Running Google Ads',meta:'📘 Has Meta pixel',both:'Google + Meta',
              either:'Any paid ads',none:'No paid ads',unscanned:'Not scanned',yes:'Any paid ads',no:'No paid ads'};
const TRANSP_LBL={checked:'Transparency checked',running:'Confirmed running ads',not_running:'Checked · not running'};
const TRK_LBL={google_ads:'Google Ads tag',meta_pixel:'Meta Pixel',gtm:'GTM',ga4:'GA4',bing:'Bing',tiktok:'TikTok',linkedin:'LinkedIn'};
const REV_LBL={lt1:'< $1M',['1-10']:'$1M–$10M',['10-50']:'$10M–$50M',['50-100']:'$50M–$100M',['100up']:'$100M+'};

function curFilters(){
  return {q:$('#search').value.trim(), source:$('#source').value, enriched:$('#enriched').value,
          paid_ads:$('#paidAds').value, revenue:$('#revenue').value, coverage:[...cov].join(','),
          tracking:[...trk].join(','), transparency:$('#transparency').value,
          industry:$('#industry').value.trim(), state:$('#state').value.trim()};
}
function qs(f){ return `search=${encodeURIComponent(f.q)}&source=${encodeURIComponent(f.source)}`
  +`&enriched=${encodeURIComponent(f.enriched)}&paid_ads=${encodeURIComponent(f.paid_ads)}`
  +`&revenue=${encodeURIComponent(f.revenue)}&coverage=${encodeURIComponent(f.coverage)}`
  +`&tracking=${encodeURIComponent(f.tracking)}&transparency=${encodeURIComponent(f.transparency)}`
  +`&industry=${encodeURIComponent(f.industry)}&state=${encodeURIComponent(f.state)}`; }

function statCard(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
function covCard(key,l,n){
  const on=cov.has(key)?' active':'';
  return `<div class="stat cov${on}" title="Click to add/remove this filter" onclick="toggleCov('${key}')">
    <div class="n">${fmtN(n||0)}</div><div class="l">${l}</div></div>`;
}
function toggleCov(key){ cov.has(key)?cov.delete(key):cov.add(key); offset=0; loadRows(); loadStats(); }
// paid-ads shortcut stat card: clicking sets the Paid-ads filter
function paidCard(n,l,val){
  const on=$('#paidAds').value===val?' active':'';
  return `<div class="stat cov${on}" title="Filter: ${l}" onclick="setPaid('${val}')"><div class="n">${fmtN(n||0)}</div><div class="l">${l}</div></div>`;
}
function setPaid(val){ $('#paidAds').value = ($('#paidAds').value===val?'':val); offset=0; loadRows(); loadStats(); }
function syncTrkChips(){ document.querySelectorAll('.trkchip').forEach(b=>b.classList.toggle('active', trk.has(b.dataset.trk))); }

async function loadStats(){
  const my=++_statSeq;
  try{
    const s=await fetch('/api/database/stats?'+qs(curFilters())).then(r=>r.json());
    if(my!==_statSeq) return;            // a newer filter state superseded this request
    const c=s.coverage||{};
    $('#stats').innerHTML = statCard(fmtN(s.businesses),'Businesses')+statCard(fmtN(s.domains),'Domains')
      +paidCard(c.running_ads,'🎯 Running Google Ads','google')+paidCard(c.meta,'📘 Meta pixel','meta')
      +COV.map(([k,l])=>covCard(k,l,c[k])).join('');
    if(lastToken!==null && s.token!==lastToken){ $('#liveText').textContent='updated'; loadRows(true); setTimeout(()=>$('#liveText').textContent='live',1500); }
    lastToken = s.token;
  }catch(e){ $('#liveText').textContent='offline'; }
}

// Active-filter pills + the prominent "N businesses match" count above the table.
let _pills=[];
function renderResult(){
  const f=curFilters(); _pills=[];
  if(f.q) _pills.push(['“'+f.q+'”', ()=>{$('#search').value='';}]);
  if(f.source) _pills.push([(SRC_LABEL[f.source]||f.source), ()=>{$('#source').value='';}]);
  if(f.enriched) _pills.push([(f.enriched==='yes'?'Enriched':'Not enriched'), ()=>{$('#enriched').value='';}]);
  if(f.paid_ads) _pills.push([(PA_LBL[f.paid_ads]||f.paid_ads), ()=>{$('#paidAds').value='';}]);
  if(f.transparency) _pills.push([(TRANSP_LBL[f.transparency]||f.transparency), ()=>{$('#transparency').value='';}]);
  if(f.revenue) _pills.push([(REV_LBL[f.revenue]||f.revenue), ()=>{$('#revenue').value='';}]);
  if(f.industry) _pills.push(['Industry: '+f.industry, ()=>{$('#industry').value='';}]);
  if(f.state) _pills.push(['Location: '+f.state, ()=>{$('#state').value='';}]);
  trk.forEach(k=>_pills.push(['tag: '+(TRK_LBL[k]||k), ()=>trk.delete(k)]));
  cov.forEach(k=>_pills.push([COVLBL[k], ()=>cov.delete(k)]));
  const any=_pills.length>0;
  const out=[`<span class="resultcount">${any?'🔎 ':''}<b>${total.toLocaleString()}</b> `
    +`prospect${total===1?'':'s'}${any?' match these filters':''}</span>`];
  _pills.forEach((p,i)=>out.push(`<span class="fpill">${esc(p[0])}<button onclick="clearPill(${i})" title="Remove filter">✕</button></span>`));
  if(any) out.push(`<button id="clearAll" onclick="clearAll()">Clear all</button>`);
  $('#resultbar').innerHTML=out.join(' ');
}
function clearPill(i){ const p=_pills[i]; if(p){ clearTimeout(searchTimer); p[1](); offset=0; syncTrkChips(); loadRows(); loadStats(); } }
function clearAll(){ clearTimeout(searchTimer);
  ['#search','#source','#enriched','#paidAds','#revenue','#transparency','#industry','#state'].forEach(s=>$(s).value='');
  cov.clear(); trk.clear(); syncTrkChips(); offset=0; loadRows(); loadStats(); }

// Revenue stored in millions USD; show as $X.XM / $X.XB.
function fmtRev(m){
  if(m==null||m==='') return '<span class="muted">—</span>';
  const v=Number(m); if(!isFinite(v)||v<=0) return '<span class="muted">—</span>';
  if(v>=1000) return '$'+(v/1000).toLocaleString(undefined,{maximumFractionDigits:1})+'B';
  if(v>=1) return '$'+v.toLocaleString(undefined,{maximumFractionDigits:1})+'M';
  return '$'+(v*1000).toLocaleString(undefined,{maximumFractionDigits:0})+'K';
}
function paidAdsCell(r){
  const bits=[];
  if(r.runs_google_ads) bits.push('<span class="pill" style="background:rgba(239,68,68,.16);color:#fca5a5" title="Confirmed via Google Ads Transparency Center">🎯 Google</span>');
  if(r.has_meta_pixel) bits.push('<span class="pill" style="background:rgba(59,130,246,.16);color:#93c5fd" title="Meta Pixel present (supportive)">📘 Meta</span>');
  if(bits.length) return bits.join(' ');
  if(r.dfs_checked) return '<span class="muted" title="Transparency checked — no Google ads">No</span>';
  if(r.scanned) return '<span class="muted" title="not transparency-checked yet">·</span>';
  return '<span class="muted" title="website not scanned yet">·</span>';
}
const SRC_LABEL={raghav:'Raghav (D&B)',raven:'Raven','3cx_calls':'3CX calls',dnb_wholesale:'Raghav (D&B)',given_data:'Uploaded'};
function sourcesCell(s){
  if(!s) return '<span class="muted">—</span>';
  return String(s).split(',').map(x=>`<span class="pill" style="background:var(--chip);font-size:11px">${esc(SRC_LABEL[x]||x)}</span>`).join(' ');
}
function rowHtml(r){
  const enr = r.enriched?'<span class="pill ok">enriched</span>':'<span class="pill none">—</span>';
  const multi = r.businesses>1?` <span class="muted" style="font-size:11px">+${r.businesses-1} more</span>`:'';
  // Domain rows open the prospect page by domain; no-domain rows by phone (if any).
  const key = encodeURIComponent(r.domain || r.phone || '');
  const click = key?`onclick="window.open('/prospect/${key}','_blank')" style="cursor:pointer"`:'';
  return `<tr ${click}>
    <td><b>${esc(r.name||'—')}</b>${multi}</td>
    <td>${r.domain?`<span class="dom">${esc(r.domain)}</span>`:'<span class="muted">—</span>'}</td>
    <td>${paidAdsCell(r)}</td>
    <td>${sourcesCell(r.sources||r.source)}</td>
    <td>${esc(r.industry||'—')}</td>
    <td>${esc(r.sub_industry||'—')}</td>
    <td>${esc(r.location||'—')}</td>
    <td class="num">${fmtN(r.businesses)}</td>
    <td class="num">${fmtRev(r.total_revenue)}</td>
    <td class="num">${fmtN(r.employees)}</td>
    <td class="num">${fmtN(r.contacts)}</td>
    <td>${esc(r.phone||'—')}</td>
    <td>${enr}</td>
  </tr>`;
}

async function loadRows(flash){
  const my=++_rowSeq;
  const url=`/api/database/prospects?${qs(curFilters())}&limit=${limit}&offset=${offset}`;
  let d; try{ d=await fetch(url).then(r=>r.json()); }catch(e){ return; }
  if(my!==_rowSeq) return;               // a newer filter state superseded this request
  total=d.total;
  $('#rows').innerHTML = d.rows.length ? d.rows.map(rowHtml).join('') : '<tr><td colspan="13" class="muted">No matching businesses.</td></tr>';
  if(flash){ $('#rows').classList.add('flash'); setTimeout(()=>$('#rows').classList.remove('flash'),1200); }
  const from = total?offset+1:0, to=Math.min(offset+limit,total);
  $('#rangeText').textContent = `${from.toLocaleString()}–${to.toLocaleString()} of ${total.toLocaleString()}`;
  $('#prev').disabled = offset<=0; $('#next').disabled = offset+limit>=total;
  renderResult();
}

const _deb=()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>{offset=0;loadRows();loadStats();},300); };
$('#search').addEventListener('input',_deb);
$('#industry').addEventListener('input',_deb);
$('#state').addEventListener('input',_deb);
['#enriched','#paidAds','#revenue','#source','#transparency'].forEach(s=>$(s).onchange=()=>{offset=0;loadRows();loadStats();});
document.querySelectorAll('.trkchip').forEach(b=>b.onclick=()=>{
  const k=b.dataset.trk; trk.has(k)?trk.delete(k):trk.add(k); b.classList.toggle('active', trk.has(k));
  offset=0; loadRows(); loadStats();
});
$('#prev').onclick=()=>{ offset=Math.max(0,offset-limit); loadRows(); };
$('#next').onclick=()=>{ offset+=limit; loadRows(); };

// realtime: SSE refresh + a stats poll that detects DB changes and reloads.
loadStats(); loadRows();
try{ const es=new EventSource('/api/events'); es.addEventListener('refresh',()=>loadStats()); }catch(e){}
setInterval(loadStats, 8000);
</script>
</body>
</html>
