<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tasks · Traffic Radius</title>
<link rel="icon" href="/logo.png"/>
<style>
  :root{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f8;--line:#e3e9f2;--txt:#0e1726;--txt-dim:#5a6b85;--faint:#8695ac;
    --accent:#4b57e6;--accent-soft:#e9ebfd;--good:#0f9d58;--good-soft:#e7f6ee;--warn:#c9820a;--warn-soft:#fbf1dc;
    --blue:#1f6feb;--blue-soft:#e6f0fd;--red:#d9483b;--red-soft:#fbeceb;--rail:#0e1424;
    --sh:0 1px 3px rgba(14,23,38,.06),0 12px 30px -18px rgba(14,23,38,.28)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a;--panel:#121a2a;--panel2:#1a2438;--line:#243049;
    --txt:#eaf0fb;--txt-dim:#9fb0c9;--faint:#6b7a95;--accent:#8a83f5;--accent-soft:#20204a;--good:#43d17f;--good-soft:#102a1c;
    --warn:#e5a53a;--warn-soft:#2a2110;--blue:#5b9bf5;--blue-soft:#12233c;--red:#f4756a;--red-soft:#2c1512;--rail:#080d17;
    --sh:0 1px 3px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.7)}}
  :root[data-theme="dark"]{--bg:#0a0f1a;--panel:#121a2a;--panel2:#1a2438;--line:#243049;--txt:#eaf0fb;--txt-dim:#9fb0c9;
    --faint:#6b7a95;--accent:#8a83f5;--accent-soft:#20204a;--good:#43d17f;--good-soft:#102a1c;--warn:#e5a53a;--warn-soft:#2a2110;
    --blue:#5b9bf5;--blue-soft:#12233c;--red:#f4756a;--red-soft:#2c1512;--rail:#080d17;--sh:0 1px 3px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.7)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;-webkit-font-smoothing:antialiased}
  /* rail */
  .tr-rail{position:fixed;top:0;left:0;bottom:0;width:66px;background:var(--rail);display:flex;flex-direction:column;padding:12px 0;z-index:40;overflow:hidden;transition:width .16s}
  .tr-rail:hover{width:230px}
  .tr-rail-brand{display:flex;align-items:center;height:44px;margin:0 8px 10px;text-decoration:none;overflow:hidden;white-space:nowrap}
  .tr-rail-brand .barsic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail-brand .barsic svg{width:26px;height:26px} .fulllogo{height:20px;filter:brightness(0) invert(1);opacity:.9}
  .tr-rail-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .tr-rail-foot{display:flex;flex-direction:column;gap:2px}
  .tr-rail-item,.tr-rail-user{display:flex;align-items:center;height:42px;margin:0 8px;border-radius:10px;color:#93a1ba;text-decoration:none;font-weight:600;font-size:13.5px;overflow:hidden;white-space:nowrap;transition:background .12s,color .12s}
  .tr-rail-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .tr-rail-item.active{background:var(--accent-soft);color:#fff}
  .tr-rail-item .ic,.tr-rail-user .ic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail-item .ic svg{width:19px;height:19px} .tr-rail .lbl{opacity:0;transition:opacity .16s} .tr-rail:hover .lbl{opacity:1}
  .tr-rail-user .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  /* layout */
  .main{margin-left:66px;padding:30px clamp(16px,4vw,44px) 70px;max-width:1140px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:26px;font-weight:850;letter-spacing:-.02em;margin:0}
  .sub{color:var(--txt-dim);font-size:14px;margin:4px 0 0}
  .btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:700}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.ghost{background:transparent}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 8px}
  .stat{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--sh)}
  .stat b{display:block;font-size:26px;font-weight:850;letter-spacing:-.02em}
  .stat span{font-size:12.5px;color:var(--txt-dim);font-weight:600}
  .grp{margin-top:26px}
  .grp-h{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 2px 10px}
  .grp-h .dot{width:9px;height:9px;border-radius:50%}
  .grp-h .ct{color:var(--faint);font-weight:700}
  .task{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:15px 17px;margin-bottom:11px}
  .task.done{opacity:.72}
  .task-top{display:flex;align-items:flex-start;gap:12px}
  .task-main{flex:1;min-width:0}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px}
  .chip{font-size:11px;font-weight:800;letter-spacing:.02em;border-radius:6px;padding:2px 8px}
  .chip.cat{background:var(--panel2);color:var(--txt-dim)}
  .chip.pri-high{background:var(--red-soft);color:var(--red)} .chip.pri-low{background:var(--panel2);color:var(--faint)}
  .task-title{font-size:15.5px;font-weight:750;letter-spacing:-.01em}
  .task-title.strike{text-decoration:line-through;text-decoration-color:var(--faint)}
  .task-desc{color:var(--txt-dim);font-size:13.5px;margin:6px 0 0;white-space:pre-wrap}
  .task-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--faint)}
  .task-meta a{color:var(--blue);font-weight:600}
  .sel{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;font-weight:700}
  .notes{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--txt-dim);white-space:pre-wrap}
  .notebar{display:flex;gap:8px;margin-top:9px}
  .notebar input{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px}
  .addform{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:16px;margin:14px 0;display:none;gap:10px;flex-direction:column}
  .addform.on{display:flex}
  .addform input,.addform textarea,.addform select{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:9px;padding:9px 12px;font:inherit;font-size:14px}
  .addform .row{display:flex;gap:10px;flex-wrap:wrap} .addform .row>*{flex:1;min-width:130px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)} .toast.err{background:var(--red);color:#fff}
  .empty{color:var(--faint);text-align:center;padding:50px}
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px;z-index:50}
</style></head><body>
<nav class="tr-rail" id="trRail" aria-label="Primary navigation"></nav>

<div class="main">
  <div class="head">
    <div>
      <h1>Tasks &amp; Projects</h1>
      <p class="sub">Everything requested, tracked to done — a shared board for Vysakh &amp; Raj.</p>
    </div>
    <button class="btn pri" onclick="document.getElementById('addf').classList.toggle('on')">+ Add task</button>
  </div>

  <div class="addform" id="addf">
    <input id="fTitle" placeholder="Task title"/>
    <textarea id="fDesc" rows="2" placeholder="Description (optional)"></textarea>
    <div class="row">
      <input id="fCat" placeholder="Category (e.g. Autopilot, Domain)"/>
      <select id="fPri"><option value="high">High priority</option><option value="normal" selected>Normal</option><option value="low">Low</option></select>
      <select id="fStatus"><option value="pending" selected>Pending</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option></select>
    </div>
    <div style="display:flex;gap:8px"><button class="btn pri" onclick="addTask()">Save task</button><button class="btn ghost" onclick="document.getElementById('addf').classList.remove('on')">Cancel</button></div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="board"></div>
</div>

<div class="toast" id="toast"></div>
<button class="tr-theme-btn" title="Toggle light / dark" onclick="var e=document.documentElement,n=e.getAttribute('data-theme')==='light'?'dark':'light';e.setAttribute('data-theme',n);try{localStorage.setItem('tr-theme-v2',n)}catch(x){};this.textContent=n==='light'?'\u{1F319}':'☀️'">🌙</button>

<script>
(function(){try{var t=localStorage.getItem('tr-theme-v2');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var toastEl=document.getElementById('toast'),tT;
function toast(m,e){toastEl.textContent=m;toastEl.classList.toggle('err',!!e);toastEl.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){toastEl.classList.remove('on')},e?4000:2200);}
function api(u,o){return fetch(u,o).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function post(u,b){return api(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});}

var STG=[['in_progress','In progress','#5b9bf5'],['pending','To do','#c9820a'],['blocked','Blocked','#d9483b'],['done','Done','#0f9d58']];
var STLBL={pending:'To do',in_progress:'In progress',blocked:'Blocked',done:'Done'};

function taskCard(t){
  var pchip=t.priority==='high'?'<span class="chip pri-high">High</span>':(t.priority==='low'?'<span class="chip pri-low">Low</span>':'');
  var cat=t.category?'<span class="chip cat">'+esc(t.category)+'</span>':'';
  var opts=Object.keys(STLBL).map(function(k){return '<option value="'+k+'"'+(t.status===k?' selected':'')+'>'+STLBL[k]+'</option>';}).join('');
  var link=t.link?'<a href="'+esc(t.link)+'" target="_blank" rel="noopener">Open ↗</a>':'';
  var notes=t.notes?'<div class="notes">'+esc(t.notes)+'</div>':'';
  return '<div class="task'+(t.status==='done'?' done':'')+'"><div class="task-top"><div class="task-main">'+
    '<div class="chips">'+cat+pchip+'</div>'+
    '<div class="task-title'+(t.status==='done'?' strike':'')+'">'+esc(t.title)+'</div>'+
    (t.description?'<div class="task-desc">'+esc(t.description)+'</div>':'')+
    notes+
    '<div class="notebar"><input placeholder="Add a note / update…" id="n'+t.id+'"/><button class="btn ghost" onclick="addNote('+t.id+')">Note</button></div>'+
    '<div class="task-meta"><select class="sel" onchange="setStatus('+t.id+',this.value)">'+opts+'</select>'+
    (link?'<span>·</span>'+link:'')+'<span>·</span><span>updated '+esc(t.updated||'')+(t.updated_by?' by '+esc(t.updated_by):'')+'</span></div>'+
    '</div></div></div>';
}

function render(tasks){
  var by={pending:[],in_progress:[],blocked:[],done:[]};
  tasks.forEach(function(t){(by[t.status]||by.pending).push(t);});
  document.getElementById('stats').innerHTML=STG.map(function(s){return '<div class="stat"><b style="color:'+s[2]+'">'+(by[s[0]]||[]).length+'</b><span>'+s[1]+'</span></div>';}).join('');
  var h='';
  STG.forEach(function(s){var list=by[s[0]]||[];if(!list.length)return;
    h+='<div class="grp"><div class="grp-h"><span class="dot" style="background:'+s[2]+'"></span>'+s[1]+' <span class="ct">· '+list.length+'</span></div>'+list.map(taskCard).join('')+'</div>';});
  document.getElementById('board').innerHTML=h||'<div class="empty">No tasks yet.</div>';
}
function load(){api('/api/tasks').then(function(d){render(d.tasks||[]);}).catch(function(e){document.getElementById('board').innerHTML='<div class="empty">Couldn\'t load ('+e.message+').</div>';});}
function setStatus(id,v){post('/api/tasks/'+id,{status:v}).then(function(){toast('Updated → '+STLBL[v]);load();}).catch(function(e){toast('Failed: '+e.message,true);});}
function addNote(id){var el=document.getElementById('n'+id);var v=(el.value||'').trim();if(!v)return;post('/api/tasks/'+id,{notes:v}).then(function(){toast('Note saved');load();}).catch(function(e){toast('Failed: '+e.message,true);});}
function addTask(){var t=document.getElementById('fTitle').value.trim();if(!t){toast('Give it a title',true);return;}
  post('/api/tasks',{title:t,description:document.getElementById('fDesc').value,category:document.getElementById('fCat').value,priority:document.getElementById('fPri').value,status:document.getElementById('fStatus').value})
  .then(function(){toast('Task added');document.getElementById('fTitle').value='';document.getElementById('fDesc').value='';document.getElementById('fCat').value='';document.getElementById('addf').classList.remove('on');load();})
  .catch(function(e){toast('Failed: '+e.message,true);});}
window.setStatus=setStatus;window.addNote=addNote;window.addTask=addTask;
load();setInterval(load,60000);
</script>

<script>(function(){
  var P=location.pathname, S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
  var NAV=[
    ['/','/','Dashboard','<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'],
    ['/lisa-crm','/lisa-crm','Booked CRM','<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',1],
    ['/lisa','/lisa','Outbound Intelligence','<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',1],
    ['/tasks','/tasks','Tasks','<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l1.5 1.5L13 11"/><path d="M9 17h5"/>',3],
    ['/admin','/admin','Admin','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 0 1-4 0v-.11a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3a2 2 0 0 1 0-4h.11a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 .97-1.47V3a2 2 0 0 1 4 0v.11a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47.97H21a2 2 0 0 1 0 4h-.11a1.6 1.6 0 0 0-1.47.97z"/>',1]
  ];
  var BARS='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="13" width="4.3" height="7.6" rx="1.2" fill="currentColor" opacity=".92"/><rect x="9.85" y="8.2" width="4.3" height="12.4" rx="1.2" fill="#2fb9e6"/><rect x="16.3" y="3.6" width="4.3" height="17" rx="1.2" fill="#83c43a"/></svg>';
  var h='<a class="tr-rail-brand" href="/" title="Traffic Radius"><span class="barsic">'+BARS+'</span><img class="fulllogo" src="/logo.png" alt="Traffic Radius"/></a><div class="tr-rail-nav">';
  for(var i=0;i<NAV.length;i++){var n=NAV[i];
    var act=((n[1]==='/')?(P==='/'):(P===n[1]||P.indexOf(n[1]+'/')===0))?' active':'';
    h+='<a class="tr-rail-item'+act+(n[4]===2?' tr-sched':n[4]===3?' tr-tasks':n[4]?' tr-admin':'')+'" href="'+n[0]+'" data-nav="'+n[1]+'"'+(n[4]?' style="display:none"':'')+' title="'+n[2]+'"><span class="ic">'+S+n[3]+'</svg></span><span class="lbl">'+n[2]+'</span></a>';
  }
  h+='</div><div class="tr-rail-foot"><a class="tr-rail-item" href="/logout" title="Sign out"><span class="ic">'+S+'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="lbl">Sign out</span></a><div class="tr-rail-user" title="Account"><span class="ic"><span class="av" id="trAv">&middot;</span></span><span class="lbl" id="trWho">Account</span></div></div>';
  var rail=document.getElementById('trRail'); if(rail) rail.innerHTML=h;
  fetch('/api/me').then(function(r){return r.json()}).then(function(m){
    if(!m)return;
    if(m.role==='admin'){document.querySelectorAll('.tr-rail .tr-admin').forEach(function(el){el.style.display='';});}
    if(m.crm_access){document.querySelectorAll('.tr-rail [data-nav="/lisa-crm"]').forEach(function(el){el.style.display='';});}
    if(m.tasks_access){document.querySelectorAll('.tr-rail .tr-tasks').forEach(function(el){el.style.display='';});}
    var nm=(m.name||m.email||'').trim();var w=document.getElementById('trWho');if(w&&nm)w.textContent=nm;
    var av=document.getElementById('trAv');if(av&&nm)av.textContent=nm[0].toUpperCase();
  }).catch(function(){});
})();</script>
</body></html>
