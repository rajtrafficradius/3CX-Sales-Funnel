<script>

var PRICE_LABELS={retell_per_min:'Retell AI — per connected minute (USD)',twilio_sms_au:'Twilio — SMS to AU mobile (USD)',twilio_number_month:'Twilio — AU number / month (USD)',opus_in_per_mtok:'Claude Opus — $/1M input tokens',opus_out_per_mtok:'Claude Opus — $/1M output tokens',gpt4omini_in_per_mtok:'GPT-4o-mini — $/1M input',gpt4omini_out_per_mtok:'GPT-4o-mini — $/1M output',whisper_per_min:'Whisper STT — per minute (USD)',dataforseo_audit:'DataForSEO — per audit (USD)',places_per_1k:'Google Places — per 1,000 (USD)',apollo_month:'Apollo — / month (USD)',aircall_seat_month:'Aircall — per seat / month (USD)',aircall_seats:'Aircall — seats',railway_month:'Railway — / month (USD)',fireflies_month:'Fireflies — / month (USD)',threecx_month:'3CX — / month (USD, 0 = off)',places_requests_month:'Google Places — requests / month (est.)',caller_numbers:'Twilio — AU numbers rented',avg_deal_value:'Average value per WON deal (AUD)',fx_usd_aud:'FX — USD → AUD rate'};

function EChart(props){

    if(!ref.current)return;

function App(){

  function setDays(n){n=parseInt(n,10);if(!n||n<1)return;n=Math.min(365,n);setDaysS(n);}

    if(pw>0)deltaPct=Math.round((cw-pw)/pw*100);

  var cur=dser.slice(-d.days);

  var mk=function(k){return cur.map(function(x){return +( (x[k]||0)*FX ).toFixed(2);});};

    grid:{left:52,right:12,top:30,bottom:26},

    yAxis:{type:'value',axisLabel:{color:faint,fontSize:11.5,formatter:function(v){return 'A$'+v;}},splitLine:{lineStyle:{color:line}}},
    series:[
      {name:'Outbound (Lisa AI)',type:'bar',stack:'t',data:mk('outbound'),itemStyle:{color:cssVar('--c-out'),borderRadius:[0,0,0,0]}},

      {name:'Shared',type:'bar',stack:'t',data:mk('shared'),itemStyle:{color:cssVar('--c-sh'),borderRadius:[3,3,0,0]}}
    ]};
  var lines=(d.lines||[]);
  var donutOpt={
    tooltip:{trigger:'item',valueFormatter:function(v){return 'A$'+Number(v).toLocaleString();}},
    series:[{type:'pie',radius:['58%','86%'],center:['50%','50%'],avoidLabelOverlap:true,
      label:{show:false},itemStyle:{borderColor:cssVar('--panel'),borderWidth:2},
      data:lines.map(function(l){return {name:l.tool,value:+(l.usd*FX).toFixed(2)};})}]};
  var stages=[
    ['Calls placed',u.ai_calls||0,perCall,null],
    ['Conversations',u.ai_convos||0,perConvo,pct(u.ai_convos,u.ai_calls)],
    ['Meetings booked',d.ai_booked||0,d.cost_per_booking,pct(d.ai_booked,u.ai_convos)],
    ['Meetings held',d.seen_meetings||0,d.cost_per_seen_meeting,pct(d.seen_meetings,d.ai_booked)],
    ['Deals won',d.won||0,d.won?d.total/d.won:null,pct(d.won,d.seen_meetings)]];
  var maxN=Math.max.apply(null,stages.map(function(s){return s[1]||0}).concat([1]));
  var pd=d.periods||{};
  var maxR=Math.max(revenueAUD,costAUD,1);
  var order=['outbound','human_bde','shared'];
  var live=lines.filter(function(l){return l.kind==='live'}).length;
  return h`<div>
    <div class="head">
      <div><h1>Cost Intelligence</h1>
        <div class="meta">AUD-first at ${FX} USD→AUD · Twilio balance is live · updated ${new Date().toLocaleTimeString()}</div></div>
      <div style=${{display:'flex',gap:'9px',flexWrap:'wrap',alignItems:'center'}}>
        <div class="chips">

          <span class="cust"><input id="cd" type="number" min="1" max="365" placeholder="days"
            onKeyDown=${function(e){if(e.key==='Enter')setDays(e.target.value);}}/><button class="chip" onClick=${function(){setDays(document.getElementById('cd').value);}}>Go</button></span>
        </div>
        <button class="btn" onClick=${function(){window.print();}}>Print / PDF</button>
        <button class="btn" onClick=${function(){setShowPrices(!showPrices);}}>Adjust prices</button>
      </div>
    </div>

    <div class=${'hero'+(busy?' busy':'')}>
      <div class="kick">Executive summary · cost of running the entire system · last ${d.days} day${d.days>1?'s':''}
        ${deltaPct==null?h`<span class="delta na">no prior-period data</span>`
          :h`<span class=${'delta '+(deltaPct>0?'up':'dn')}>${deltaPct>0?'▲':'▼'} ${Math.abs(deltaPct)}% vs previous ${d.days}d</span>`}
      </div>
      <div class="hgrid">
        <div class="hbig"><b>${aud(runRate)}<span class="per"> /month</span></b>
          <span>Total monthly run-rate — AI calling, SMS, AI builds, analytics, subscriptions</span>
          <small>${usd(runRate)} USD · from the last ${d.days}d of real usage</small></div>
        <div class="hit"><b style=${{color:'#b3bdfa'}}>${aud(g.outbound)}</b><span>Outbound Intelligence — total</span>
          <small>${usd(g.outbound)} USD · ${pct(g.outbound,d.total)}% of all spend</small></div>
        <div class="hit"><b style=${{color:'#eec05e'}}>${aud(d.cost_per_booking)}</b><span>Cost per meeting BOOKED</span>
          <small>${d.ai_booked||0} booked (${d.days}d) · AI-system cost ÷ bookings</small></div>
        <div class="hit"><b style=${{color:'#eec05e'}}>${aud(d.cost_per_seen_meeting)}</b><span>Cost per meeting HELD</span>
          <small>${d.seen_meetings||0} held — verified via closer calls + Fireflies</small></div>
        <div class="hit"><b style=${{color:netAUD>=0?'#5fe39a':'#ffa198'}}>${audR(netAUD)}</b><span>Net (revenue − cost)</span>
          <small>${d.won||0} won × ${audR(d.avg_deal_value)} · all-systems spend ${aud(d.total)}</small></div>
      </div>
      <div class="hfoot">
        ${tw&&tw.balance!=null?h`<span class=${'pill '+(tw.low?'low':'ok')}><span class="dot"></span>Twilio balance ${usd(tw.balance,2)}${tw.low?' — LOW, top up':''}</span>`:null}
        <span class="pill"><span class="dot" style=${{background:'#7f9df5'}}></span>${(u.ai_calls||0).toLocaleString()} AI calls · ${Math.round(u.ai_minutes||0).toLocaleString()} min</span>
        <span class="pill"><span class="dot" style=${{background:'#eec05e'}}></span>${d.ai_booked||0} booked · ${d.seen_meetings||0} held</span>
        <span class="pill"><span class="dot" style=${{background:'#83c43a'}}></span>${(u.sites||0)+(u.audits||0)+(u.comparisons||0)} AI assets built</span>
      </div>
    </div>

    <div class="sec">Unit economics <small>· what each outcome costs the AI outbound system</small></div>
    <div class="kpis">
      ${[[aud(perCall,2),'Cost per AI call',(u.ai_calls||0).toLocaleString()+' calls placed'],
         [aud(perConvo,2),'Cost per conversation',(u.ai_convos||0).toLocaleString()+' real convos (≥20s)'],
         [aud(perMin,2),'Cost per AI minute',Math.round(u.ai_minutes||0).toLocaleString()+' connected minutes'],
         [d.cost_per_acquisition?aud(d.cost_per_acquisition):'—','Cost per acquisition',(d.won||0)+' deals won'],

        ].map(function(k,i){return h`<div class="kpi" key=${i}><b>${k[0]}</b><span>${k[1]}</span><small>${k[2]}</small></div>`;})}
    </div>

    <div class="grid2" style=${{marginTop:'18px'}}>
      <div class="card"><h3>Daily spend</h3><div class="sub">Per-day cost by system · last ${d.days} days · AUD · hover for exact figures</div>
        <${EChart} option=${chartOpt} height=${290}/></div>
      <div class="card"><h3>Where the money goes</h3><div class="sub">Vendor share of spend · hover the ring</div>
        <${EChart} option=${donutOpt} height=${180}/>
        <div>${lines.slice(0,7).map(function(l,i){return h`<div key=${i} style=${{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--line2)',fontSize:'13.5px'}}>
          <span style=${{fontWeight:700}}>${l.tool}</span><span style=${{fontVariantNumeric:'tabular-nums',color:'var(--dim)'}}><b style=${{color:'var(--txt)'}}>${aud(l.usd)}</b> · ${pct(l.usd,d.total)}%</span></div>`;})}</div>
      </div>
    </div>

    <div class="sec">Funnel economics <small>· the cost of each stage, with stage-to-stage conversion</small></div>
    <div class="card"><div class="funnel">
      ${stages.map(function(s,i){return h`<div class="fs" key=${i}>
        ${s[3]!=null?h`<span class="cv">${s[3]}%</span>`:null}
        <div class="bar"><i style=${{height:Math.max(7,Math.round((s[1]/maxN)*54))+'px',opacity:1-i*0.12}}></i></div>
        <b>${Number(s[1]).toLocaleString()}</b><span>${s[0]}</span><br/>
        <span class="u">${s[2]!=null?aud(s[2],(s[2]*FX)<20?2:0)+' each':'—'}</span></div>`;})}
    </div></div>

    <div class="grid2" style=${{marginTop:'18px'}}>
      <div class="card"><h3>Return on the system</h3>
        <div class="sub">Won deals at ${audR(d.avg_deal_value)} (AUD) vs full system cost · last ${d.days}d</div>
        ${[['Revenue from won deals',revenueAUD,'var(--good)'],['Total system cost',costAUD,'var(--red)']].map(function(b,i){
          return h`<div key=${i} style=${{margin:'9px 0 14px'}}>
            <div style=${{display:'flex',justifyContent:'space-between',fontSize:'13.5px',fontWeight:750,color:'var(--dim)',marginBottom:'6px'}}>
              <span>${b[0]}</span><b style=${{color:'var(--txt)',fontVariantNumeric:'tabular-nums'}}>${audR(b[1])}</b></div>
            <div style=${{height:'15px',borderRadius:'8px',background:'var(--panel2)',overflow:'hidden'}}>
              <i style=${{display:'block',height:'100%',width:Math.max(1,Math.round(b[1]/maxR*100))+'%',background:b[2],borderRadius:'8px'}}></i></div></div>`;})}
        <div style=${{padding:'13px 16px',borderRadius:'12px',fontWeight:800,fontSize:'15px',display:'flex',justifyContent:'space-between',
          background:netAUD>=0?'var(--good-soft)':'var(--red-soft)',color:netAUD>=0?'var(--good)':'var(--red)'}}>
          <span>${netAUD>=0?'▲ Net-positive this window':'▼ Net-negative this window'}</span><b>${audR(netAUD)}</b></div>
        <div style=${{marginTop:'11px',fontSize:'13px',color:'var(--faint)'}}>Pipeline upside: ${d.leads||0} bookings × 30% close × ${audR(d.avg_deal_value)} = <b style=${{color:'var(--txt)'}}>${audR((d.leads||0)*0.3*(d.avg_deal_value||0))}</b> projected</div>
      </div>
      <div class="card"><h3>Run cost by period</h3><div class="sub">Quote any of these to management — auto-computed from real usage</div>
        <div class="periods">
          ${[['daily','Per day','last 24h'],['weekly','Per week','7 days'],['monthly','Per month','30 days']].map(function(pp,i){
            var r=pd[pp[0]]||{};
            return h`<div class="pc" key=${i}><div class="h"><b>${pp[1]}</b><span>${pp[2]}</span></div>
              <div class="t">${aud(r.total)} <small>${usd(r.total)} USD</small></div>
              <div class="r"><span><i style=${{background:'var(--c-out)'}}></i>Outbound (Lisa AI)</span><b>${aud(r.outbound)}</b></div>
              <div class="r"><span><i style=${{background:'var(--c-bde)'}}></i>Human-BDE</span><b>${aud(r.human_bde)}</b></div>
              <div class="r"><span><i style=${{background:'var(--c-sh)'}}></i>Shared infra</span><b>${aud(r.shared)}</b></div></div>`;})}
        </div>
      </div>
    </div>

    <div class="sec">Line-item breakdown <small>· click any row for PROOF — data source, price source, and how to cross-check it</small></div>
    <div class="twrap"><table><thead><tr><th>Vendor / tool</th><th>Basis</th><th>How it's counted</th><th class="n">AUD</th><th class="n">USD</th><th class="n">Share</th></tr></thead><tbody>
      ${order.map(function(gk){
        var gl=lines.filter(function(l){return (l.group||'outbound')===gk;});
        if(!gl.length)return null;
        var sub=gl.reduce(function(a,l){return a+(l.usd||0);},0);
        return h`<${React.Fragment} key=${gk}>
          <tr class="grp"><td colSpan="3">${GN[gk]}</td><td class="n"><b>${aud(sub)}</b></td><td class="n">${usd(sub)}</td><td class="n">${pct(sub,d.total)}%</td></tr>
          ${gl.map(function(l,li){
            var pid=gk+'_'+li, pf=l.proof, isOpen=!!open[pid];
            return h`<${React.Fragment} key=${pid}>
              <tr class=${pf?'pfrow':''} onClick=${pf?function(){var o=Object.assign({},open);o[pid]=!isOpen;setOpen(o);}:null} title=${pf?'Click for proof / source of this figure':''}>
                <td class="tool">${l.tool}${pf?h`<span class="pfi">i</span>`:null}</td>
                <td><span class=${'badge '+l.kind}>${l.kind==='live'?'live ✓':l.kind}</span></td>
                <td class="det">${l.detail}</td><td class="n"><b>${aud(l.usd)}</b></td><td class="n">${usd(l.usd)}</td><td class="n">${pct(l.usd,d.total)}%</td></tr>
              ${pf&&isOpen?h`<tr class="proof"><td colSpan="6"><div class="pfg">
                <div><b>Where the number comes from</b><span>${pf.data}</span></div>
                <div><b>Where the price comes from</b><span>${pf.price}</span></div>
                <div><b>Cross-check it yourself</b><span>${pf.verify}</span></div>
                <div><b>Computation</b><span>${l.detail} = ${usd(l.usd,2)} → × ${FX} = ${aud(l.usd,2)}</span></div></div></td></tr>`:null}
            </${React.Fragment}>`;})}
        </${React.Fragment}>`;})}
      <tr class="tot"><td>Total</td><td></td><td class="det">last ${d.days} days</td><td class="n">${aud(d.total)}</td><td class="n">${usd(d.total)}</td><td class="n">100%</td></tr>
    </tbody></table></div>

    ${showPrices?h`<div class="prices">
      <div class="sec" style=${{marginTop:0}}>Unit prices — tune any figure and the report recomputes</div>
      ${Object.keys(PRICE_LABELS).filter(function(k){return k in (d.prices||{});}).map(function(k){
        return h`<div class="prow" key=${k}><label>${PRICE_LABELS[k]}</label><input id=${'p_'+k} type="number" step="any" defaultValue=${d.prices[k]}/></div>`;})}
      <div style=${{marginTop:'13px'}}><button class="btn" style=${{background:'var(--accent)',color:'#fff',borderColor:'var(--accent)'}}
        onClick=${function(){var over={};Object.keys(PRICE_LABELS).forEach(function(k){var el=document.getElementById('p_'+k);if(el&&el.value!=='')over[k]=parseFloat(el.value);});
          fetch('/api/cost/prices',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(over)})
            .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
            .then(function(){toast('Saved — recomputing');setShowPrices(false);fetchD(days);})
            .catch(function(e){toast('Failed: '+e.message);});}}>Save & recompute</button></div>
    </div>`:null}

    <div class="sec">Activity this period <small>· the real usage the costs are computed from</small></div>
    <div class="ugrid">
      ${[[(u.ai_calls||0).toLocaleString(),'AI calls placed'],[Math.round(u.ai_minutes||0).toLocaleString(),'AI minutes'],
         [(u.ai_convos||0).toLocaleString(),'conversations'],[(u.sms_out||0).toLocaleString(),'SMS sent'],
         [(u.sites||0),'sites built'],[(u.audits||0),'audits built'],[(u.comparisons||0),'comparisons'],
         [(u.classified||0).toLocaleString(),'AI calls classified'],[(u.bde_calls||0).toLocaleString(),'human-BDE calls'],
         [(d.ai_booked||0),'meetings booked'],[(d.seen_meetings||0),'meetings held'],[(u.won||0),'deals won']
        ].map(function(x,i){return h`<div class="use" key=${i}><b>${x[0]}</b><span>${x[1]}</span></div>`;})}
    </div>

    <div class="sec">Method & assumptions <small>· read this before quoting figures</small></div>
    <div class="method"><h3>How these figures are produced</h3><ul>
      <li><b>Metered lines</b> come from the system's own database — every AI call minute, SMS, site, audit and classification is logged and multiplied by the vendor's unit price.</li>
      <li><b>Live lines</b> (${live} this load) come straight from the vendor's API — the Twilio figure is actual billed spend, not an estimate.</li>
      <li><b>Estimated lines</b> use per-asset token / request-volume estimates where exact counts aren't logged. Every unit price is editable under <b>Adjust prices</b>.</li>
      <li><b>Currency:</b> vendor prices are USD; the report shows <b>AUD-first</b> at ${FX} (editable). Deal values are AUD, so revenue-vs-cost compares like-for-like.</li>
      <li><b>Attribution:</b> per-meeting economics use only the AI outbound system + shared infra — the human-BDE floor's cost is never blended into Lisa's cost-per-meeting.</li>
      <li><b>Proof per line:</b> click any row in the breakdown — it expands with the data source, price source, and where to cross-check it in the vendor's console.</li></ul>
      ${d.usage_sources?h`<h3 style=${{marginTop:'16px'}}>System of record for every count</h3><ul>
        ${Object.keys(d.usage_sources).map(function(k){return h`<li key=${k}><b>${k}</b> — ${d.usage_sources[k]}</li>`;})}</ul>`:null}
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(h`<${App}/>`);
