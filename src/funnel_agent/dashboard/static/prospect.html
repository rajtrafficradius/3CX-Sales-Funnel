<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme-v2");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prospect — 3CX Funnel</title>
<style>
  :root{
    /* Premium design system — aligned with the main dashboard (index.html) */
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14); --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1a2433;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r1:8px; --r2:10px; --r3:12px; --r4:14px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --elev2:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -16px rgba(0,0,0,.80);
    --t-micro:10px; --t-eyebrow:10.5px; --t-meta:11px; --t-cap:12px; --t-body:13px;
    --t-base:14px; --t-strong:16px; --t-fig:22px; --t-kpi:27px; --t-h1:30px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:var(--t-base)/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:linear-gradient(180deg,#11161f,#0b0e14);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header a{color:var(--accent);text-decoration:none;font-size:var(--t-body)}
  header a.back:hover{text-decoration:underline}
  .hdr-titles{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hdr-eyebrow{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:700}
  header h1{font-size:var(--t-strong);margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .spacer{flex:1}
  .brand{display:flex;align-items:center;background:#fff;border-radius:var(--r2);padding:5px 10px;line-height:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .brand img{height:26px;display:block}
  main{max-width:1180px;margin:0 auto;padding:var(--s5) 22px;display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:18px 20px;box-shadow:var(--elev2)}
  .card.full{grid-column:1/-1}
  h2{font-size:var(--t-cap);margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:var(--t-body)}
  .kv div:nth-child(odd){color:var(--muted)}
  .kv div:nth-child(even){color:var(--txt-dim)}
  .muted{color:var(--muted)}
  a.lnk,.lnk{color:var(--accent);text-decoration:none}
  a.lnk:hover,.lnk:hover{text-decoration:underline}
  button.lnk{background:none;border:none;padding:0;font:inherit;cursor:pointer;color:var(--accent)}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:var(--t-cap);font-weight:700;white-space:nowrap;line-height:1.4}
  .yes{background:rgba(74,222,128,.14);color:var(--good)}.no{background:rgba(248,113,113,.14);color:var(--bad)}
  .neutral{background:rgba(139,150,166,.12);color:var(--muted)}
  .none{background:rgba(139,150,166,.10);color:var(--muted)}
  .info{background:var(--accent-soft);color:var(--accent)}
  /* hero */
  .hero{grid-column:1/-1;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r4);padding:20px 22px;box-shadow:var(--elev2);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),transparent)}
  .hero .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hero h1{font-size:var(--t-fig);margin:0;font-weight:800;letter-spacing:-.2px}
  .hero .dom{color:var(--accent);font-size:var(--t-body);margin-top:5px}
  .hero .stats{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--line-soft)}
  .hero .stat .n{font-size:var(--t-fig);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .hero .stat .l{font-size:var(--t-eyebrow);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .tbadge{padding:5px 14px;border-radius:999px;font-weight:800;font-size:var(--t-body);letter-spacing:.4px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  /* metrics grid */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
  .metric .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .metric .l{font-size:var(--t-eyebrow);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .metric .src{font-size:var(--t-micro);color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
  .subh{font-weight:700;font-size:var(--t-eyebrow);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:var(--r1);padding:3px 9px;font-size:var(--t-meta);color:var(--txt-dim)}
  .bizgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:700px){.bizgrid{grid-template-columns:1fr}}
  /* contacts */
  .contact{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .contact:last-child{border-bottom:none}
  .contact .nm{font-weight:650}
  .contact .ti{color:var(--muted);font-size:var(--t-cap)}
  .contact .ph{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:var(--t-cap);color:var(--txt-dim)}
  /* add phone / website forms */
  .addphone{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .addphone input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r1);padding:9px 11px;font:inherit;font-size:var(--t-body)}
  .addphone input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  button,.btn{font:inherit;font-size:var(--t-body);border-radius:var(--r2);cursor:pointer;border:1px solid var(--line);background:var(--panel3);color:var(--txt);padding:9px 14px;transition:border-color .15s,filter .15s}
  button.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:700}
  button:hover,.btn:hover{border-color:var(--line2);filter:brightness(1.08)}
  button:focus-visible,.btn:focus-visible{outline:none;box-shadow:var(--ring)}
  button:disabled{opacity:.5;cursor:not-allowed;filter:none}
  button.lnk:hover{filter:none;border:none;text-decoration:underline}
  /* timeline */
  .tl{position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .ev{position:relative;margin-bottom:16px}
  .ev::before{content:"";position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
  .ev.booked::before{background:var(--good);box-shadow:0 0 0 3px rgba(74,222,128,.18)} .ev.vm::before{background:var(--muted);box-shadow:none} .ev.noconnect::before{background:#475569;box-shadow:none}
  .evhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .evhead .dt{font-weight:700} .evhead .bde{color:var(--accent);font-size:var(--t-cap);font-weight:600}
  .evbody{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-top:8px}
  .bapus{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .bapu{padding:3px 9px;border-radius:7px;font-weight:700;font-size:var(--t-meta);border:1px solid}
  .bapu.on{background:rgba(74,222,128,.14);color:var(--good);border-color:rgba(74,222,128,.38)}
  .bapu.off{background:rgba(248,113,113,.10);color:var(--bad);border-color:rgba(248,113,113,.3)}
  .small{font-size:var(--t-cap);line-height:1.5} .mt6{margin-top:6px}
  ul.ci{margin:5px 0;padding-left:18px;font-size:var(--t-cap)}ul.ci li{margin:2px 0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line);padding:11px 18px;border-radius:var(--r2);font-size:var(--t-base);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;box-shadow:var(--elev2)}
  .toast.show{opacity:1}.toast.err{border-color:rgba(248,113,113,.5);color:var(--bad)}
  /* tabs */
  .tabs{grid-column:1/-1;display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 4px;flex-wrap:wrap}
  .tab{padding:10px 16px;font-size:var(--t-body);font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;border-radius:var(--r1) var(--r1) 0 0;transition:color .15s,background .15s}
  .tab:hover{color:var(--txt);background:var(--panel2)}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,var(--accent-soft))}
  .tab:focus-visible{outline:none;box-shadow:var(--ring)}
  .tabpane{grid-column:1/-1;display:none}
  .tabpane.active{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  @media(max-width:900px){.tabpane.active{grid-template-columns:1fr}}
  .bizrow{border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;margin-bottom:10px;background:var(--panel2)}
  .bizrow .nm{font-weight:700;font-size:var(--t-base)}
  .bizrow .meta{color:var(--muted);font-size:var(--t-cap);margin-top:3px}
  .trk{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:8px;font-size:var(--t-cap);font-weight:600;border:1px solid var(--line);background:var(--panel2);margin:4px 5px 0 0}
  .trk.ads{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.35)}
  .trk.tk{background:var(--accent-soft);color:var(--accent);border-color:rgba(91,140,255,.3)}
  /* tables (SEO keyword audit etc.) — subtle separators + eyebrow header */
  table{border-collapse:collapse}
  table th{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  table thead th{border-bottom:1px solid var(--line);padding-bottom:6px}
  table tbody td{border-bottom:1px solid var(--line-soft);padding:6px 4px;font-variant-numeric:tabular-nums}
  table tbody tr:last-child td{border-bottom:none}

  /* ---- light theme (toggle) — only neutral tokens flip; accent stays ---- */
  :root[data-theme=light]{
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#f3f6fb; --panel3:#eaf0f7;
    --line:#e2e8f1; --line-soft:#eef2f8; --line2:#d3dbe6; --chip:#f0f4fa;
    --txt:#17202e; --txt-dim:#3a4658; --muted:#616d80; --faint:#93a0b2;
    --good:#15a34a; --warn:#c07806; --bad:#dc2626;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --elev2:0 1px 0 rgba(0,0,0,.02) inset,0 10px 26px -18px rgba(20,30,50,.35);
  }
  :root[data-theme=light] body{background:var(--bg);color:var(--txt)}
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;
    border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:17px;line-height:1;cursor:pointer;box-shadow:var(--elev1);display:flex;
    align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .tr-theme-btn:hover{border-color:var(--accent)}
  /* light-mode fixes for hard-coded dark surfaces (default theme is now light) */
  :root[data-theme=light] header{background:linear-gradient(180deg,#ffffff,var(--bg));border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(20,30,50,.03)}
  :root[data-theme=light] header a{color:var(--accent)}
  :root[data-theme=light] .clsbar{background:linear-gradient(180deg,#ffffff,var(--bg));border-bottom:1px solid var(--line)}
  :root[data-theme=light] .navrow{background:transparent}
  :root[data-theme=light] .clstrack{background:#e6ecf5;border:1px solid var(--line)}
  :root[data-theme=light] .brand{background:#ffffff;border:1px solid var(--line);box-shadow:var(--elev1)}
  :root[data-theme=light] input,:root[data-theme=light] select,:root[data-theme=light] textarea{color-scheme:light}
  :root[data-theme=light] .tr-theme-btn{background:#ffffff}
  :root[data-theme=light] .tr-theme-btn:hover{border-color:var(--accent)}


  /* ---- persistent icon rail (Claude-style): always-visible slim nav that expands on hover ---- */
  :root{--rail-w:58px;--rail-open:238px}
  body{padding-left:var(--rail-w)}
  html.tv body{padding-left:0}
  html.tv .tr-rail{display:none}
  .tr-rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail-w);z-index:60;box-sizing:border-box;
    background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:10px 0;overflow:hidden;transition:width .19s cubic-bezier(.4,0,.2,1),box-shadow .19s}
  .tr-rail:hover,.tr-rail:focus-within{width:var(--rail-open);box-shadow:22px 0 48px -30px rgba(8,12,20,.6)}
  .tr-rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
  .tr-rail-nav::-webkit-scrollbar{width:0}
  .tr-rail-foot{flex:none;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .tr-rail-item,.tr-rail-user{display:flex;align-items:center;height:42px;margin:0 8px;border-radius:10px;
    color:var(--txt-dim);text-decoration:none;font-weight:600;font-size:13.5px;overflow:hidden;white-space:nowrap;
    transition:background .12s,color .12s}
  .tr-rail-item:hover{background:var(--panel2);color:var(--txt)}
  .tr-rail-item.active{background:var(--accent-soft);color:var(--accent)}
  .tr-rail-item .ic,.tr-rail-user .ic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail svg{width:20px;height:20px;flex:none}
  .tr-rail .lbl{opacity:0;transition:opacity .16s;letter-spacing:-.1px}
  .tr-rail:hover .lbl,.tr-rail:focus-within .lbl{opacity:1}
  .tr-rail-user .av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .tr-rail-user .lbl{font-weight:600;font-size:12.5px;color:var(--txt-dim);overflow:hidden;text-overflow:ellipsis;max-width:150px}
  :root[data-theme=light] .tr-rail{box-shadow:none}
  :root[data-theme=light] .tr-rail:hover,:root[data-theme=light] .tr-rail:focus-within{box-shadow:22px 0 48px -30px rgba(20,30,50,.35)}
  /* ===== BRAND + POLISH (propagated): adaptive logo, 3-bar rail mark, soft material depth,
     instrument-grade numerals. Appended so it wins the cascade; both themes. ===== */
  :root{--mat-elev:inset 0 1px 0 rgba(255,255,255,.035),0 1px 2px rgba(0,0,0,.34),0 6px 16px -12px rgba(0,0,0,.60)}
  :root[data-theme=light]{--mat-elev:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(20,30,50,.06),0 6px 16px -12px rgba(20,30,50,.16)}
  body{font-variant-numeric:tabular-nums slashed-zero}
  .card{box-shadow:var(--mat-elev)}
  .brand{background:transparent !important;border:0 !important;box-shadow:none !important;padding:0 !important}
  .brand img{filter:brightness(0) invert(1);opacity:.92}
  :root[data-theme=light] .brand img{filter:none;opacity:1}
  .tr-rail-brand{position:relative;display:block;height:46px;margin:2px 8px 8px;color:var(--txt-dim)}
  .tr-rail-brand .barsic{position:absolute;left:0;top:0;width:42px;height:46px;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .15s}
  .tr-rail-brand .barsic svg{width:23px;height:23px}
  .tr-rail-brand .fulllogo{position:absolute;left:12px;top:50%;transform:translateY(-50%);height:24px;opacity:0;transition:opacity .18s;pointer-events:none;max-width:none;filter:brightness(0) invert(1)}
  :root[data-theme=light] .tr-rail-brand .fulllogo{filter:none}
  .tr-rail:hover .tr-rail-brand .barsic,.tr-rail:focus-within .tr-rail-brand .barsic{opacity:0}
  .tr-rail:hover .tr-rail-brand .fulllogo,.tr-rail:focus-within .tr-rail-brand .fulllogo{opacity:1}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" title="Traffic Radius"><img src="/logo.png" alt="Traffic Radius" /></a>
  <div class="hdr-titles">
    <span class="hdr-eyebrow">Prospect 360</span>
    <h1>Prospect</h1>
  </div>
  <span class="spacer"></span>
</header>
<main id="main"><div class="card full muted">Loading prospect 360…</div></main>
<div class="toast" id="toast"></div>

<script>
const KEY = decodeURIComponent(location.pathname.split('/prospect/')[1]||'');
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// SALES REALITY (mirror of server _our_action): the prospect never rings us back — WE call them.
// Reframe "Brenton to call back after his meeting" → "Call Brenton back after his meeting".
const _CB_PRON=new Set(['he','she','they','prospect','the prospect','client','the client','customer','the customer','owner','the owner','gm','the gm','manager','the manager','dm','the dm','decision-maker','the decision-maker','decision maker','the decision maker','contact','the contact']);
function ourAction(text){
  let t=(text==null?'':String(text)).trim(); if(!t) return t;
  if(/^(?:we|i|our bde|the bde|call|ring|phone|email|sms|text|send|follow|schedule|book|re-?engage|reconnect|confirm|offer|ask|pitch|share|drop|arrange|set up|line up)\b/i.test(t)) return t;
  const m=t.match(/^(.+?)\s+(?:is going to|is to|going to|will|would|'ll|to|has to|have to|agreed to|wants to|would like to|is meant to|is supposed to)\s+(?:call|ring|phone|reach out to|get back to)\s+(?:us\s+|me\s+)?(?:back\b)?(.*)$/i);
  if(!m) return t;
  let who=m[1].trim().replace(/[,.]+$/,''); if(_CB_PRON.has(who.toLowerCase())) who='them';
  const rest=(m[2]||'').trim().replace(/^[.,\s]+|[.,\s]+$/g,'');
  return ('Call '+who+' back'+(rest?' '+rest:'')).trim();
}
const fmtN=n=>(n==null||n===''?'—':Number(n).toLocaleString());
const fmtDate=s=>{ if(!s) return '—'; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString('en-AU',{timeZone:'Australia/Melbourne',day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}); };
const TEMP={super_hot:['🔥 SUPER HOT','#ef4444','rgba(239,68,68,.18)'],hot:['🔥 HOT','#fb923c','rgba(251,146,60,.18)'],
            warm:['🌤 WARM','#fbbf24','rgba(251,191,36,.16)'],none:['',' ',' ']};
const PIPE={pipeline1_interested:['Pipeline 1 · Interested (callback)','#60a5fa'],
            pipeline2_existing_agency:['Pipeline 2 · Already with an agency','#c79bf7'],none:['No pipeline','#8b949e']};
// Batch D 5-pipeline labels (used for the hero pipeline badge — a fresh confirmed prospect is P4).
const PIPE5={p1:['P1 · RPC callback','#60a5fa'],p2:['P2 · Already with an agency','#c79bf7'],
             p3:['P3 · Gatekeeper callback','#fbbf24'],p4:['P4 · Fresh worklist','#4ade80'],p5:['P5 · Meeting booked','#f472b6']};
const P4SUB_LBL={fresh_ads:'running ads',fresh_unscanned:'ads unknown',captured_3cx:'captured · 3CX',captured_aircall:'captured · Aircall',attempted:'attempted',dead:'DND'};
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast'+(e?' err':''),2600);}

function metric(n,l,src){ return `<div class="metric"><div class="n">${n}</div><div class="l">${l}</div>${src?`<div class="src">${src}</div>`:''}</div>`; }

// Google-Ads pool chip for the hero — states plainly whether this prospect sits in the confirmed
// Google-Ads pipeline pool (the boards) or is a BDE-sourced prospect that just happens to share a
// call stage. Removes the "P3 · Gatekeeper callback looks like a GAds pipeline slot" confusion.
function poolChip(a){
  a=a||{};
  if(a.in_gads_pool) return `<span class="pill" style="background:rgba(63,185,80,.14);color:#3fb950;border:1px solid rgba(63,185,80,.35)" title="Confirmed running Google Ads (Transparency Center) + D&amp;B-backed — this prospect appears on the Google Ads pipeline boards">🎯 In Google Ads pool</span>`;
  const why = a.running ? 'Runs Google Ads, but we hold no D&B data for it — worked as a BDE follow-up, not counted in the Google Ads pool'
            : !a.has_website ? 'No website on file — can’t confirm Google Ads, so not in the pool'
            : a.checked ? 'Transparency Center checked — no active Google Ads'
            : 'Not yet checked for Google Ads';
  return `<span class="pill" style="background:rgba(139,148,158,.14);color:var(--muted);border:1px solid rgba(139,148,158,.3)" title="${esc(why)}">⛔ Not in Google Ads pool</span>`;
}

function heroCard(d){
  const m=d.master||{}, ro=d.rollup||{}, calls=d.calls||[];
  // Prefer the AI-extracted company name from the latest call that has one.
  let company=null;
  for(let i=calls.length-1;i>=0;i--){ if(calls[i].prospect_company){company=calls[i].prospect_company;break;} }
  const name=company||m.business_name||d.domain||KEY;
  // Prefer the Batch D 5-pipeline (so an uncalled confirmed prospect reads P4 · Fresh, not
  // "No pipeline"); fall back to the legacy call-derived pipeline if the new one isn't present.
  let plbl,pcol,pcode=null;
  const p5=d.pipeline5;
  if(p5&&p5.pipeline&&PIPE5[p5.pipeline]){ const e=PIPE5[p5.pipeline];
    plbl=e[0]+(p5.p4_sub&&P4SUB_LBL[p5.p4_sub]?' · '+P4SUB_LBL[p5.p4_sub]:''); pcol=e[1]; pcode=p5.pipeline; }
  else { [plbl,pcol]=PIPE[ro.pipeline]||PIPE.none; }
  // The header is a CALL-STAGE label — strip the "P# · " code so it doesn't read like a formal
  // Google-Ads pipeline slot; the pool chip beside it says whether this prospect is actually in
  // the Google-Ads pool (the boards = call-stage ∩ GAds-pool, which are two different things).
  const stageLbl = String(plbl).replace(/^P\d+\s·\s/,'');
  const [tlbl,tcol,tbg]=TEMP[ro.temperature]||TEMP.none;
  const badges=[];
  if(ro.ever_booked) badges.push(`<span class="pill yes">📅 Meeting booked</span>`);
  if(ro.ever_qualified) badges.push(`<span class="pill yes">✓ Qualified</span>`);
  if(ro.ever_rpc) badges.push(`<span class="pill info">Reached decision-maker</span>`);
  if(ro.callback_requested) badges.push(`<span class="pill info">📞 Callback requested</span>`);
  if(m.assigned_bde) badges.push(`<span class="pill neutral">Assigned: ${esc(m.assigned_bde)}</span>`);
  const temp = (ro.temperature&&tlbl)?`<span class="tbadge" style="background:${tbg};color:${tcol}">${tlbl}</span>`:'';
  const a = d.ads_status||{};
  const stagePill = `<span class="pill" title="Call stage${pcode?' ('+pcode.toUpperCase()+')':''} — from the classifier, independent of Google-Ads pool" style="background:var(--chip);color:${pcol}">${esc(stageLbl)}</span>`;
  const poolPill = poolChip(a);
  // One honest provenance line so nobody mistakes a BDE-sourced follow-up for a GAds-pool prospect.
  const provTxt = (d.provenance&&d.provenance.label)||'BDE-sourced data';
  const poolTxt = a.in_gads_pool
    ? 'in the Google Ads pipeline pool (confirmed running Google Ads · D&B-backed)'
    : (a.running ? 'runs Google Ads but has no D&B data on file — worked as a BDE follow-up, not in the pool'
       : !a.has_website ? 'not in the Google Ads pool — no website on file to confirm ads'
       : a.checked ? 'not in the Google Ads pool — checked, no active Google Ads'
       : 'not in the Google Ads pool — ads not yet checked');
  return `<div class="hero">
    <div class="top">
      <h1>${esc(name)}</h1>
      ${temp}
      ${stagePill}
      ${poolPill}
    </div>
    ${d.domain?`<div class="dom"><a class="lnk" href="https://${esc(d.domain)}" target="_blank">${esc(d.domain)} ↗</a>${m.location?' · '+esc(m.location):''}</div>`:(m.location?`<div class="dom">${esc(m.location)}</div>`:'')}
    <div class="muted small" style="margin-top:3px">${esc(provTxt)} · ${esc(poolTxt)}</div>
    <div class="stats">
      <div class="stat"><div class="n">${ro.calls||0}</div><div class="l">Calls</div></div>
      <div class="stat"><div class="n">${(ro.bdes||[]).length}</div><div class="l">BDEs called</div></div>
      <div class="stat"><div class="n">${fmtDate(ro.first_call)}</div><div class="l">First call</div></div>
      <div class="stat"><div class="n">${fmtDate(ro.last_call)}</div><div class="l">Last call</div></div>
    </div>
    <div class="badges">${badges.join('')||'<span class="muted small">No funnel milestones yet.</span>'}</div>
  </div>`;
}

function contactsCard(d){
  const m=d.master||{};
  const hasWebsite=!!m.domain;
  const cs=[];
  const push=(nm,ti,mob,ph)=>{ if(nm||mob||ph) cs.push({nm,ti,ph:[mob,ph].filter(Boolean).join(' · ')}); };
  push(m.contact1_name,m.contact1_title,m.contact1_mobile,m.contact1_phone);
  push(m.contact2_name,m.contact2_title,m.contact2_mobile,m.contact2_phone);
  (m.extra_contacts||[]).forEach(c=>push(c.name,c.title,c.mobile,c.phone));
  const rows=cs.map(c=>`<div class="contact"><div><div class="nm">${esc(c.nm)||'—'}</div><div class="ti">${esc(c.ti)||''}</div></div><div class="ph">${esc(c.ph)||'—'}</div></div>`).join('');
  const top = hasWebsite
    ? `<div class="kv">
         <div>Website</div><div><a class="lnk" href="https://${esc(m.domain)}" target="_blank">${esc(m.domain)}</a></div>
         <div>Location</div><div>${esc(m.location)||'—'}</div>
       </div>
       <div class="subh">Decision-makers (master DB)</div>
       ${rows||'<div class="muted small">No contacts on file.</div>'}`
    : `<div class="muted small" style="margin-bottom:4px">⚠ No website on file for this prospect — that's why there's no marketing data. Add the website below and it'll fetch SEO, ads, company &amp; revenue instantly.</div>`;
  return `<div class="card"><h2>Business &amp; contacts</h2>
    ${top}
    ${addWebsiteForm(hasWebsite)}
    ${addPhoneForm(true)}
  </div>`;
}

      <input id="apName" placeholder="Contact name (optional)" style="flex:1;min-width:120px"/>

async function addWebsite(){
  const site=document.getElementById('awSite').value.trim();
  const name=document.getElementById('awName').value.trim();
  if(!site){ toast('Enter a website',true); return; }
  const btn=document.getElementById('awBtn'); btn.disabled=true; btn.textContent='Enriching…';
  try{
    const r=await fetch(`/api/prospect/${encodeURIComponent(KEY)}/set-website`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({website:site,business_name:name})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status);
    toast(j.enriched?'Website saved — marketing data fetched ✓':'Website saved (no SEMrush/Apollo data found for it)'); load();
  }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent='Save & enrich'; }
}

// Merge master-DB SEO metrics with live enrichment (enrichment wins; master fills gaps).
// ---- Apollo free data (company firmographics) ----
function apolloCard(d){
  const apRaw=(d.enrichment||{}).apollo;   // null/undefined => never looked up
  const ap=apRaw||{};
  const rev=ap.annual_revenue_printed||(ap.annual_revenue?'$'+fmtN(ap.annual_revenue):null);
  // Master-DB revenue = the given business-data (companies) SUMMED revenue — shown alongside
  // Apollo's estimate so the two can be compared, not conflated.
  const mrev=fmtRevM((d.company_summary||{}).total_revenue_musd);
  const loc=[ap.city,ap.state,ap.country].filter(Boolean).join(', ');
  const aRows=[['Company',esc(ap.name)],['Industry',esc(ap.industry)],
    ['Revenue (Apollo)',rev?esc(rev):null],['Revenue (Master DB)',mrev?esc(mrev):null],
    ['Employees',ap.employees!=null?fmtN(ap.employees):null],['Founded',ap.founded_year],
    ['HQ',esc(loc)],['Phone',esc(ap.phone)],['LinkedIn',ap.linkedin_url?`<a class="lnk" href="${esc(ap.linkedin_url)}" target="_blank">profile ↗</a>`:null]]
    .filter(r=>r[1]!=null&&r[1]!=='');
  // Did Apollo actually return a company (independent of the master-revenue comparison row)?
  const hasApolloCo=apRaw!=null&&ap.found!==false&&!!(ap.name||ap.industry||rev||ap.employees!=null||ap.founded_year||loc||ap.phone||ap.linkedin_url);
  // When Apollo has no company, say WHY explicitly (not a blank/misleading state).
  const noCoReason=apRaw==null?'No Apollo lookup has been run for this domain yet (free company enrich).'
    :ap.found===false?'Apollo has no company record for this domain (looked up, not found).'
    :(!hasApolloCo?'Apollo returned no company firmographics for this domain.':null);
  const aHtml=(aRows.length?`<div class="kv">${aRows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('')}</div>`:'')
    +(noCoReason?`<div class="muted small${aRows.length?' mt6':''}">${noCoReason}</div>`:'');
  const tech=(ap.technologies||[]).slice(0,18);
  const techHtml=tech.length?`<div class="subh">Tech stack</div><div class="chips">${tech.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'';
  const descr=ap.description?`<div class="muted small mt6">${esc(ap.description)}</div>`:'';
  // Decision-makers (FREE: name + title; email/phone require Apollo credits, shown as a flag).
  // Founder/Owner first (rank 0) → Director → CEO/CFO → Sales/Marketing heads → others.
  const people=(ap.people||[]).slice().sort((a,b)=>((a.rank==null?4:a.rank)-(b.rank==null?4:b.rank)));
  // Contacts WE'VE already spoken to (dedup vs Apollo): first names from our calls + master.
  const _calls=d.calls||[], _m=d.master||{}, _ro=d.rollup||{};
  // Name matching: same first name AND (same last name OR one lacks a last name) — tolerant of
  // titles/middle names but avoids matching every "John". Used to cross-reference Apollo's
  // decision-makers against BOTH our master DB records and the people we've actually called.
  const _norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const _toks=s=>_norm(s).split(' ').filter(Boolean);
  const sameName=(a,b)=>{const A=_toks(a),B=_toks(b);if(!A.length||!B.length)return false;if(A[0]!==B[0])return false;const la=A[A.length-1],lb=B[B.length-1];return la===A[0]||lb===B[0]||la===lb;};
  // Master-DB decision-makers on file (owner + contacts) — for the "in both records" flag.
  const masterNames=[_m.contact1_name,_m.contact2_name,_m.contact_name].filter(Boolean)
    .concat((_m.extra_contacts||[]).map(x=>x&&x.name).filter(Boolean));
  // People we've actually spoken to on a call.
  const calledNames=_calls.map(c=>c.prospect_contact_name).filter(Boolean);
  const inMaster=p=>masterNames.some(mn=>sameName(p.name,mn));   // Apollo DM ↔ master DB record
  const inCalled=p=>calledNames.some(cn=>sameName(p.name,cn));   // Apollo DM ↔ someone we've called
  const contactName=calledNames.length?calledNames[calledNames.length-1]:(masterNames[0]||null);
  // skip-if-DM-already-reached: if we've reached the decision-maker, the Apollo list is supplementary.
  const reachedNote=(_ro.ever_rpc||calledNames.length>0)
    ? `<div class="muted small mt6" style="background:var(--accent-soft);border:1px solid rgba(91,140,255,.35);color:var(--accent);padding:6px 10px;border-radius:8px">✓ Decision-maker already reached on a call${contactName?' — <b>'+esc(contactName)+'</b>':''}. The Apollo list below is supplementary (other contacts at the company).</div>`
    : '';
  // LinkedIn per decision-maker: use Apollo's real profile URL if present (rare — it's
  // credit-gated like email/phone), else a FREE LinkedIn people-search deep-link built from
  // the free fields (first name + company) so the team can one-click find them.
  const liLink=p=>{
    if(p.linkedin_url) return `<a class="lnk" href="${esc(p.linkedin_url)}" target="_blank" title="LinkedIn profile">in↗</a>`;
    // Apollo often masks the last name (e.g. "Hemant Di***n Marsh") on free data, which pollutes
    // the LinkedIn search — so search on FIRST NAME + company only for a clean, reliable match.
    const fn=(p.name||'').trim().split(/\s+/)[0]||'';
    const kw=(fn+' '+(ap.name||'')).trim();
    if(!kw) return '';
    const u=`https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(kw)}`;
    return `<a class="lnk" href="${u}" target="_blank" title="Search LinkedIn (Apollo's exact profile URL needs a credit)">find on LinkedIn ↗</a>`;
  };
  // No decision-makers → say WHY (never looked up / no company / none listed) instead of a bare line.
  const noDmReason=apRaw==null?'No Apollo lookup run yet — decision-makers appear after enrichment.'
    :ap.found===false?'No decision-makers — Apollo has no record for this domain.'
    :'No decision-makers listed by Apollo for this company.';
  const peopleHtml=people.length?`<div class="subh">Decision-makers (${people.length})</div>${reachedNote}
    <div class="kv">${people.map(p=>`<div>${esc(p.name)||'—'}${inMaster(p)?' <span class="pill yes" style="font-size:10px" title="This decision-maker is also in your master DB records (owner/contact on file)">✓ in both records</span>':''}${(inCalled(p)&&!inMaster(p))?' <span class="pill yes" style="font-size:10px">✓ already contacted</span>':''} <span class="muted" style="font-size:11px">${liLink(p)}</span></div>
      <div>${esc(p.title)||'—'}${(p.has_email||p.has_phone)?` <span class="muted" style="font-size:11px">(${[p.has_email?'email':null,p.has_phone?'phone':null].filter(Boolean).join('/')} on file — credits to reveal)</span>`:''}</div>`).join('')}</div>`
    :`<div class="subh">Decision-makers</div><div class="muted small mt6">${noDmReason}</div>`;
  return `<div class="card full"><h2>🏢 Apollo data</h2>${aHtml}${descr}${techHtml}${peopleHtml}</div>`;
}

function businessIntelCard(d){

  if(!b.found) return `<div class="card full"><h2>🧩 Website business intel</h2>
    <div class="muted small">Not extracted yet (runs for paid-ads prospects).</div></div>`;
  const list=(arr)=>(arr&&arr.length)?`<div class="chips">${arr.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'<span class="muted small">—</span>';
  // Business location / service-area, if website intel (or the free website scan) extracted one.
  let loc=b.service_area||b.location||b.target_location||b.locations
    ||(((d.enrichment||{}).website||{}).location)||(((d.enrichment||{}).website||{}).address);
  if(Array.isArray(loc)) loc=loc.filter(Boolean).join(', ');
  const rows=[['Industry',esc(b.industry)],['Target audience',esc(b.target_audience)],
    ['Ideal customer (ICP)',esc(b.icp)],['Service area / location',loc?esc(loc):null]].filter(r=>r[1]);
  return `<div class="card full"><h2>🧩 Website business intel</h2>
    ${b.business_summary?`<div class="small" style="margin-bottom:10px">${esc(b.business_summary)}</div>`:''}
    <div class="subh">Products</div>${list(b.products)}
    <div class="subh">Services</div>${list(b.services)}
    <div class="subh">USPs / differentiators</div>${list(b.usps)}
    ${rows.length?`<div class="kv" style="margin-top:10px">${rows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('')}</div>`:''}

}

function digitalMarketingCard(d){
  const m=d.master||{}, e=d.enrichment||{}, sm=(e&&e.semrush)||{}, df=(e&&e.dataforseo)||null;
  const rank=(df&&df.rank)||{}, org=rank.organic||{}, paid=rank.paid||{}, ads=(df&&df.ads)||{}, bl=(df&&df.backlinks)||{};
  const can=d.can_download;
  const btn = can?`<button class="btn" id="dfsBtn" style="margin-left:8px">${df?'Refresh':'Enrich'} DataForSEO (paid)</button>`:'';
  // ---- ORGANIC / SEO (DataForSEO primary; SEMrush/master fallback) ----
  const orgM=[];
  if(org.count!=null) orgM.push(metric(fmtN(org.count),'Organic keywords','DataForSEO'));
  if(org.etv!=null) orgM.push(metric(fmtN(org.etv),'Organic traffic /mo','DataForSEO'));
  if(org.traffic_cost!=null) orgM.push(metric('$'+fmtN(org.traffic_cost),'Organic traffic value /mo','DataForSEO'));
  if(bl.rank!=null) orgM.push(metric(fmtN(bl.rank),'Domain rank','DataForSEO'));
  if(bl.referring_domains!=null) orgM.push(metric(fmtN(bl.referring_domains),'Referring domains','DataForSEO'));
  if(bl.backlinks!=null) orgM.push(metric(fmtN(bl.backlinks),'Backlinks','DataForSEO'));
  if(!orgM.length){
    if(sm.organic_traffic!=null||m.organic_traffic!=null) orgM.push(metric(fmtN(sm.organic_traffic??m.organic_traffic),'Organic traffic /mo',sm.organic_traffic!=null?'SEMrush':'Master DB'));
    if(sm.organic_keywords!=null||m.organic_keywords!=null) orgM.push(metric(fmtN(sm.organic_keywords??m.organic_keywords),'Organic keywords',sm.organic_keywords!=null?'SEMrush':'Master DB'));
  }
  // ---- PAID (Transparency Center primary + paid keyword/traffic metrics) ----
  const running = df&&df.running_google_ads;
  const verdict = running
    ? `<span class="pill" style="background:rgba(239,68,68,.16);color:var(--bad)">🎯 Running Google Ads — ${fmtN(ads.count)} active ads · last seen ${esc(ads.last_shown||'?')}</span>`
    : (df?`<span class="pill none">No active Google Ads (Transparency Center)</span>`:'');
  const fmts = Object.entries(ads.formats||{}).map(([k,v])=>esc(k)+': '+v).join(' · ');
  const paidM=[];
  if(paid.count!=null) paidM.push(metric(fmtN(paid.count),'Paid keywords','DataForSEO'));
  if(paid.etv!=null) paidM.push(metric(fmtN(paid.etv),'Paid traffic /mo','DataForSEO'));
  if(paid.traffic_cost!=null) paidM.push(metric('$'+fmtN(paid.traffic_cost),'Est. paid spend /mo','DataForSEO'));
  if((ads.advertisers||[]).length) paidM.push(metric(fmtN(ads.advertisers.length),'Advertiser IDs','Transparency'));
  // TOP VERDICT — Transparency Center is PRIMARY (overrides tracking-tag guess). Only fall
  // back to the tracking+call heuristic when DataForSEO hasn't checked this domain.
  let topVerdict;
  if(df && df.running_google_ads){
    topVerdict = `<div style="border:1px solid #3fb95055;background:rgba(63,185,80,.10);border-radius:var(--r2);padding:12px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:18px">🎯</span>
      <b style="color:#3fb950;font-size:15px">Running paid ads — confirmed by Google Ads Transparency Center</b>
      <span class="pill" style="background:#3fb95022;color:#3fb950;border:1px solid #3fb95055">high confidence</span></div>
      <div class="small" style="color:var(--muted);margin-top:6px">${fmtN(ads.count)} active Google ad${ads.count===1?'':'s'} (last seen ${esc(ads.last_shown||'?')})${(d.paid_ads&&d.paid_ads.platforms||[]).includes('Meta')||((e.website||{}).trackers||{}).meta_pixel?' · Meta pixel also present':''}. Tracking tags &amp; traffic are supportive only.</div></div>`;
  } else if(df){
    const metaNote = ((e.website||{}).trackers||{}).meta_pixel ? ' A Meta Pixel is present (may run Meta ads — not covered by Google Transparency).' : '';
    topVerdict = `<div style="border:1px solid var(--line);background:var(--panel2);border-radius:var(--r2);padding:12px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:18px">🚫</span>
      <b style="color:#a371f7;font-size:15px">Not running Google Ads</b>
      <span class="pill" style="background:#8b949e22;color:var(--muted);border:1px solid #8b949e55">Transparency Center checked</span></div>
      <div class="small" style="color:var(--muted);margin-top:6px">No active ads found in the Google Ads Transparency Center (the authoritative source).${metaNote}</div></div>`;
  } else {
    topVerdict = paidAdsVerdict(d.paid_ads);  // no DataForSEO yet -> tracking + call heuristic
  }
  return `<div class="card full"><h2>📈 Digital marketing — SEO &amp; Paid Ads</h2>
    ${topVerdict}

// Prospect-specific next-call points (prefers AI next_call_points, else synthesizes from evidence).
function nextCallPoints(ev){
  const KIND={hook:['🪝','var(--accent)'],question:['❓','var(--accent)'],objection:['🛡️','var(--bad)'],value:['💡','var(--warn)'],logistics:['📋','var(--good)']};
  let pts = Array.isArray(ev.next_call_points) ? ev.next_call_points.filter(p=>p&&p.point) : [];
  if(!pts.length){
    const syn=[];
    (ev.objections||[]).filter(o=>o&&o.handled===false&&o.objection).slice(0,2).forEach(o=>syn.push({point:'Pre-empt: "'+o.objection+'"',kind:'objection'}));
    if(ev.problem_summary) syn.push({point:'Re-open on: '+ev.problem_summary,kind:'hook'});
    (ev.buying_signals||[]).slice(0,1).forEach(s=>syn.push({point:'Build on: '+s,kind:'value'}));
    if(ev.next_step) syn.push({point:ev.next_step,kind:'logistics'});
    pts=syn;
  }
  if(!pts.length) return '';
  return '<ul style="list-style:none;padding-left:0;margin:4px 0 0">'+pts.slice(0,5).map(p=>{const k=KIND[p.kind]||KIND.hook;return '<li class="small" style="margin:3px 0;padding-left:22px;position:relative"><span style="position:absolute;left:0">'+k[0]+'</span><span style="color:'+k[1]+'">'+esc(p.point)+'</span></li>';}).join('')+'</ul>';
}
function callEvent(c, canDownload){
  const ev=(c.evidence&&typeof c.evidence==='object')?c.evidence:{};
  const connected = c.answered && (c.talk_seconds>=15) && c.call_outcome!=='voicemail';
  const booked = c.meeting_booked && !c.meeting_confirmation;
  let cls='ev'; if(booked)cls+=' booked'; else if(c.call_outcome==='voicemail')cls+=' vm'; else if(!connected)cls+=' noconnect';
  const tags=[];
  if(booked) tags.push(`<span class="pill yes">📅 Booked${c.meeting_rescheduled?' (resched)':''}</span>`);
  if(c.meeting_confirmation) tags.push(`<span class="pill neutral">Confirmation call</span>`);
  if(c.qualified) tags.push(`<span class="pill yes">Qualified</span>`);
  if(c.lead_temperature&&c.lead_temperature!=='none'){const[l,col,bg]=TEMP[c.lead_temperature];tags.push(`<span class="pill" style="background:${bg};color:${col}">${l}</span>`);}
  if(c.callback_requested) tags.push(`<span class="pill info">📞 Callback${c.callback_when?': '+esc(c.callback_when):''}</span>`);
  const bapus = (c.budget!=null||c.authority!=null) ?
    `<div class="bapus">${bapu('Budget',ev.budget)}${bapu('Authority',ev.authority)}${bapu('Problem',ev.problem)}${bapu('Urgency',ev.urgency)}${bapu('Aspiration',ev.aspiration)}${bapu('Open',ev.open_to_listening)}</div>`
    + ((ev.runs_paid_ads||ev.has_marketing_agency)?`<div class="small mt6 muted">Auto-validated: ${[ev.runs_paid_ads?'runs paid ads':null,ev.has_marketing_agency?'has an agency':null].filter(Boolean).join(' · ')}</div>`:'')
    : '';
  const sig=(ev.buying_signals||[]).slice(0,4), objs=(ev.objections||[]).slice(0,3);
  const sigHtml=sig.length?`<div class="small mt6"><b>Buying signals:</b><ul class="ci">${sig.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:'';
  const objHtml=objs.length?`<div class="small mt6"><b>Objections:</b><ul class="ci">${objs.map(o=>`<li>${o.handled?'✅':'⚠️'} ${esc(o.objection)}</li>`).join('')}</ul></div>`:'';
  const next=ev.next_step?`<div class="small mt6"><b>Next step:</b> ${esc(ev.next_step)}</div>`:'';
  const npts=nextCallPoints(ev); const nptsHtml=npts?`<div class="small mt6"><b>🎯 Next-call points:</b>${npts}</div>`:'';
  const contract=ev.contract_end?`<div class="small mt6"><b>📄 Contract signal:</b> ${esc(ev.contract_end)}${ev.recommended_cadence_days?` · suggest next call in ~${ev.recommended_cadence_days} days`:''}</div>`:'';
  const who=ev.who_answered?`<span class="muted small">· ${esc(ev.who_answered)}</span>`:'';
  const summ=c.transcript_summary||ev.prospect_summary||'';
  const rec = c.recording_id
    ? `<div style="display:flex;align-items:center;gap:8px;margin:6px 0">
         <audio controls preload="none" style="height:32px;max-width:320px" src="/api/call/${encodeURIComponent(c.call_id)}/recording"></audio>
         ${canDownload?`<a class="lnk small" href="/api/call/${encodeURIComponent(c.call_id)}/recording?download=1" download title="Download recording">⬇</a>`:''}</div>`
    : '';
  return `<div class="${cls}">
    <div class="evhead">
      <span class="dt">${fmtDate(c.started_at)}</span>
      <span class="bde">${esc(c.bde_name)||esc(c.bde_extension)||'?'}</span>
      <span class="muted small">${c.talk_seconds||0}s · ${esc(c.call_outcome)||(connected?'connected':'no connect')}</span>${who}
      <a class="lnk small" style="margin-left:auto" href="/call/${encodeURIComponent(c.call_id)}" target="_blank">Open call ↗</a>
    </div>
    ${rec}
    ${tags.length||bapus||summ||sigHtml||objHtml||next||nptsHtml||contract?`<div class="evbody">
      ${tags.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${tags.join('')}</div>`:''}
      ${bapus}
      ${summ?`<div class="small mt6">${esc(summ)}</div>`:''}
      ${sigHtml}${objHtml}${next}${nptsHtml}${contract}
    </div>`:''}
  </div>`;
}

// ---- OVERALL call-intelligence summary — synthesizes ALL calls into a one-glance manager view
//      so a manager understands the prospect without reading every call. Rule-based (no API),
//      derived from d.calls + d.rollup + d.pipeline5. Rendered at the TOP, above the tabs. ----
function overallSummary(d){
  const calls=d.calls||[], ro=d.rollup||{}, m=d.master||{}, p5=d.pipeline5||{};
  if(!calls.length) return '';           // nothing to synthesize
  const PIPELBL={p1:'RPC callback',p2:'Already with an agency',p3:'Gatekeeper callback',p4:'Fresh worklist',p5:'Booked'};
  // "connected" = a real two-way conversation (same predicate the timeline uses).
  const isConn=c=>c.answered && (c.talk_seconds>=15) && c.call_outcome!=='voicemail';
  const connectedYet = calls.some(c=>c.rpc_connect) || ro.ever_rpc;
  const plbl = (p5.pipeline&&PIPELBL[p5.pipeline])||null;
  const bde = m.assigned_bde || (ro.bdes&&ro.bdes[0]) || null;

  // ---- headline status line ----
  const head=[
    `<b>${calls.length}</b> call${calls.length>1?'s':''}`,
    connectedYet?'<span style="color:var(--good)">✓ reached decision-maker</span>':'<span class="muted">not connected yet</span>',
    plbl?`<span style="color:var(--txt-dim)">${esc(plbl)}</span>`:null,
    bde?`<span class="muted">assigned ${esc(bde)}</span>`:'<span style="color:var(--warn)">unassigned</span>',
  ].filter(Boolean).join('<span class="muted"> · </span>');

  // ---- KEY FACTS chips (derived across all calls) ----
  const chips=[];
  const hasAgency = calls.some(c=>(c.evidence||{}).has_marketing_agency) || p5.pipeline==='p2';
  if(hasAgency) chips.push('<span class="chip">🏢 Has an agency</span>');
  let contract=null; for(let i=calls.length-1;i>=0;i--){const ce=(calls[i].evidence||{}).contract_end; if(ce){contract=ce;break;}}
  if(contract) chips.push(`<span class="chip">📄 Contract: ${esc(contract)}</span>`);
  let dm=null; for(let i=calls.length-1;i>=0;i--){ if(calls[i].prospect_contact_name){dm=calls[i].prospect_contact_name;break;} }
  if(dm) chips.push(`<span class="chip">👤 Decision-maker: ${esc(dm)}</span>`);
  // #6 attribution: OUR enrichment is the source of truth for ads; a BDE/prospect CALL claim is
  // shown separately as "claimed, unverified" so a BDE's pitch assertion is never taken as fact.
  // CONFIRMED = the Google Ads Transparency Center only. A tracking pixel or a call claim is NOT
  // confirmation (a remarketing tag stays on the site with no live campaigns) — shown as unconfirmed.
  const _pa=d.paid_ads||{};
  const adsConfirmed = _pa.transparency_confirmed || String(((d.enrichment||{}).dataforseo||{}).running_google_ads).toLowerCase()==='true';
  const adsUnconfirmed = !adsConfirmed && (_pa.verdict==='likely' || calls.some(c=>(c.evidence||{}).runs_paid_ads) || (((d.enrichment||{}).website||{}).runs_paid_ads));
  if(adsConfirmed) chips.push('<span class="chip">🎯 Running Google Ads <span style="opacity:.65">· confirmed (Transparency Center)</span></span>');
  else if(adsUnconfirmed) chips.push('<span class="chip" style="opacity:.9" title="Ad tags or a call claim only — NOT confirmed live via the Google Ads Transparency Center (a remarketing pixel persists with no active campaigns)">🎯 Ads likely <span style="opacity:.65">· unconfirmed</span></span>');
  const BANT=[['budget','Budget'],['authority','Authority'],['problem','Problem'],['urgency','Urgency'],['aspiration','Aspiration'],['open_to_listening','Open']];
  const bantSeen=BANT.filter(([k])=>calls.some(c=>{const f=(c.evidence||{})[k]; return f&&f.value;})).map(x=>x[1]);
  if(bantSeen.length) chips.push(`<span class="chip">📊 BANT: ${esc(bantSeen.join(' · '))}</span>`);
  if(ro.callback_requested) chips.push('<span class="chip">📞 Callback requested</span>');
  const chipsHtml = chips.length?`<div class="chips">${chips.join('')}</div>`:'<div class="muted small">No hard facts captured across calls yet.</div>';

  // ---- NARRATIVE — the most substantive call (longest-talk connected; fallback longest overall) ----
  let best=null;
  calls.forEach(c=>{ if(isConn(c)&&(!best||(c.talk_seconds||0)>(best.talk_seconds||0))) best=c; });
  if(!best) calls.forEach(c=>{ if(!best||(c.talk_seconds||0)>(best.talk_seconds||0)) best=c; });
  const bev=(best&&best.evidence)||{};
  const narrative = bev.problem_summary || (best&&best.transcript_summary) || bev.prospect_summary || '';
  const narrHtml = narrative
    ? `<div class="subh">Where things stand</div><div class="small">${esc(narrative)}</div>
       <div class="muted" style="font-size:11px;margin-top:4px">— from the ${best&&isConn(best)?'longest connected call':'most substantive call'}, ${esc(best.bde_name||best.bde_extension||'?')} · ${fmtDate(best.started_at)}</div>`
    : '';

  // ---- TOP UNHANDLED OBJECTIONS across calls (evidence.objections where handled===false) ----
  const seen=new Set(), unhandled=[];
  calls.forEach(c=>((c.evidence||{}).objections||[]).forEach(o=>{ if(o&&o.handled===false&&o.objection){const k=String(o.objection).trim().toLowerCase(); if(!seen.has(k)){seen.add(k);unhandled.push(o.objection);}} }));
  const objHtml = unhandled.length
    ? `<div class="subh">Top unhandled objections</div><ul class="ci">${unhandled.slice(0,4).map(o=>`<li>⚠️ ${esc(o)}</li>`).join('')}</ul>`
    : '';

  // ---- RECOMMENDED NEXT MOVE — prefer the server's normalized winning move; else latest call's
  //      next_step / next_call_points[0]. Always reframed as OUR action (never "prospect will call").
  let move=(d.next_move&&d.next_move.move)?d.next_move.move:null;
  if(!move){ for(let i=calls.length-1;i>=0;i--){ const ev=calls[i].evidence||{};
    if(ev.next_step){move=ev.next_step;break;}
    if(Array.isArray(ev.next_call_points)&&ev.next_call_points[0]&&ev.next_call_points[0].point){move=ev.next_call_points[0].point;break;} } }
  move=ourAction(move);
  const na=d.next_action;
  const timing = (na&&na.when)
    ? (na.parked?'Re-engage '+fmtDate(na.when):'Next call '+fmtDate(na.when))+(na.bde?' · '+esc(na.bde):'')
    : null;
  const moveHtml = (move||timing)
    ? `<div class="subh">Recommended next move</div>
       ${move?`<div class="small">🎯 ${esc(move)}</div>`:''}
       ${timing?`<div class="muted small" style="margin-top:4px">📅 ${timing}</div>`:''}`
    : '';

  // ---- PEOPLE directory + FACTS + coaching gaps (#1/#4) from server-synthesized intel ----
  const it=d.intel||{};
  const person=(p,badge,color)=>`<span class="chip" style="border-color:${color}"><b>${esc(p.name)}</b>${p.roles&&p.roles.length?' · '+esc(p.roles.join(', ')):''}${(p.mobiles&&p.mobiles.length)?' · 📱 '+esc(p.mobiles[0]):''}${(p.emails&&p.emails.length)?' · ✉️ '+esc(p.emails[0]):''} <span style="opacity:.6;font-size:10px">${badge}</span></span>`;
  const dms=(it.decision_makers||[]), gks=(it.gatekeepers||[]), others=(it.other_people||[]);
  const peopleHtml=(dms.length||gks.length||others.length)
    ? `<div class="subh">Who we've spoken to</div><div class="chips">
         ${dms.map(p=>person(p,'DECISION-MAKER','var(--good)')).join('')}
         ${gks.map(p=>person(p,'GATEKEEPER','var(--warn)')).join('')}
         ${others.map(p=>person(p,'CONTACT','var(--line)')).join('')}
       </div>` : '';
  const metaBits=[];
  if(it.best_time) metaBits.push(`<span class="chip">🕐 Best time to reach: ${esc(it.best_time)}</span>`);
  (it.extra_contacts||[]).forEach(ct=>{ const bits=[ct.mobile?'📱 '+esc(ct.mobile):'',ct.email?'✉️ '+esc(ct.email):''].filter(Boolean).join(' · '); if(bits) metaBits.push(`<span class="chip">${bits}</span>`); });
  const metaHtml=metaBits.length?`<div class="chips" style="margin-top:6px">${metaBits.join('')}</div>`:'';
  const factsHtml=(it.facts&&it.facts.length)
    ? `<div class="subh">What we've learned about them</div><ul class="ci">${it.facts.slice(0,8).map(f=>`<li>• ${esc(f)}</li>`).join('')}</ul>` : '';
  const gapsHtml=(it.coaching_gaps&&it.coaching_gaps.length)
    ? `<div class="subh">⚑ Coaching — what we keep missing on this prospect</div><ul class="ci">${it.coaching_gaps.slice(0,5).map(g=>`<li style="color:var(--warn)">${esc(g)}</li>`).join('')}</ul>` : '';

  return `<div class="card full">
    <h2>🧭 Call intelligence — overall</h2>
    <div class="small" style="margin-bottom:2px">${head}</div>
    <div class="subh">Key facts</div>${chipsHtml}${metaHtml}
    ${peopleHtml}${factsHtml}${narrHtml}${objHtml}${gapsHtml}${moveHtml}
  </div>`;
}

  if(j.ok){toast('Reassigned to '+bde);load();}else toast(j.error||'Reassign failed',true); }

// ---- Competitor gap audit (K) ---- //
function competitorAuditCard(d){

    <div class="muted small mt6">Finds this prospect's <b>real</b> competitors (generic mega-sites filtered out), the money keywords where a competitor <b>outranks</b> them, and the on-topic keywords rivals win that they don't.</div>
    <div class="mt6">${runBtn}</div></div>`;
  const TH='style="text-align:left;color:var(--muted);font-weight:600;padding:0 10px 4px 0;white-space:nowrap"';
  const RH='style="text-align:right;color:var(--muted);font-weight:600;padding:0 0 4px 10px;white-space:nowrap"';
  const TD='style="padding:5px 10px 5px 0;border-top:1px solid var(--line-soft)"';
  const RD='style="padding:5px 0 5px 10px;text-align:right;border-top:1px solid var(--line-soft);white-space:nowrap"';
  const money=k=>k.money_value!=null?'$'+fmtN(k.money_value):(k.cpc?'$'+fmtN(Math.round((k.volume||0)*(k.cpc||0))):'—');
  // 1) real competitors

    :'<div class="muted small mt6">No clear organic competitors found — this is a niche/local player. Focus on the money keywords above.</div>';
  // 2) being outranked (we rank, they rank higher) — the most actionable, on-topic view
  const orr=(ca.outranked||[]);
  const orrTbl=orr.length?`<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px">
    <thead><tr><th ${TH}>Keyword</th><th ${RH}>Vol/mo</th><th ${RH}>You</th><th ${RH}>Them</th><th ${RH}>$ value/mo</th></tr></thead>
    <tbody>${orr.map(k=>`<tr><td ${TD}>${esc(k.keyword)} <span class="muted" style="font-size:10px">${esc(k.competitor||'')}</span></td><td ${RD}>${fmtN(k.volume)}</td><td ${RD}>#${k.our_position}</td><td ${RD} style="color:var(--warn)">#${k.competitor_position}</td><td ${RD} style="color:var(--good)">${money(k)}</td></tr>`).join('')}</tbody></table>`
    :'<div class="muted small mt6">No overlapping keywords where a competitor beats you — you lead where you both rank. 👍</div>';
  // 3) on-topic money gap (they rank, you don't)
  const kg=(ca.keyword_gap||[]);
  const kgTbl=kg.length?`<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px">
    <thead><tr><th ${TH}>Keyword</th><th ${RH}>Vol/mo</th><th ${RH}>CPC</th><th ${RH}>$ value/mo</th></tr></thead>
    <tbody>${kg.map(k=>`<tr><td ${TD}>${esc(k.keyword)}</td><td ${RD}>${fmtN(k.volume)}</td><td ${RD}>${k.cpc?'$'+k.cpc:'—'}</td><td ${RD} style="color:var(--good)">${money(k)}</td></tr>`).join('')}</tbody></table>`
    :'<div class="muted small mt6">No on-topic money gaps found against this competitor.</div>';
  // 4) content gap — competitor PAGES/topics winning on-topic keywords (what content to build)
  const cg=(ca.content_gap||[]);
  const cgHtml=cg.length?`<div class="subh mt6">📄 Content to build — competitor pages winning on-topic keywords</div>
    <div style="margin-top:4px">${cg.slice(0,5).map(p=>`<div class="small" style="margin:6px 0">
      <b>${esc(p.topic||p.page)}</b> <span class="muted">(${p.keyword_count} kw · ${fmtN(p.total_volume)}/mo)</span>
      <div class="muted" style="font-size:11px;margin-top:2px">${esc((p.example_keywords||[]).slice(0,5).join(', '))}${p.page?' · <a href="'+esc(p.page)+'" target="_blank" style="color:var(--accent)">'+esc(p.domain||'source')+'</a>':''}</div>
    </div>`).join('')}</div>`:'';
  const wins=w=>(w||[]).slice(0,5).map(x=>`<li class="small" style="margin:4px 0"><b>${esc(x.title)}</b>${x.detail?' — '+esc(x.detail):''}${(x.effort||x.impact)?` <span class="muted">(${esc(x.effort||'')}/${esc(x.impact||'')})</span>`:''}</li>`).join('');
  const geo=ca.geo_aeo&&ca.geo_aeo.score!=null?`<div class="subh mt6">🤖 AI-search (GEO/AEO) readiness — ${ca.geo_aeo.score}/100</div>
    <div class="small" style="opacity:.85">${(ca.geo_aeo.checks||[]).slice(0,6).map(c=>`${c.pass?'✅':'⚠️'} ${esc(c.name)}`).join(' · ')}</div>`:'';
  return `<div class="card full"><h2>🥊 Competitor gap audit</h2>

    <div class="muted small mt6" style="opacity:.75">Backlink/off-page analysis disabled to control cost — treat authority-building as a checklist item.</div>
  </div>`;
}

// ---- Full audit report: generate underlying data (paid), then export HTML / PDF / DOCX ---- //
function fullAuditCard(d){
  const df=((d.enrichment||{}).dataforseo)||{};
  const ready = !!(df.audit && df.competitor_audit);   // the full report (all sections) is generated
  const can = d.can_download;
  const tkt = `<div class="mt6" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <label class="small" style="color:var(--muted)">Average sale / project value</label>
      <span style="display:inline-flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:700">$<input id="auditTicket" type="number" min="0" step="100" value="2000" style="width:92px;background:transparent;border:0;color:var(--txt);font:inherit;font-weight:700;outline:none"></span>
      <span class="muted small">drives every revenue figure in the report</span></div>`;
  let action;
  if(ready){
    // Report is generated → view / download. One optional "regenerate" for managers.
    action = `<div class="mt6" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="primary" onclick="openAudit('html')">📄 View report</button>
        <button class="btn" onclick="openAudit('pdf')">⬇ PDF</button>
        <button class="btn" onclick="openAudit('docx')">⬇ Word</button>
        ${can?`<button class="btn" id="genAuditBtn" onclick="generateAudit()" style="margin-left:auto" title="Re-pull the SEO + competitor data">↻ Regenerate</button>`:''}
      </div>`;
  } else if(can){
    // Not generated yet → ONE button that builds the whole report.
    action = `<div class="mt6"><button class="primary" id="genAuditBtn" onclick="generateAudit()">▶ Generate full report (paid)</button>
        <div class="muted small" style="margin-top:6px">Pulls all SEO + competitor data (~6 DataForSEO calls, ~40s). When it finishes, View / PDF / Word appear right here.</div></div>`;
  } else {
    action = `<div class="mt6 muted small">The full report is generated by a manager (paid). Once ready, anyone here can view or download it.</div>`;
  }
  return `<div class="card full"><h2>📊 Full audit report — client-ready PDF &amp; Word</h2>
    <div class="muted small">A premium, in-depth digital-marketing audit — health scorecard, revenue opportunity, Google Ads, SEO money keywords, competitor gap, content gap and a 90-day plan — built to make the prospect feel the gap and want a call.</div>
    ${tkt}
    ${action}
    <div id="auditErr"></div>
  </div>`;
}
function auditURL(fmt){ const el=document.getElementById('auditTicket'); const t=(el&&+el.value)||2000; return '/api/prospect/'+encodeURIComponent(KEY)+'/audit.'+fmt+'?ticket='+t; }
function openAudit(fmt){ window.open(auditURL(fmt),'_blank'); }
function showAuditErr(msgs){
  const el=document.getElementById('auditErr'); if(!el) return;
  el.innerHTML = `<div class="mt6" style="background:rgba(248,113,113,.12);border:1px solid var(--bad);border-radius:8px;padding:11px 13px;color:var(--bad);font-size:12.5px">

async function generateAudit(){
  const b=document.getElementById('genAuditBtn'); const lbl=b?b.textContent:''; if(b){b.disabled=true;b.textContent='Generating full report… (~40s)';}
  const errEl=document.getElementById('auditErr'); if(errEl) errEl.innerHTML='';
  try{
    const r=await fetch('/api/prospect/'+encodeURIComponent(KEY)+'/audit/ensure',{method:'POST'});
    const j=await r.json().catch(()=>({}));
    const errs=(j.errors||[]);
    if(r.ok && j.ok && !errs.length){
      toast('Full report ready ✓'); load(); return;    // re-render → View / PDF / Word appear
    }
    // partial or hard failure → show the REAL reason, persistently, and DON'T re-render (keep it visible)
    const msgs = errs.length ? errs : [j.detail||j.error||('Generation failed — HTTP '+r.status)];
    showAuditErr(msgs);
    if(b){b.disabled=false;b.textContent=lbl||'▶ Generate full report (paid)';}
  }catch(e){ showAuditErr(['Generation error: '+e.message]); if(b){b.disabled=false;b.textContent=lbl||'▶ Generate full report (paid)';} }
}
async function load(){
  let d;
  try{ const r=await fetch('/api/prospect/'+encodeURIComponent(KEY)); d=await r.json(); if(!r.ok) throw new Error(d.error||r.status); }
  catch(e){ document.getElementById('main').innerHTML='<div class="card full">Could not load prospect ('+esc(e.message)+')</div>'; return; }
  if(!d.found){ document.getElementById('main').innerHTML='<div class="card full">No prospect or calls found for <b>'+esc(KEY)+'</b>.</div>'; return; }
  // Name: master-file name → D&B company name (fresh/data-pool prospects only live in `companies`)
  // → domain → the dialled number as a last resort.
  const _co0=(d.companies&&d.companies[0])||null;
  document.querySelector('header h1').textContent =
    (d.master&&d.master.business_name) || (_co0&&(_co0.company_name||_co0.business_name)) || d.domain || KEY;
  // The 6 sections exactly as requested.
  function messagesCard(d){
    const ms=(d.messages||[]);
    if(!ms.length) return `<div class="card full"><h2>💬 SMS / chat</h2><div class="muted small">No inbound SMS/chat captured for this prospect.</div></div>`;
    const rows=ms.map(m=>{
      const badge = m.is_booking_confirmation ? `<span class="pill yes">📅 booking confirmation</span>`
        : (m.intent && !['reply','other'].includes(m.intent) ? `<span class="pill" style="background:rgba(148,163,184,.16);color:var(--txt-dim)">${esc(m.intent)}</span>` : '');
      const when = esc(String(m.time_sent||'').slice(0,16).replace('T',' '));
      const mt = m.meeting_datetime ? `<div class="muted small" style="margin-top:3px">🗓 ${esc(m.meeting_datetime)}</div>` : '';
      const lnk = m.applied_call_id ? ` · <a class="lnk" href="/call/${esc(m.applied_call_id)}" target="_blank">firmed booking ↗</a>` : '';
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div class="muted small">${when} · ${esc(m.sender_name||m.sender_phone||'')} ${badge}${lnk}</div>
        <div style="margin-top:4px">${esc(m.body||'')}</div>${mt}</div>`;
    }).join('');
    return `<div class="card full"><h2>💬 SMS / chat (${ms.length})</h2>${rows}</div>`;
  }

  const tabs=[
    ['uploaded','Uploaded database info', businessDataCard(d)+contactsCard(d)],
    ['apollo','Apollo (company + people)', apolloCard(d)],
    ['business','Website business intel', businessIntelCard(d)],
    ['whois','Domain / WHOIS', whoisCard(d)],
    ['website','Website information', websiteInfoCard(d)],
    ['digital','Digital marketing insights', fullAuditCard(d)+digitalMarketingCard(d)+seoAuditCard(d)+competitorAuditCard(d)],
    ['calls','Call intelligence ('+((d.calls||[]).length)+')', timelineCard(d)],
    ['messages','SMS / chat ('+((d.messages||[]).length)+')', messagesCard(d)],
    ['tracking','Tracking codes available', trackingCodesCard(d)],
  ];
  // Lead with Call intelligence for called prospects (so a fresh call never looks "empty");
  // otherwise lead with the uploaded/enrichment view.
  const defPane = (d.calls||[]).length ? 'calls' : 'uploaded';
  document.getElementById('main').innerHTML =
    heroCard(d)
    + nextMoveCard(d)      // #1 action — the single best move, reads first
    + overallSummary(d)    // the synthesis / story across all calls
    + nextActionCard(d)    // when & who is scheduled next
    + priorityCard(d)      // priority score
    + `<div class="tabs">${tabs.map(t=>`<button class="tab${t[0]===defPane?' active':''}" data-pane="${t[0]}">${t[1]}</button>`).join('')}</div>`
    + tabs.map(t=>`<div class="tabpane${t[0]===defPane?' active':''}" id="pane-${t[0]}">${t[2]}</div>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); document.getElementById('pane-'+b.dataset.pane).classList.add('active');
  });
  const ab=document.getElementById('apBtn'); if(ab) ab.onclick=addPhone;
  const wb=document.getElementById('awBtn'); if(wb) wb.onclick=addWebsite;
  const eb=document.getElementById('ewBtn'); if(eb) eb.onclick=enrichWebsite;
  const db=document.getElementById('dfsBtn'); if(db) db.onclick=enrichDataforseo;
  const sb=document.getElementById('seoAuditBtn'); if(sb) sb.onclick=runSeoAudit;
}
load();
/* LIVE: refresh on server push (SSE /api/events) + 60s poll fallback; pause when hidden. Re-fetches
   the prospect but PRESERVES the open tab + scroll position so it isn't disruptive. */
async function liveReload(){
  var a=document.querySelector('.tab.active'); a=a?a.dataset.pane:null; var y=window.scrollY;
  try{ await load(); }catch(e){}
  if(a){ var t=document.querySelector('.tab[data-pane="'+a+'"]'); if(t) t.click(); }
  window.scrollTo(0,y);
}
(function(){var es,rt;function go(){ if(!document.hidden) liveReload(); }
  setInterval(go,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) go(); });
  (function s(){ try{ es=new EventSource('/api/events'); es.addEventListener('refresh',go);
    es.onerror=function(){ if(es&&es.readyState===2&&!rt) rt=setTimeout(function(){rt=null;s();},5000); }; }catch(e){} })();
})();
</script>
