<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call detail — 3CX Funnel</title>
<style>
  /* ============================================================================
     PREMIUM DESIGN SYSTEM — matched to the main dashboard (index.html).
     Same tokens, 8px rhythm, one accent, reconciled semantics, tabular numerals.
     Only the <style> was reworked; every class name the JS renders is preserved.
     ============================================================================ */
  :root{
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14);
    --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1a2433;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r1:8px; --r2:10px; --r3:12px; --r4:14px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --elev2:0 1px 0 rgba(255,255,255,.025) inset, 0 10px 28px -16px rgba(0,0,0,.80);
    --t-micro:10px; --t-eyebrow:10.5px; --t-meta:11px; --t-cap:12px; --t-body:13px;
    --t-base:14px; --t-strong:16px; --t-fig:22px; --t-kpi:27px; --t-h1:30px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 560px at 82% -12%,#10161f 0%,#0a0d13 60%) fixed,#0a0d13;
    color:var(--txt);font:var(--t-base)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:var(--accent-soft)}
  *{scrollbar-width:thin;scrollbar-color:#2a3344 transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#28313f;border:2px solid transparent;background-clip:padding-box;border-radius:8px}
  *::-webkit-scrollbar-thumb:hover{background:#34404f;background-clip:padding-box}
  *::-webkit-scrollbar-track{background:transparent}

  /* --- top bar --- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;
    background:rgba(11,15,22,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header a{color:var(--accent);text-decoration:none;font-size:var(--t-body)}
  header h1{font-size:var(--t-strong);margin:0;font-weight:700;letter-spacing:-.2px}
  .brand{display:flex;align-items:center;background:#fff;border-radius:9px;padding:5px 10px;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .brand img{height:26px;display:block}
  .backlink{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r1);
    border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:var(--t-cap);
    transition:border-color .14s,background .14s,color .14s}
  .backlink:hover{border-color:var(--line2);background:var(--panel2);color:var(--txt)}
  .backlink:focus-visible{outline:none;box-shadow:var(--ring)}

  /* --- layout --- */
  main{max-width:1180px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  @media(max-width:900px){main{grid-template-columns:1fr;padding:16px}}

  /* --- cards (raised tier, matches index hero cards) --- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);padding:18px 20px;box-shadow:var(--elev2)}
  .card.full{grid-column:1/-1}
  /* card heading = uppercase eyebrow overline; a .muted continuation reads normal-case */
  h2{font-size:var(--t-cap);margin:0 0 var(--s3);color:var(--muted);font-weight:700;text-transform:uppercase;
    letter-spacing:.7px;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2 .muted{font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
  /* one-line plain-English explainer that sits right under a heading (kills confusion) */
  .hint{font-size:var(--t-cap);color:var(--muted);line-height:1.55;margin:0 0 14px}
  .hint b{color:var(--txt-dim);font-weight:700}

  /* --- key / value grid --- */
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:var(--t-body);line-height:1.5}
  .kv div:nth-child(odd){color:var(--muted);font-weight:500}
  .kv div:nth-child(even){color:var(--txt-dim)}

  /* --- funnel-verdict stage rows --- */
  .stage{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .stage:last-child{border-bottom:none}
  .stage .nm{font-weight:700;font-size:var(--t-body);color:var(--txt);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stage-mean{color:var(--muted);font-size:var(--t-meta);margin-top:3px;font-weight:500;line-height:1.45;max-width:64ch}
  .stage .ev{color:var(--txt-dim);font-size:var(--t-cap);margin-top:5px;max-width:64ch;line-height:1.5}

  /* --- pills (semantic soft fills, consistent everywhere) --- */
  .pill{display:inline-block;padding:3px 10px;border-radius:7px;font-size:var(--t-meta);font-weight:700;
    white-space:nowrap;line-height:1.55;border:1px solid transparent;vertical-align:middle}
  .pill.yes,.yes{background:rgba(74,222,128,.14);color:#86efac;border-color:rgba(74,222,128,.26)}
  .pill.no,.no{background:rgba(248,113,113,.13);color:#fca5a5;border-color:rgba(248,113,113,.26)}

  .analysis{white-space:pre-wrap;font-size:var(--t-body);line-height:1.65;color:var(--txt-dim)}
  .transcript{white-space:pre-wrap;background:#070a0f;border:1px solid var(--line);border-radius:var(--r1);
    padding:14px 16px;max-height:60vh;overflow:auto;font:var(--t-body)/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c8d2de}
  .muted{color:var(--muted)}
  .big{font-size:20px;font-weight:800}

  /* --- lead qualification: BANT / AO flags as labelled tiles with plain-English meaning --- */
  .bapus{display:flex;gap:var(--s2);flex-wrap:wrap}
  .bapu{display:flex;flex-direction:column;gap:2px;padding:8px 13px;border-radius:var(--r2);border:1px solid;cursor:default;min-width:98px}
  .bapu .bapu-t{font-weight:700;font-size:var(--t-body);white-space:nowrap}
  .bapu .bapu-m{font-size:var(--t-micro);letter-spacing:.2px;opacity:.9;font-weight:500}
  .bapu.on{background:rgba(74,222,128,.12);color:#86efac;border-color:rgba(74,222,128,.32)}
  .bapu.off{background:rgba(248,113,113,.08);color:#fca5a5;border-color:rgba(248,113,113,.24)}
  .tbadge{padding:6px 15px;border-radius:999px;font-weight:800;font-size:var(--t-body);letter-spacing:.4px}

  /* --- shared layout helpers --- */
  .bizgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
  @media(max-width:700px){.bizgrid{grid-template-columns:1fr}}
  .subh{font-weight:700;font-size:var(--t-eyebrow);color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
    margin-bottom:var(--s2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:3px 9px;font-size:var(--t-meta);color:var(--txt-dim)}
  /* BDM override ACTION buttons — solid, obviously clickable (not faint pills) */
  .actbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:var(--t-cap);font-weight:700;
    padding:10px 16px;border-radius:var(--r2);cursor:pointer;border:1px solid transparent;
    transition:filter .12s,box-shadow .12s,transform .04s;box-shadow:var(--elev1)}
  .actbtn:hover{filter:brightness(1.09)}
  .actbtn:active{transform:translateY(1px)}
  .actbtn:focus-visible{outline:none;box-shadow:var(--ring)}
  .actbtn.pos{background:linear-gradient(180deg,#22c55e,#16a34a);color:#fff;border-color:#15803d}
  .actbtn.neg{background:linear-gradient(180deg,#f05252,#dc2626);color:#fff;border-color:#b91c1c}
  .actbtn.ghost{background:var(--panel3);color:var(--txt-dim);border-color:var(--line2);box-shadow:none}
  .actbtn.ghost:hover{background:var(--panel2);border-color:var(--line2);color:var(--txt);filter:none}
  /* booking-outcome choice buttons — tinted but clearly a raised, clickable control */
  .obbtn{font:inherit;font-size:var(--t-cap);font-weight:700;padding:9px 13px;border-radius:var(--r2);
    cursor:pointer;box-shadow:var(--elev1);transition:filter .12s,box-shadow .12s,transform .04s}
  .obbtn:hover{filter:brightness(1.12)}
  .obbtn:active{transform:translateY(1px)}
  .obbtn:focus-visible{outline:none;box-shadow:var(--ring)}
  ul.ci{margin:6px 0;padding-left:18px;font-size:var(--t-body);line-height:1.55}
  ul.ci li{margin:4px 0}
  .obj{margin:8px 0}
  .scrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .scl{width:150px;font-size:var(--t-cap);color:var(--txt-dim)}
  .sctrack{flex:1;height:8px;background:#070a0f;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .sctrack i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--good))}
  .scn{width:38px;text-align:right;font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums}
  a.lnk,.lnk{color:var(--accent);text-decoration:none;font-weight:600}
  a.lnk:hover,.lnk:hover{text-decoration:underline}
  textarea:focus{outline:none;box-shadow:var(--ring)}

  /* --- tabs --- */
  .tabs{grid-column:1/-1;display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:var(--s2);flex-wrap:wrap}
  .tab{padding:10px 16px;font-size:var(--t-body);font-weight:650;color:var(--muted);cursor:pointer;border:none;background:none;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .14s,border-color .14s}
  .tab:hover{color:var(--txt-dim)}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:none;color:var(--txt);box-shadow:var(--ring);border-radius:6px 6px 0 0}
  .tabpane{grid-column:1/-1;display:none}
  .tabpane.active{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  @media(max-width:900px){.tabpane.active{grid-template-columns:1fr}}

  /* ---- light theme (toggle) — only neutral tokens flip; accent stays ---- */
  :root[data-theme=light]{
    --bg:#f4f7fb; --panel:#ffffff; --panel2:#f1f5fa; --panel3:#e8eef6;
    --line:#dbe2ec; --line-soft:#e7edf4; --line2:#c8d2df; --chip:#eef3f9;
    --txt:#1a2331; --txt-dim:#39465a; --muted:#5f6b7d; --faint:#8994a6;
    --good:#15a34a; --warn:#c07806; --bad:#dc2626;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --elev2:0 1px 0 rgba(0,0,0,.02) inset,0 10px 26px -18px rgba(20,30,50,.35);
  }
  :root[data-theme=light] body{background:var(--bg);color:var(--txt)}
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;
    border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:17px;line-height:1;cursor:pointer;box-shadow:var(--elev1);display:flex;
    align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .tr-theme-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" title="Traffic Radius"><img src="/logo.png" alt="Traffic Radius" /></a>
  <a class="backlink" href="/">&larr; Dashboard</a>
  <h1 id="title">Call detail</h1>
  <span class="muted" id="subtitle"></span>
</header>
<main id="main"><div class="card full muted">Loading…</div></main>

<script>
const pill=(v)=>`<span class="pill ${v?'yes':'no'}">${v?'YES':'NO'}</span>`;
// A tentative booking is only a real booking when a SPECIFIC time was agreed (clock time /
// am-pm / noon), not just a vague day/range. Mirrors the SQL/Python booking rule.
const hasMeetingTime=(dt)=>!!dt && /[0-9]:[0-9]|[0-9]\s*[ap]\.?m|noon|midday/i.test(dt);
const esc=s=>(s==null?'':String(s)).replace(/[&<]/g,c=>({'&':'&amp;','<':'&lt;'}[c]));
const id=decodeURIComponent(location.pathname.split('/call/')[1]||'');

// Final funnel verdict for a booking. Reschedules & confirmations are NOT counted
// again (the booking was counted the day it was first made); tentative/cancelled
// attempts never count.
function banner(css,txt){return `<div style="padding:13px 15px;border-radius:12px;font-weight:700;margin:0 0 14px;line-height:1.5;font-size:13px;border:1px solid rgba(255,255,255,.06);${css}">${txt}</div>`;}
function bookingBanner(ev, counts, dt, o, pq, qvia){
  const AMBER='background:rgba(251,191,36,.16);color:#fbbf24', GREY='background:rgba(139,148,158,.14);color:#9aa4af',
        GREEN='background:rgba(34,197,94,.16);color:#4ade80', BLUE='background:rgba(59,130,246,.16);color:#60a5fa';
  const bs=ev.booking_status;
  // A booking = firm OR a TENTATIVE meeting WITH a SPECIFIC agreed time (clock time / am-pm /
  // noon). A tentative with only a vague day or range ("next Thursday or Friday", "next week")
  // is a soft follow-up, not a booking. Mirrors the SQL/Python rule in aggregate.py/app.py.
  const isBooking = (ev.meeting_booked && ev.meeting_booked.value) || (bs==='tentative' && hasMeetingTime(dt));
  // A BDM override is the source of truth over the AI. When the BDM qualifies a (tentative)
  // booking, the meeting is CONFIRMED because of his override — say so explicitly.
  const by = o && o.override_by ? ' ('+esc(o.override_by)+')' : '';
  if(o && (o.qualified===true || o.booking_outcome==='counts'))
    return banner(GREEN,'✅ Qualified booked meeting — <b>confirmed by the BDM'+by+"'s override</b>. The AI left this as "+(bs==='tentative'?'a tentative / unqualified':'not qualified')+' booking; the BDM reviewed it and confirmed it, so it now counts as Meeting Booked AND Qualified Booked.');
  if(o && o.booking_outcome==='not_booking')
    return banner(AMBER,'✕ Marked <b>not a booking by the BDM'+by+"'s override</b> — NOT counted, even though the AI read it as a booking.");
  if(!isBooking){
    if(bs==='cancelled_or_declined') return banner(AMBER,'❌ Booking attempt — the prospect cancelled / declined. NOT counted as a booking.');
    if(bs==='tentative') return banner(GREY,'🕓 Tentative — no specific meeting time agreed (only a vague day/range or none). NOT counted as a booking (treat as a follow-up).');
    return '';
  }
  const conf = ev.meeting_confirmation_only && ev.meeting_confirmation_only.value;
  const resched = ev.meeting_rescheduled && ev.meeting_rescheduled.value;
  const already = ev.booking_already_exists && ev.booking_already_exists.value;
  // Qualified BOOKED is a PROSPECT-level fact (matches the funnel): the booking is qualified if
  // THIS call is qualified OR any earlier call on the prospect was. Fall back to this call's
  // verdict only when the API didn't supply the prospect-level flag.
  const aiThisQual = ev.qualified && ev.qualified.value;
  const qual = (pq==null) ? aiThisQual : !!pq;
  const viaNote = (qual && !aiThisQual && qvia)
    ? ` <span style="font-weight:400;opacity:.85">(the prospect was qualified on an earlier call${qvia.bde?' by '+esc(qvia.bde):''}${qvia.date?' on '+esc(qvia.date):''} — qualification is a prospect-level fact)</span>` : '';
  if(already){ const ev2=(ev.booking_already_exists&&ev.booking_already_exists.evidence)||'';
    return banner(AMBER,'🤝 Already booked for this company — a referral / hand-off to another contact of a company that was already booked. NOT counted as a new booking.'+(ev2?'<div style="font-weight:400;font-size:12px;margin-top:4px;opacity:.85">'+ev2+'</div>':'')); }
  if(conf) return banner(AMBER,'📞 Meeting Confirmation Call — re-confirms a meeting booked on an earlier call. NOT counted again.');
  if(resched) return banner(AMBER,'🔁 Rescheduled booking — re-books an earlier meeting to a new date. NOT counted again (the original was already counted).');
  if(counts===false) return banner(AMBER,'🏢 Company already booked on an earlier call — NOT counted again (one booking per company).');
  // The AI self-qualifies EVERY booked meeting (firm or tentative) by its own BANT judgment.
  // A tentative booking is still qualified/not on the AI's verdict; the BDM can override either way.
  const tent = bs==='tentative' ? ' <span style="font-weight:400;opacity:.85">(tentative time — not firmly locked yet)</span>' : '';
  if(qual) return banner(GREEN,'✅ Qualified booked meeting'+tent+' — counts as Meeting Booked AND Qualified Booked.'+viaNote+' A BDM can override.');
  return banner(BLUE,'📅 Meeting Booked (counted)'+tent+' — the prospect is not qualified (BANT not met on this or any earlier call), so it is excluded from Qualified Booked. A BDM can override to qualify it.');
}

const RPC_REASON={reached_rpc:'Reached the decision-maker',gatekeeper_block:'Blocked by gatekeeper',dm_unavailable:'Decision-maker unavailable',voicemail:'Went to voicemail',no_answer:'No answer',wrong_number:'Wrong number',not_decision_maker:'Reached the wrong person',other:'Decision-maker not reached'};
function rpcNextMoveCard(d){
  const c=d.call||{}, cl=d.classification||{}, ev=cl.evidence||{};
  const ra=d.rpc_action||{}, nm=ev.rpc_next_move||{};
  const rpc=ev.rpc_connect;
  // Only relevant when the DM was NOT reached. If reached, a tiny reassurance; if the
  // AI never assessed RPC (no evidence), render nothing.
  if(!(rpc && rpc.value===false)){
    if(rpc && rpc.value===true)
      return `<div class="card full" style="border-left:3px solid var(--accent)"><h2>RPC Connect — Next Move</h2>
        <span class="pill yes">✓ Reached the decision-maker — no action owed</span></div>`;
    return '';
  }
  const val=(a,b)=> (a!=null?a:(b!=null?b:null));
  // (1) WHY not reached
  const reasonCode=ra.reason||nm.rpc_unreached_reason||'';
  const reasonLbl=RPC_REASON[reasonCode]||(reasonCode?String(reasonCode).replace(/_/g,' '):'Decision-maker not reached');
  const dmName=val(ra.dm_name,nm.dm_name), dmRole=nm.dm_role, dmWhen=val(ra.dm_available_when,nm.dm_available_when);
  const gkNotes=cl.gatekeeper_notes||ev.gatekeeper_notes, unavail=val(ra.reason_unavailable,nm.reason_unavailable);
  const whyLines=[
    gkNotes?'Gatekeeper: '+esc(gkNotes):null,
    unavail?'Unavailable: '+esc(unavail):null,
    (dmName||dmRole)?'Decision-maker: '+esc([dmName,dmRole].filter(Boolean).join(' · ')):null,
    dmWhen?'Available: '+esc(dmWhen):null,
  ].filter(Boolean);
  const why=`<div class="subh">Why not reached</div>
    <div style="margin-bottom:8px"><span class="pill" style="background:rgba(59,130,246,.16);color:#60a5fa">${esc(reasonLbl)}</span></div>
    ${whyLines.length?`<div class="muted" style="font-size:12.5px;line-height:1.7">${whyLines.join('<br>')}</div>`:'<div class="muted">No further detail captured.</div>'}`;
  // (2) DID THE BDE DO IT — tri-state (✓ / ✗ / ? unknown) reusing the .pill styles.
  const row=(label,inner)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(label)}</span>${inner}</div>`;
  const tri=(label,v)=>{
    if(v===true) return row(label,`<span class="pill yes">✓</span>`);
    if(v===false) return row(label,`<span class="pill no">✗</span>`);
    return row(label,`<span class="pill" style="background:rgba(139,148,158,.14);color:#9aa4af">?</span>`);
  };
  const ch=ra.channel||'';
  const isMobile = ch==='mobile' || ra.action_code==='double_tap' || ra.action_code==='sms_vm'
    || ra.double_tap_done!=null || ra.voicemail_left!=null || ra.sms_sent!=null;
  const isGk = ra.action_code==='gatekeeper_getdm' || ra.action_code==='ask_for_dm'
    || ra.gatekeeper_handled!=null || ra.asked_for_dm!=null || ra.asked_callback_time!=null
    || nm.asked_for_dm!=null || !!gkNotes;
  let checklist='';
  if(isMobile){
    checklist += tri('Double-tap (2nd dial)', ra.double_tap_done);
    checklist += tri('Voicemail likely left', ra.voicemail_left);
    checklist += (ra.sms_sent==null)
      ? row('SMS follow-up', `<span class="pill" style="background:rgba(139,148,158,.14);color:#9aa4af">can't verify</span>`)
      : tri('SMS follow-up', ra.sms_sent);
  }
  if(isGk){
    checklist += tri('Asked for the decision-maker', val(ra.asked_for_dm,nm.asked_for_dm));
    checklist += tri('Asked best callback time', val(ra.asked_callback_time,nm.asked_callback_time));
    checklist += tri('Got a direct contact', val(ra.got_direct_contact,nm.got_direct_contact));
    checklist += tri('Gatekeeper handled well', ra.gatekeeper_handled);
  }
  if(!checklist) checklist='<div class="muted">No follow-up checklist for this scenario.</div>';
  const breach = ra.did_required_action===false
    ? `<div class="pill no" style="display:inline-block;margin-bottom:10px">⚠ Required follow-up not done</div>` : '';
  const did=`<div class="subh">Did the BDE do it</div>${breach}${checklist}`;
  // (3) NEXT MOVE — highlighted "what to do next" box.
  const nextTxt = ra.next_move || nm.next_move || ra.required_action || 'Keep working this number until you reach the decision-maker.';
  const chVal = val(ra.next_move_channel, nm.next_move_channel);
  const chBadge = chVal?` <span class="pill" style="background:rgba(59,130,246,.16);color:#60a5fa">${esc(chVal)}</span>`:'';

}

// Plain-English meaning of each funnel stage — shown under the stage name so a user
// never has to guess what a YES/NO verdict actually means.
const STAGE_MEAN={
  'Right Party Contact (decision-maker)':'Did we get the person who can say yes on the phone?',
  'Full Pitch':'Did the BDE deliver the complete offer / pitch?',
  'Lead (interest)':'Did the prospect show genuine interest?',
  'Meeting Booked':'Was a strategy session booked on this call?',
  'Rescheduled booking (re-booked an earlier meeting — still counts)':'Moved an already-counted meeting to a new time.',
  'Meeting confirmation only (re-confirmed, no new date)':'Just re-confirmed a meeting booked earlier.',
  'Already booked for this company (referral/hand-off — NOT a new booking)':'This company already had a meeting booked.'
};
function stageRow(name, v){
  if(!v) return '';
  const conf=v.confidence!=null?` · ${Math.round(v.confidence*100)}% conf`:'';
  const mean=STAGE_MEAN[name]?`<div class="stage-mean">${STAGE_MEAN[name]}</div>`:'';
  return `<div class="stage"><div><div class="nm">${name}</div>${mean}<div class="ev">${esc(v.evidence)}</div></div>
    <div style="text-align:right">${pill(v.value)}<div class="muted" style="font-size:11px;margin-top:3px">${conf}</div></div></div>`;
}
// The "Qualified" funnel row honours a BDM override (override wins over the AI verdict, matching
// the count). When overridden, it shows the effective YES/NO + a BDM-override note.
function qualStageRow(v, o){
  if(!v) return '';
  const aiQ=!!v.value, hasOv=!!(o && o.qualified != null), eff=hasOv?!!o.qualified:aiQ;
  const conf=v.confidence!=null?` · ${Math.round(v.confidence*100)}% conf`:'';
  const nm = 'Qualified' + (hasOv?` <span class="pill" style="background:rgba(59,130,246,.16);color:#93c5fd;font-size:11px">BDM override</span>`:'');
  const evTxt = hasOv
    ? `BDM override by ${esc(o.override_by)||'BDM'}: ${esc(o.reason||'')} — the AI originally said ${aiQ?'qualified':'not qualified'}.`
    : esc(v.evidence);
  return `<div class="stage"><div><div class="nm">${nm}</div><div class="stage-mean">Meets our bar to book — Authority + 2 of Budget / Problem / Urgency. A BDM can override.</div><div class="ev">${evTxt}</div></div>
    <div style="text-align:right">${pill(eff)}<div class="muted" style="font-size:11px;margin-top:3px">${conf}</div></div></div>`;
}

// BDM/admin qualification override (#4b). Shown on booked meetings; lets a BDM flip
// the AI's qualification with a mandatory reason — the funnel honours it.
function qualOverrideCard(d){
  const cl=d.classification||{}, ev=cl.evidence||{};
  const booked = ev.meeting_booked && ev.meeting_booked.value;
  const o=d.qual_override;
  // Always available to BDM/admin so they can review/override ANY call (the AI's booked verdict
  // can change); regular users still only see it on a booked meeting or an existing override.
  if(!booked && !o && !d.can_override) return '';
  const aiQ = ev.qualified && ev.qualified.value;
  const eff = o ? o.qualified : aiQ;
  const effPill = `<span class="pill ${eff?'yes':'no'}">${eff?'✓ Qualified':'Not qualified'}</span>`;
  const src = o ? `<span class="muted">BDM override by ${esc(o.override_by)||'?'} · ${esc(String(o.created_at||'').slice(0,16).replace('T',' '))}</span>` : `<span class="muted">AI verdict</span>`;
  const reason = o ? `<div style="margin-top:8px;font-size:13px"><b>Reason:</b> ${esc(o.reason)}</div>` : '';
  let controls='';
  if(d.can_override){
    // Booking-outcome override (#4c): the BDM sets what the call ACTUALLY is when the AI misreads
    // tentative/firm/reschedule/confirmation. The funnel honours it over the AI verdict.
    const OB=[['counts','✓ Counts as qualified booking','74,222,128'],
              ['rescheduled','🔁 Rescheduled','147,197,253'],
              ['confirmation','📞 Confirmation of earlier','251,191,36'],
              ['tentative','🕓 Tentative — don\'t count','139,148,158'],
              ['not_booking','✕ Not a booking','248,113,113']];
    const obBtns=OB.map(([v,lbl,rgb])=>{
      const qarg = v==='counts' ? 'true' : (v==='rescheduled'||v==='confirmation') ? String(!!aiQ) : 'false';
      const sel = (o&&o.booking_outcome===v) ? ';outline:2px solid rgba('+rgb+',.9);outline-offset:1px' : '';
      return `<button class="obbtn" onclick="setQualOverride(${qarg},'${v}')" style="background:rgba(${rgb},.16);color:rgb(${rgb});border:1px solid rgba(${rgb},.55)${sel}">${lbl}</button>`;
    }).join('');
    controls = `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:14px">
      <div class="subh">Set what this call really is <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">— overrides the AI &amp; updates the funnel</span></div>
      <textarea id="qoReason" placeholder="Reason (required)…" style="width:100%;background:#0b0f15;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:13px;min-height:54px">${o?esc(o.reason):''}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${obBtns}</div>
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)">
        <div class="subh" style="margin-bottom:10px">…or just flip the qualification flag <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">(leaves the booking as-is)</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button id="qoYes" class="actbtn pos">✓ Mark Qualified</button>
          <button id="qoNo" class="actbtn neg">✕ Mark Not Qualified</button>
          ${o?`<button id="qoClear" class="actbtn ghost">↺ Clear override (revert to AI)</button>`:''}
        </div>
      </div></div>`;
  }
  const OBL={counts:'✓ counts as qualified booking',rescheduled:'🔁 rescheduled',confirmation:'📞 confirmation',tentative:'🕓 tentative (not counted)',not_booking:'✕ not a booking'};
  const obPill = (o&&o.booking_outcome)?`<span class="pill" style="background:rgba(59,130,246,.16);color:#93c5fd">BDM: ${OBL[o.booking_outcome]||o.booking_outcome}</span>`:'';
  const notBooked = !booked ? `<span class="muted" style="font-size:12px;font-weight:400"> · AI: not a booked meeting</span>` : '';
  return `<div class="card full"><h2>Qualification review <span class="muted">(BDM)</span> ${effPill}${obPill}${notBooked}</h2>
    <div class="hint">The <b>BDM's decision overrides the AI</b> and is what counts in the funnel. The pill above is the current effective status; the line below is the AI's original read.</div>
    <div>${src}${o?` · AI said ${aiQ?'qualified':'not qualified'}`:''}</div>${reason}${controls}</div>`;
}
async function setQualOverride(qualified, booking_outcome){
  const reason=(document.getElementById('qoReason')||{}).value||'';
  if(!reason.trim()){ alert('A reason is required.'); return; }
  const body={reason, booking_outcome: booking_outcome||''};
  if(qualified!==null && qualified!==undefined) body.qualified=qualified;
  const r=await fetch(`/api/call/${encodeURIComponent(id)}/qualify-override`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){ load(); } else { const j=await r.json().catch(()=>({})); alert(j.error||('Error '+r.status)); }
}
async function clearQualOverride(){
  const r=await fetch(`/api/call/${encodeURIComponent(id)}/qualify-override/clear`,{method:'POST'});
  if(r.ok) load();
}

// Merge master-DB metrics (always present for a matched prospect) with live
// SEMrush/Apollo enrichment (enrichment wins; master fills gaps). Same logic as
// the consolidated prospect page so call & prospect pages are consistent.
function bizCard(d){
  const cl=d.classification||{}, ev=cl.evidence||{}, e=d.enrichment||{}, m=d.master||{};
  const ap=(e&&e.apollo)||{}, sm=(e&&e.semrush)||{};
  const site=d.domain||cl.prospect_website||ev.prospect_website||'';
  const company=ap.name||ev.prospect_company||m.business_name||'';
  const industry=ap.industry||ev.prospect_industry||'';
  const hasMaster=!!m.domain;
  if(!(site||company||ap.found||sm.found||hasMaster))
    return `<div class="card full"><h2>Business &amp; marketing intelligence</h2>
      <div class="muted">This number isn't in the master prospect database and the prospect didn't state a website, so no marketing data could be looked up. Any user can add the business via the prospect page.</div></div>`;
  const kv=rows=>rows.filter(r=>r[1]!=null&&r[1]!=='').map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join('')||'<div class="muted">—</div>';
  const pick=(en,ma)=>{ if(en!=null&&en!=='') return en; if(ma!=null&&ma!=='') return ma; return null; };
  const otraf=pick(sm.organic_traffic,m.organic_traffic), okw=pick(sm.organic_keywords,m.organic_keywords);
  const ocost=pick(sm.organic_cost,m.organic_cost), adkw=pick(sm.paid_keywords,m.adwords_keywords);
  const rev=ap.annual_revenue_printed||(ap.annual_revenue?'$'+fmtN(ap.annual_revenue):null);
  // Fallback revenue band when Apollo has none: SEMrush traffic value × 12 is a rough floor.
  const revEst = (!rev && sm.organic_cost) ? '≈ $'+fmtN(sm.organic_cost*12)+' /yr (est. from SEO value)' : null;
  const loc=[ap.city,ap.state,ap.country].filter(Boolean).join(', ')||m.location||'';
  const link=(u,t)=>u?`<a class="lnk" href="${esc(u)}" target="_blank">${t}</a>`:null;
  const bizRows=[['Company',esc(company)],['Industry',esc(industry)],
    ['Est. revenue', rev?esc(rev):(revEst?`<span class="muted">${esc(revEst)}</span>`:null)],
    ['Employees',ap.employees!=null?fmtN(ap.employees):null],['Founded',ap.founded_year],['Location',esc(loc)],
    ['Phone',esc(ap.phone)],['Website',site?link('https://'+site,esc(site)):null],['LinkedIn',link(ap.linkedin_url,'profile')]];
  const ads = adkw!=null ? (adkw>0?`Yes (${fmtN(adkw)} kw)`:'No') : null;
  const seoRows=[['Authority score',sm.authority_score!=null?sm.authority_score+' / 100':null],
    ['Organic traffic',otraf!=null?fmtN(otraf)+' /mo':null],
    ['Organic keywords',okw!=null?fmtN(okw):null],
    ['Est. traffic value',ocost!=null?'$'+fmtN(ocost)+' /mo':null],
    ['Backlinks',sm.backlinks!=null?fmtN(sm.backlinks):null],
    ['Referring domains',sm.referring_domains!=null?fmtN(sm.referring_domains):null],
    ['Running Google Ads',ads]];
  const tech=(ap.technologies||[]).slice(0,12);
  const descr=ap.description?`<div class="muted" style="margin-top:10px;font-size:12.5px">${esc(ap.description)}</div>`:'';
  const techHtml=tech.length?`<div class="subh" style="margin-top:10px">Tech stack</div><div class="chips">${tech.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'';
  const srcNote = e&&e.fetched_at ? `<div class="muted" style="font-size:11.5px;margin-top:8px">Live enrichment ${esc(String(e.fetched_at).slice(0,10))}. SEO base from master DB.</div>`
    : (hasMaster?`<div class="muted" style="font-size:11.5px;margin-top:8px">Showing master-DB metrics. Live SEMrush/Apollo not yet run for this domain.</div>`:'');
  const prospectLink = d.call&&d.call.dest_number?`<a class="lnk" style="margin-left:auto;font-size:12px" href="/prospect/${encodeURIComponent(d.call.dest_number)}" target="_blank">Full prospect page ↗</a>`:'';
  // Free website tracking-pixel detection (digital marketing / paid-ads evidence).
  const w=(e&&e.website)||null;
  let trackHtml='';
  if(w&&w.found){
    const trk=Object.values(w.trackers||{}), ads=w.paid_ad_platforms||[];
    const badge=w.runs_paid_ads?'<span class="pill yes">✓ Running paid ads</span>':'<span class="pill" style="background:rgba(139,148,158,.14);color:#9aa4af">No ad pixels found</span>';
    const chips=trk.length?trk.map(x=>`<span class="chip">${ads.includes(x)?'🎯 ':'📊 '}${esc(x)}</span>`).join(''):'<span class="muted">No tags found.</span>';
    trackHtml=`<div style="margin-top:14px"><div class="subh">🌐 Website tracking (free scan) ${badge}</div>
      <div class="chips">${chips}</div>
      ${w.uses_utm?'<div class="muted" style="font-size:12px;margin-top:6px">Uses UTM campaign tracking.</div>':''}</div>`;
  }
  return `<div class="card full"><h2>Business &amp; marketing intelligence ${prospectLink}</h2>
    <div class="bizgrid">
      <div><div class="subh">🏢 Company</div><div class="kv">${kv(bizRows)}</div>${descr}${techHtml}</div>
      <div><div class="subh">📈 Website / SEO &amp; ads</div><div class="kv">${kv(seoRows)}</div></div>
    </div>${trackHtml}${srcNote}</div>`;
}

// Per-call feedback intelligence — synthesises THIS call's AI analysis into what went well,
// what to improve, and the next action (the call-level twin of the coaching page's panel).
// Prospect-specific "next-call game plan": prefers the AI's next_call_points, else synthesizes
// from existing evidence so calls that predate the field are never blank (no reclassify needed).
function nextCallPoints(ev, cl){
  const KIND={hook:['🪝','#93c5fd'],question:['❓','#c4b5fd'],objection:['🛡️','#fca5a5'],value:['💡','#fcd34d'],logistics:['📋','#86efac']};
  let pts = Array.isArray(ev.next_call_points) ? ev.next_call_points.filter(p=>p&&p.point) : [];
  if(!pts.length){
    const syn=[];
    (ev.objections||[]).filter(o=>o&&o.handled===false&&o.objection).slice(0,2).forEach(o=>syn.push({point:'Pre-empt their objection: "'+o.objection+'"',kind:'objection'}));
    if(ev.problem_summary) syn.push({point:'Re-open on their problem: '+ev.problem_summary,kind:'hook'});
    (ev.buying_signals||[]).slice(0,1).forEach(s=>syn.push({point:'Build on their interest: '+s,kind:'value'}));
    if(ev.next_step) syn.push({point:ev.next_step,kind:'logistics'});
    else if(cl&&cl.callback_when) syn.push({point:'Call back '+cl.callback_when,kind:'logistics'});
    pts=syn;
  }
  if(!pts.length) return '';
  return '<ul style="list-style:none;padding-left:0;margin:0">'+pts.slice(0,5).map(p=>{const k=KIND[p.kind]||KIND.hook;return '<li style="margin:7px 0;padding-left:26px;position:relative"><span style="position:absolute;left:0">'+k[0]+'</span><span style="color:'+k[1]+'">'+esc(p.point)+'</span>'+(p.why?'<span class="muted" style="font-size:12px"> — '+esc(p.why)+'</span>':'')+'</li>';}).join('')+'</ul>';
}
function feedbackCard(ev, cl){
  const sc=ev.scorecard||{};
  const DIMS=[['opening','Opening'],['discovery','Discovery'],['pitch','Pitch'],['objection_handling','Objection handling'],['close','Close']];
  const scored=DIMS.filter(([k])=>sc[k]!=null).map(([k,l])=>({l,v:Number(sc[k])}));
  const tips=ev.coaching_tips||[];
  const objs=ev.objections||[];
  const unhandled=objs.filter(o=>!o.handled);
  if(!scored.some(s=>s.v>0) && !tips.length && !objs.length) return '';   // no coaching signal on this call
  const strong=scored.filter(s=>s.v>=3.5).sort((a,b)=>b.v-a.v);
  const weak=scored.filter(s=>s.v>0&&s.v<2.5).sort((a,b)=>a.v-b.v);
  const wins=[
    ...strong.map(s=>`${s.l} was strong (${s.v.toFixed(1)}/5)`),
    ...(ev.buying_signals||[]).slice(0,2).map(s=>`Buying signal: ${s}`),
    ...objs.filter(o=>o.handled).slice(0,1).map(o=>`Handled the "${o.objection}" objection`),
  ];
  const improves=[
    ...weak.map(s=>`${s.l} needs work (${s.v.toFixed(1)}/5)`),
    ...unhandled.slice(0,2).map(o=>`Unhandled objection: "${o.objection}"`),
    ...tips.slice(0,3),
  ];
  const booked=ev.meeting_booked&&ev.meeting_booked.value;
  const next = ev.next_step || (cl.callback_when?('Call back '+cl.callback_when):'')
    || (booked?'Send the calendar invite + overview/testimonials pack and confirm the time.'
             :'Follow up to secure a firm strategy-session date/time.');
  const li=(arr,icon,color)=>arr.length?`<ul class="ci" style="list-style:none;padding-left:0;margin:0">${arr.map(x=>`<li style="margin:6px 0;padding-left:24px;position:relative"><span style="position:absolute;left:0">${icon}</span><span style="color:${color}">${esc(x)}</span></li>`).join('')}</ul>`:'<div class="muted">—</div>';
  return `<div class="card full" style="border-color:var(--accent2);background:linear-gradient(180deg,#141d31,var(--panel))">
    <h2 style="color:#93c5fd">🧠 Feedback intelligence <span class="muted" style="color:#7ea6e6">— this call</span></h2>
    <div class="bizgrid">
      <div><div class="subh">✅ What went well</div>${li(wins,'✅','#86efac')}</div>
      <div><div class="subh">⚠️ What to improve</div>${li(improves,'⚠️','#fcd34d')}</div>
    </div>
    <div class="subh" style="margin-top:12px">🎯 Next-call game plan</div>
    <div style="background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:10px 14px;color:#bfdbfe">${nextCallPoints(ev,cl)||esc(next)}</div>
  </div>`;
}

async function load(){
  let d;
  try{ const r=await fetch('/api/call/'+encodeURIComponent(id)); if(!r.ok)throw new Error(r.status); d=await r.json(); }
  catch(e){ document.getElementById('main').innerHTML='<div class="card full">Could not load call '+esc(id)+' ('+e.message+')</div>'; return; }
  const c=d.call||{}, t=d.transcript||{}, cl=d.classification||{}, ev=cl.evidence||{};
  document.getElementById('title').textContent = (c.bde_name||'?')+'  →  '+(c.dest_number||'');
  document.getElementById('subtitle').innerHTML = esc(c.started_at||'')+'  ·  '+esc(c.fresh_or_followup||'')
    + (c.dest_number?`  ·  <a class="lnk" href="/prospect/${encodeURIComponent(c.dest_number)}">View prospect (all calls) ↗</a>`:'');

  const meta=`<div class="card"><h2>Call <span class="muted">details</span></h2><div class="kv">
    <div>BDE</div><div>${esc(c.bde_name)} (ext ${esc(c.bde_extension)})</div>
    <div>Number</div><div>${esc(c.dest_number)}</div>
    <div>Started</div><div>${esc(c.started_at)}</div>
    <div>Fresh/Followup</div><div>${esc(c.fresh_or_followup)}</div>
    <div>Answered</div><div>${c.answered?'Yes':'No'}</div>
    <div>Talk time</div><div>${esc(c.talk_seconds)} s</div>
    <div>Who answered</div><div>${esc(ev.who_answered)||'—'}</div>
    <div>Outcome</div><div>${esc(cl.call_outcome)||'—'}</div>
    <div>Sentiment</div><div>${esc(t.sentiment)||'—'}</div>
    <div>Model</div><div>${esc(cl.model)||'—'}</div>
    <div>Needs review</div><div>${cl.needs_human_review?'Yes':'No'}</div>
  </div></div>`;

  const verdicts=`<div class="card"><h2>Funnel verdicts <span class="muted">(AI)</span></h2>
    <div class="hint">Each row is one funnel stage as read by the AI — <b>YES</b> means it was met on this call. The banner below shows what actually counts.</div>
    ${d.sms_confirmed?`<div style="background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.45);color:#86efac;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-weight:700">📱 Booking confirmed by the prospect via SMS — this firmed the meeting (see the SMS / chat tab).</div>`:''}
    ${bookingBanner(ev, d.booking_counts, cl.meeting_datetime, d.qual_override, d.prospect_qualified, d.qualified_via)}
    ${stageRow('Right Party Contact (decision-maker)', ev.rpc_connect)}
    ${stageRow('Full Pitch', ev.full_pitch)}
    ${stageRow('Lead (interest)', ev.is_lead)}
    ${qualStageRow(ev.qualified, d.qual_override)}
    ${stageRow('Meeting Booked', ev.meeting_booked)}
    ${ev.meeting_rescheduled?stageRow('Rescheduled booking (re-booked an earlier meeting — still counts)', ev.meeting_rescheduled):''}
    ${ev.meeting_confirmation_only?stageRow('Meeting confirmation only (re-confirmed, no new date)', ev.meeting_confirmation_only):''}
    ${ev.booking_already_exists && ev.booking_already_exists.value?stageRow('Already booked for this company (referral/hand-off — NOT a new booking)', ev.booking_already_exists):''}
  </div>`;

  // The valuable two-way breakdown, side by side.
  const prospect = `<div class="card"><h2>🗣️ What the prospect said</h2><div class="analysis">${esc(ev.prospect_summary)||'<span class="muted">—</span>'}</div></div>`;
  const bde = `<div class="card"><h2>🎧 What our BDE said / did</h2><div class="analysis">${esc(ev.bde_summary)||'<span class="muted">—</span>'}</div></div>`;
  const reasoning = ev.analysis ? `<div class="card full"><h2>AI reasoning (why these verdicts)</h2><div class="analysis">${esc(ev.analysis)}</div></div>`:'';
  const summary = t.summary ? `<div class="card full"><h2>3CX call summary</h2><div>${esc(t.summary)}</div></div>`:'';
  const notes = ev.overall_notes ? `<div class="card full"><h2>Notes</h2><div>${esc(ev.overall_notes)}</div></div>`:'';
  let txBody;
  if (t && (t.text||'').trim()) txBody = esc(t.text);
  else if (c.recording_present) txBody = '<span class="muted">⚠ No transcript available. The call was recorded, but 3CX has not returned a transcript (it is either still processing — connected calls are re-checked on the nightly sweep — or this recording was not transcribed by 3CX).</span>';
  else txBody = '<span class="muted">⚠ No transcript — this call was not recorded.</span>';
  const transcript=`<div class="card full"><h2>Transcript (proof)</h2><div class="transcript">${txBody}</div></div>`;

  const msgs=(d.messages||[]);
  const messagesPane = msgs.length ? `<div class="card full"><h2>💬 SMS / chat from prospect (${msgs.length})</h2>${
    msgs.map(m=>{
      const badge = m.is_booking_confirmation ? `<span class="pill yes">📅 booking confirmation</span>`
        : (m.intent && !['reply','other'].includes(m.intent) ? `<span class="pill" style="background:rgba(148,163,184,.2);color:#cbd5e1">${esc(m.intent)}</span>` : '');
      const firmed = m.applied_call_id===c.call_id ? ` · <span style="color:#4ade80;font-weight:700">firmed THIS booking</span>` : (m.applied_call_id?` · <span class="muted">firmed another call</span>`:'');
      const when = esc(String(m.time_sent||'').slice(0,16).replace('T',' '));
      const mt = m.meeting_datetime ? `<div class="muted" style="font-size:12px;margin-top:3px">🗓 ${esc(m.meeting_datetime)}</div>` : '';
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="muted" style="font-size:12px">${when} · ${esc(m.sender_name||m.sender_phone||'')} ${badge}${firmed}</div><div style="margin-top:3px">${esc(m.body||'')}</div>${mt}</div>`;
    }).join('')}</div>`
    : `<div class="card full"><h2>💬 SMS / chat from prospect</h2><div class="muted">No inbound SMS/chat captured from this prospect's number.</div></div>`;

  const tabs=[
    ['summary','Summary', recordingCard(c, d.can_override) + leadCard(cl,ev,d.qual_override) + qualOverrideCard(d) + feedbackCard(ev,cl) + rpcNextMoveCard(d) + meta + verdicts + extractedCard(cl,ev)],
    ['convo','Conversation', prospect + bde + ciCard(ev) + reasoning + (summary||'') + (notes||'')],
    ['biz','Business &amp; marketing', bizCard(d)],
    ['messages','SMS / chat'+(msgs.length?' ('+msgs.length+')':''), messagesPane],
    ['transcript','Transcript', transcript],
  ];
  document.getElementById('main').innerHTML =
    `<div class="tabs">${tabs.map((t,i)=>`<button class="tab${i===0?' active':''}" data-pane="${t[0]}">${t[1]}</button>`).join('')}</div>`
    + tabs.map((t,i)=>`<div class="tabpane${i===0?' active':''}" id="pane-${t[0]}">${t[2]}</div>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); document.getElementById('pane-'+b.dataset.pane).classList.add('active');
  });
  const qy=document.getElementById('qoYes'); if(qy) qy.onclick=()=>setQualOverride(true);
  const qn=document.getElementById('qoNo'); if(qn) qn.onclick=()=>setQualOverride(false);
  const qc=document.getElementById('qoClear'); if(qc) qc.onclick=clearQualOverride;
}
load();
</script>
<script>(function(){
  var el=document.documentElement;
  function cur(){return el.getAttribute("data-theme")==="light"?"light":"dark";}
  var b=document.createElement("button");b.className="tr-theme-btn";
  b.title="Toggle light / dark theme";b.setAttribute("aria-label","Toggle theme");
  function paint(){b.textContent=cur()==="light"?"\u{1F319}":"\u2600\uFE0F";}
  b.onclick=function(){var n=cur()==="light"?"dark":"light";el.setAttribute("data-theme",n);
    try{localStorage.setItem("tr-theme",n);}catch(e){}paint();};
  paint();(document.body||el).appendChild(b);
})();</script>
