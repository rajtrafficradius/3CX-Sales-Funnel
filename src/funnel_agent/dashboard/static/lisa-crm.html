<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("tr-theme-v2");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booked CRM · 3CX Funnel</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>">
<style>
  :root{
    --bg:#0a0d13; --panel:#10151e; --panel2:#161c27; --panel3:#1b2230;
    --line:#222b39; --line-soft:#1a212c; --line2:#2c3645;
    --txt:#e8edf5; --txt-dim:#b8c2d0; --muted:#8b96a6; --faint:#697384;
    --accent:#5b8cff; --accent2:#3b82f6; --accent-soft:rgba(91,140,255,.14); --ring:0 0 0 3px rgba(91,140,255,.30);
    --good:#4ade80; --good-soft:rgba(74,222,128,.13); --warn:#fbbf24; --bad:#f87171; --chip:#1a2433;
    --r1:8px; --r2:10px; --r3:12px;
    --elev1:0 1px 2px rgba(0,0,0,.40);
    --mat-elev:inset 0 1px 0 rgba(255,255,255,.035),0 1px 2px rgba(0,0,0,.34),0 6px 16px -12px rgba(0,0,0,.60);
    --t-eyebrow:10.5px; --t-cap:12px; --t-body:13px; --t-base:14px; --t-strong:16px;
  }
  :root[data-theme=light]{
    --bg:#f7f9fc; --panel:#ffffff; --panel2:#f3f6fb; --panel3:#eaf0f7;
    --line:#e2e8f1; --line-soft:#eef2f8; --line2:#d3dbe6; --chip:#f0f4fa;
    --txt:#17202e; --txt-dim:#3a4658; --muted:#616d80; --faint:#93a0b2;
    --good:#15a34a; --good-soft:rgba(21,163,74,.10); --warn:#c07806; --bad:#dc2626;
    --elev1:0 1px 2px rgba(20,30,50,.10);
    --mat-elev:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(20,30,50,.06),0 6px 16px -12px rgba(20,30,50,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:var(--t-base)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums slashed-zero}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent-soft)}
  *{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid transparent;background-clip:padding-box;border-radius:8px}
  *::-webkit-scrollbar-track{background:transparent}
  input,select,button{font:inherit}
  /* ---- top bar ---- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;background:linear-gradient(180deg,var(--panel),var(--bg));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;line-height:0}
  .brand img{height:26px;display:block;filter:brightness(0) invert(1);opacity:.92}
  :root[data-theme=light] .brand img{filter:none;opacity:1}
  .htext .over{font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:800}
  header h1{font-size:var(--t-strong);margin:0;font-weight:800;letter-spacing:.2px}
  .spacer{flex:1}
  .who{font-size:var(--t-cap);color:var(--muted)}
  .backlink{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);font-weight:700;font-size:var(--t-cap);white-space:nowrap;transition:border-color .14s,color .14s}
  .backlink:hover{border-color:var(--line2);color:var(--txt)}
  .backlink:focus-visible{outline:none;box-shadow:var(--ring)}
  /* ---- shell ---- */
  .wrap{max-width:1680px;margin:0 auto;padding:18px 22px 28px}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .search{position:relative;flex:1 1 240px;max-width:340px;min-width:180px}
  .search input{width:100%;padding:9px 12px 9px 34px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);color:var(--txt)}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .stagechips{margin-bottom:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);font-weight:700;font-size:var(--t-cap);cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
  .chip:hover{border-color:var(--line2)}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip:focus-visible{outline:none;box-shadow:var(--ring)}
  .chip .n{opacity:.7;font-weight:600;font-size:11px}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .upd{font-size:11px;color:var(--faint);white-space:nowrap;min-width:76px;text-align:right}
  .count{font-size:var(--t-cap);color:var(--muted);font-weight:700;white-space:nowrap}
  .count b{color:var(--txt);font-weight:800}
  /* ---- pills / bits ---- */
  .lpill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
  .udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.18);flex:none;vertical-align:middle}
  .dim{color:var(--faint)}
  .mono{font-variant-numeric:tabular-nums}
  /* ---- table ---- */
  .tblcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--mat-elev);overflow:hidden}
  .tblscroll{overflow-x:auto}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--t-body)}
  .tbl thead th{position:sticky;top:0;z-index:2;text-align:left;color:var(--faint);font-size:var(--t-eyebrow);text-transform:uppercase;letter-spacing:.6px;font-weight:800;padding:11px 12px;background:var(--panel3);border-bottom:1px solid var(--line2);white-space:nowrap}
  .tbl thead th.sortable{cursor:pointer;user-select:none}
  .tbl thead th.sortable:hover{color:var(--txt-dim)}
  .tbl thead th.sorted{color:var(--accent)}
  .tbl thead th.num{text-align:right}
  .tbl thead th .arr{margin-left:3px;font-size:10px}
  .tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;color:var(--txt-dim)}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr.trow{cursor:pointer;transition:background .1s}
  .tbl tbody tr.trow:hover{background:var(--panel2)}
  .tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
  .tco{font-weight:700;color:var(--txt)}
  .tdom{font-size:10.5px;color:var(--faint);margin-top:2px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .tcontact{color:var(--txt-dim)}
  .tphone{display:inline-block;font-size:11.5px;margin-top:2px;color:var(--accent)}
  .tphone:hover{text-decoration:underline}
  .tnext{max-width:220px;overflow:hidden;text-overflow:ellipsis;display:block}
  .tnext .when{color:var(--faint);font-size:11px}
  .tbl-stage{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:11px;cursor:pointer;max-width:132px}
  .tbl-stage:focus-visible{outline:none;box-shadow:var(--ring)}
  .asset{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--good);color:var(--good);background:var(--good-soft);white-space:nowrap}
  .asset:hover{filter:brightness(1.08)}
  .openlink{font-weight:700;font-size:12px;white-space:nowrap}
  .openlink:focus-visible{outline:none;box-shadow:var(--ring);border-radius:4px}
  /* ---- states ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--mat-elev)}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .retry{margin-top:2px;background:var(--panel2);color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}
  .retry:hover{border-color:var(--accent)}
  .skel{display:flex;flex-direction:column;gap:9px;padding:12px}
  .skrow{height:52px;border-radius:var(--r2);background:linear-gradient(100deg,var(--panel2) 30%,var(--panel3) 50%,var(--panel2) 70%);background-size:220% 100%;animation:sh 1.4s ease-in-out infinite}
  @keyframes sh{0%{background-position:140% 0}100%{background-position:-40% 0}}
  @media (prefers-reduced-motion:reduce){.skrow{animation:none}.chip,.tbl tbody tr.trow{transition:none}}
  @media(max-width:640px){.wrap{padding:14px 14px 24px}.search{max-width:none}}
  /* ---- theme button ---- */
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;z-index:90;width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:17px;cursor:pointer;box-shadow:var(--elev1);display:flex;align-items:center;justify-content:center}
  .tr-theme-btn:hover{border-color:var(--accent)}
  /* ---- persistent icon rail ---- */
  :root{--rail-w:58px;--rail-open:238px}
  body{padding-left:var(--rail-w)}
  .tr-rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail-w);z-index:60;box-sizing:border-box;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 0;overflow:hidden;transition:width .19s cubic-bezier(.4,0,.2,1),box-shadow .19s}
  .tr-rail:hover,.tr-rail:focus-within{width:var(--rail-open);box-shadow:22px 0 48px -30px rgba(8,12,20,.6)}
  :root[data-theme=light] .tr-rail{box-shadow:none}
  :root[data-theme=light] .tr-rail:hover,:root[data-theme=light] .tr-rail:focus-within{box-shadow:22px 0 48px -30px rgba(20,30,50,.35)}
  .tr-rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
  .tr-rail-nav::-webkit-scrollbar{width:0}
  .tr-rail-foot{flex:none;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .tr-rail-item,.tr-rail-user{display:flex;align-items:center;height:42px;margin:0 8px;border-radius:10px;color:var(--txt-dim);text-decoration:none;font-weight:600;font-size:13.5px;overflow:hidden;white-space:nowrap;transition:background .12s,color .12s}
  .tr-rail-item:hover{background:var(--panel2);color:var(--txt)}
  .tr-rail-item.active{background:var(--accent-soft);color:var(--accent)}
  .tr-rail-item .ic,.tr-rail-user .ic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail svg{width:20px;height:20px;flex:none}
  .tr-rail .lbl{opacity:0;transition:opacity .16s;letter-spacing:-.1px}
  .tr-rail:hover .lbl,.tr-rail:focus-within .lbl{opacity:1}
  .tr-rail-user .av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .tr-rail-user .lbl{font-weight:600;font-size:12.5px;color:var(--txt-dim);overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .tr-rail-brand{position:relative;display:block;height:46px;margin:2px 8px 8px;color:var(--txt-dim)}
  .tr-rail-brand .barsic{position:absolute;left:0;top:0;width:42px;height:46px;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .15s}
  .tr-rail-brand .barsic svg{width:23px;height:23px}
  .tr-rail-brand .fulllogo{position:absolute;left:12px;top:50%;transform:translateY(-50%);height:24px;opacity:0;transition:opacity .18s;pointer-events:none;max-width:none;filter:brightness(0) invert(1)}
  :root[data-theme=light] .tr-rail-brand .fulllogo{filter:none}
  .tr-rail:hover .tr-rail-brand .barsic,.tr-rail:focus-within .tr-rail-brand .barsic{opacity:0}
  .tr-rail:hover .tr-rail-brand .fulllogo,.tr-rail:focus-within .tr-rail-brand .fulllogo{opacity:1}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logo.png" alt="Traffic Radius" /></a>
  <div class="htext"><div class="over">Lisa · Meetings pipeline</div><h1>Booked CRM</h1></div>
  <span class="spacer"></span>
  <a class="backlink" href="/">&larr; Dashboard</a>
  <span class="who" id="who"></span>
</header>

<div class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" placeholder="Search company, contact, phone…" aria-label="Search bookings" autocomplete="off" />
    </label>
    <div class="chips" id="lineChips" role="group" aria-label="Filter by line"></div>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
    <span class="upd" id="upd"></span>
  </div>
  <div class="chips stagechips" id="stageChips" role="group" aria-label="Filter by stage"></div>
  <div id="content"><div class="card"><div class="skel"><div class="skrow"></div><div class="skrow"></div><div class="skrow"></div><div class="skrow"></div></div></div></div>
</div>

<script>
const STAGES=[
  {id:'new',label:'New',c:'#8b96a6'},
  {id:'confirming',label:'Confirming',c:'#fbbf24'},
  {id:'confirmed',label:'Confirmed',c:'#5b8cff'},
  {id:'revealed',label:'Revealed',c:'#a78bfa'},
  {id:'won',label:'Won',c:'#4ade80'},
  {id:'lost',label:'Lost',c:'#f87171'},
  {id:'no_show',label:'No-show',c:'#fb923c'}
];
const LINE={lisa4:{label:'Website',c:'#5b8cff'},lisa5:{label:'Growth',c:'#4ade80'},lisa1:{label:'Marketing',c:'#a78bfa'}};
const TZ='Australia/Melbourne';
let DATA=[], loaded=false, lastAt=0;
let lineF='all', stageF='all', searchText='';
let sortKey='booked', sortDir=-1;

const $=s=>document.querySelector(s);
const content=$('#content'), q=$('#q'), who=$('#who'), upd=$('#upd'), countEl=$('#count');
const lineChips=$('#lineChips'), stageChips=$('#stageChips');

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function phone(d9){return d9?('0'+String(d9)):'';}
async function api(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}

function toDate(s){if(!s)return null;let str=String(s);if(!/[zZ]|[+-]\d\d:?\d\d$/.test(str))str+='Z';const d=new Date(str.replace(' ','T'));return isNaN(d)?null:d;}
function tval(s){const d=toDate(s);return d?d.getTime():0;}
function ymdNum(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);return Date.UTC(+o.year,+o.month-1,+o.day);}
function frel(s){const d=toDate(s);if(!d)return '';
  const diff=Math.round((ymdNum(d)-ymdNum(new Date()))/86400000);
  const time=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d);
  let day;
  if(diff===0)day='Today';else if(diff===1)day='Tomorrow';else if(diff===-1)day='Yesterday';
  else day=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,day:'numeric',month:'short'}).format(d);
  return day+' '+time;
}
function fdate(s){const d=toDate(s);if(!d)return '';return new Intl.DateTimeFormat('en-AU',{timeZone:TZ,day:'numeric',month:'short'}).format(d);}

function stageOptions(cur){return STAGES.map(s=>`<option value="${s.id}"${s.id===cur?' selected':''}>${s.label}</option>`).join('');}
function go(d9){location.href='/lisa-crm/'+encodeURIComponent(d9);}

function searchOnly(){
  const term=(searchText||'').toLowerCase().trim();
  if(!term)return DATA;
  return DATA.filter(r=>((r.company||'')+' '+(r.contact_name||'')+' '+phone(r.dest9)+' '+(r.dest9||'')+' '+(r.domain||'')).toLowerCase().indexOf(term)>=0);
}
function baseFiltered(){return searchOnly().filter(r=>lineF==='all'||r.agent===lineF);}

function renderChips(){
  const so=searchOnly();
  const lc={all:so.length,lisa4:0,lisa5:0,lisa1:0};
  so.forEach(r=>{lc[r.agent]=(lc[r.agent]||0)+1;});
  const lineDefs=[['all','All lines',null],['lisa4','Lisa 4 · Website','#5b8cff'],['lisa5','Lisa 5 · Growth','#4ade80']];
  if(lc.lisa1>0)lineDefs.push(['lisa1','Lisa 1 · Marketing','#a78bfa']);
  lineChips.innerHTML=lineDefs.map(d=>`<button class="chip${lineF===d[0]?' active':''}" data-v="${d[0]}" type="button">${d[2]?`<span class="dot" style="background:${d[2]}"></span>`:''}${d[1]}<span class="n">${lc[d[0]]||0}</span></button>`).join('');
  const bf=baseFiltered();
  const sc={};STAGES.forEach(s=>sc[s.id]=0);bf.forEach(r=>{sc[r.stage]=(sc[r.stage]||0)+1;});
  const all=`<button class="chip${stageF==='all'?' active':''}" data-v="all" type="button">All<span class="n">${bf.length}</span></button>`;
  stageChips.innerHTML=all+STAGES.map(s=>`<button class="chip${stageF===s.id?' active':''}" data-v="${s.id}" type="button"><span class="dot" style="background:${s.c}"></span>${s.label}<span class="n">${sc[s.id]||0}</span></button>`).join('');
}

const COLS=[
  {k:'company',t:'Company',g:r=>(r.company||'').toLowerCase()},
  {k:'contact',t:'Contact',g:r=>(r.contact_name||'').toLowerCase()},
  {k:'line',t:'Line',g:r=>r.agent||''},
  {k:'stage',t:'Stage',g:r=>STAGES.findIndex(s=>s.id===r.stage)},
  {k:'reveal',t:'Reveal',g:r=>tval(r.meeting_at)},
  {k:'next',t:'Next action',g:r=>(r.next_action||'').toLowerCase()},
  {k:'att',t:'Att',g:r=>r.bde_attempts||0,num:true},
  {k:'last',t:'Last contact',g:r=>tval(r.last_contacted)},
  {k:'asset',t:'Reveal asset',g:r=>r.share_token?1:0},
  {k:'booked',t:'Booked',g:r=>tval(r.booked_at)}
];

function assetCell(r){
  if(!r.share_token)return '<span class="dim">—</span>';
  const label=r.agent==='lisa5'?'Audit':'Site';
  return `<a class="asset" href="/api/lisa4/site/public/${esc(r.share_token)}" target="_blank" rel="noopener" title="Open the built reveal ${label.toLowerCase()}">${label} ✓</a>`;
}

function renderTable(){
  let rows=baseFiltered();
  if(stageF!=='all')rows=rows.filter(r=>r.stage===stageF);
  const total=rows.length;
  const col=COLS.find(c=>c.k===sortKey)||COLS[COLS.length-1];
  rows=rows.slice().sort((a,b)=>{const x=col.g(a),y=col.g(b);return (x<y?-1:x>y?1:0)*sortDir;});
  countEl.textContent='';
  if(!rows.length){content.innerHTML='<div class="card"><div class="empty">No bookings match your filters.</div></div>';return;}
  countEl.innerHTML=`<b>${total}</b> booking${total===1?'':'s'}`;
  const head=COLS.map(c=>`<th class="sortable${c.num?' num':''}${c.k===sortKey?' sorted':''}" data-k="${c.k}">${c.t}${c.k===sortKey?`<span class="arr">${sortDir<0?'▾':'▴'}</span>`:''}</th>`).join('')+'<th></th>';
  const body=rows.map(r=>{
    const line=LINE[r.agent]||LINE.lisa1;
    const reveal=r.meeting_at?frel(r.meeting_at):(r.agreed_day_time?esc(r.agreed_day_time):'<span class="dim">—</span>');
    const next=r.next_action?`<span class="tnext">${esc(r.next_action)}${r.next_action_at?` <span class="when">· ${frel(r.next_action_at)}</span>`:''}</span>`:'<span class="dim">—</span>';
    const last=r.last_contacted?frel(r.last_contacted):'<span class="dim">—</span>';
    return `<tr class="trow" data-d9="${esc(r.dest9)}">
      <td><span class="tco">${esc(r.company||'(unknown)')}</span>${r.unread?' <span class="udot" title="Unread SMS reply"></span>':''}${r.domain?`<div class="tdom">${esc(r.domain)}</div>`:''}</td>
      <td><div class="tcontact">${r.contact_name?esc(r.contact_name):'<span class="dim">—</span>'}</div><a class="tphone mono" href="tel:${esc(phone(r.dest9))}">${esc(phone(r.dest9))}</a></td>
      <td><span class="lpill" style="color:${line.c};background:${line.c}22;border-color:${line.c}55">${line.label}</span></td>
      <td><select class="tbl-stage" data-d9="${esc(r.dest9)}" aria-label="Change stage for ${esc(r.company||'record')}">${stageOptions(r.stage)}</select></td>
      <td>${reveal}</td>
      <td>${next}</td>
      <td class="num">${r.bde_attempts||0}</td>
      <td>${last}</td>
      <td>${assetCell(r)}</td>
      <td>${r.booked_at?esc(fdate(r.booked_at)):'<span class="dim">—</span>'}</td>
      <td><a class="openlink" href="/lisa-crm/${esc(r.dest9)}">Open ↗</a></td>
    </tr>`;
  }).join('');
  content.innerHTML=`<div class="card tblcard"><div class="tblscroll"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function render(){renderChips();renderTable();}

async function setStage(d9,v){
  try{await post('/api/lisa/crm/update',{dest9:d9,fields:{stage:v}});await load();}
  catch(e){alert('Save failed: '+e.message);}
}
async function load(){
  try{const d=await api('/api/lisa/crm');DATA=d.rows||[];loaded=true;lastAt=Date.now();render();tickUpd();}
  catch(e){if(!loaded){content.innerHTML='<div class="card"><div class="empty">Could not load the CRM.<br><button class="retry" type="button" onclick="load()">Retry</button><div class="dim" style="margin-top:8px;font-size:12px">'+esc(e.message)+'</div></div></div>';}}
}
window.load=load;
function tickUpd(){if(!lastAt){upd.textContent='';return;}const s=Math.max(0,Math.round((Date.now()-lastAt)/1000));upd.textContent='Updated '+(s<2?'just now':s+'s ago');}

/* ---- events (delegated on stable containers) ---- */
content.addEventListener('click',e=>{
  const th=e.target.closest('th.sortable');
  if(th){const k=th.dataset.k;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=(k==='company'||k==='contact'||k==='owner'||k==='next'||k==='line')?1:-1;}renderTable();return;}
  if(e.target.closest('.tbl-stage')||e.target.closest('.openlink')||e.target.closest('.asset')||e.target.closest('a[href^="tel:"]'))return;
  const tr=e.target.closest('tr.trow');if(tr){go(tr.dataset.d9);return;}
});
content.addEventListener('change',e=>{const s=e.target.closest('.tbl-stage');if(s)setStage(s.dataset.d9,s.value);});
lineChips.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){lineF=c.dataset.v;render();}});
stageChips.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){const v=c.dataset.v;stageF=(v===stageF&&v!=='all')?'all':v;render();}});
q.addEventListener('input',()=>{searchText=q.value;render();});

setInterval(tickUpd,1000);
setInterval(()=>{if(document.hidden)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;load();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});

(async function(){try{const me=await api('/api/me');who.textContent=(me.name||me.email||'');}catch(e){}load();})();
</script>
