<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Engine Room · Traffic Radius</title>
<link rel="icon" href="/logo.png"/>
<style>
  /* ENGINE ROOM — deliberately dark-first control-room aesthetic; light theme still supported via tokens. */
  :root{--bg:#f0f2f7;--panel:#fff;--panel2:#f4f7fb;--line:#dde4ef;--line2:#e7ecf4;--txt:#0e1726;--txt-dim:#51617c;--faint:#8493ab;
    --accent:#3b49d6;--ok:#0f9d58;--ok-soft:#e7f6ee;--warn:#c9820a;--warn-soft:#fbf1dc;--down:#d9483b;--down-soft:#fbeceb;
    --idle:#8493ab;--idle-soft:#eef1f6;--unknown:#7a6ff0;--rail:#0e1424;--glow:rgba(59,73,214,.18);
    --sh:0 1px 2px rgba(14,23,38,.05),0 14px 34px -22px rgba(14,23,38,.30)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b13;--panel:#0e1524;--panel2:#131c2e;--line:#1f2a41;--line2:#1a2438;
    --txt:#e8eefb;--txt-dim:#9fb0c9;--faint:#5e6f8a;--accent:#8a83f5;--ok:#3ddc84;--ok-soft:#0d2a1a;--warn:#f0b03f;--warn-soft:#2a2110;
    --down:#ff6b5e;--down-soft:#2c1512;--idle:#66768f;--idle-soft:#141c2c;--unknown:#a29bff;--rail:#04070d;--glow:rgba(138,131,245,.15);
    --sh:0 1px 2px rgba(0,0,0,.4),0 18px 44px -26px rgba(0,0,0,.8)}}
  :root[data-theme="dark"]{--bg:#070b13;--panel:#0e1524;--panel2:#131c2e;--line:#1f2a41;--line2:#1a2438;--txt:#e8eefb;--txt-dim:#9fb0c9;
    --faint:#5e6f8a;--accent:#8a83f5;--ok:#3ddc84;--ok-soft:#0d2a1a;--warn:#f0b03f;--warn-soft:#2a2110;--down:#ff6b5e;--down-soft:#2c1512;
    --idle:#66768f;--idle-soft:#141c2c;--unknown:#a29bff;--rail:#04070d;--glow:rgba(138,131,245,.15);
    --sh:0 1px 2px rgba(0,0,0,.4),0 18px 44px -26px rgba(0,0,0,.8)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;-webkit-font-smoothing:antialiased}
  .tr-rail{position:fixed;top:0;left:0;bottom:0;width:66px;background:var(--rail);display:flex;flex-direction:column;padding:12px 0;z-index:40;overflow:hidden;transition:width .16s}
  .tr-rail:hover{width:230px}
  .tr-rail-brand{display:flex;align-items:center;height:44px;margin:0 8px 10px;text-decoration:none;overflow:hidden;white-space:nowrap}
  .tr-rail-brand .barsic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail-brand .barsic svg{width:26px;height:26px} .fulllogo{height:20px;filter:brightness(0) invert(1);opacity:.9}
  .tr-rail-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .tr-rail-foot{display:flex;flex-direction:column;gap:2px}
  .tr-rail-item,.tr-rail-user{display:flex;align-items:center;height:42px;margin:0 8px;border-radius:10px;color:#93a1ba;text-decoration:none;font-weight:600;font-size:13.5px;overflow:hidden;white-space:nowrap;transition:background .12s,color .12s}
  .tr-rail-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .tr-rail-item.active{background:rgba(138,131,245,.25);color:#fff}
  .tr-rail-item .ic,.tr-rail-user .ic{width:42px;flex:none;display:flex;align-items:center;justify-content:center}
  .tr-rail-item .ic svg{width:19px;height:19px} .tr-rail .lbl{opacity:0;transition:opacity .16s} .tr-rail:hover .lbl{opacity:1}
  .tr-rail-user .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .main{margin-left:66px;padding:24px clamp(14px,3vw,34px) 90px;max-width:1280px}
  .report-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
  .rh-left{display:flex;align-items:center;gap:14px}
  h1{font-size:22px;font-weight:850;letter-spacing:-.02em;margin:0}
  .rh-meta{color:var(--txt-dim);font-size:12.5px;margin-top:3px}
  .btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700}
  /* ---- master status ring ---- */
  .master{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:22px 26px;margin-bottom:16px;position:relative;overflow:hidden}
  .master:before{content:"";position:absolute;left:-80px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none}
  .ring{position:relative;width:128px;height:128px;flex:none}
  .ring svg{width:128px;height:128px;transform:rotate(-90deg)}
  .ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring .mid b{font-size:15px;font-weight:850;letter-spacing:.02em}
  .ring .mid span{font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  @keyframes ringPulse{0%,100%{opacity:.5}50%{opacity:1}}
  .ring .pulse{animation:ringPulse 2.4s ease-in-out infinite}
  .mhead{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
  .mhead h2{margin:0;font-size:18px;font-weight:850}
  .counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .cnt{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
  .cnt i{width:8px;height:8px;border-radius:50%}
  .cnt.ok{color:var(--ok)} .cnt.ok i{background:var(--ok)}
  .cnt.warn{color:var(--warn)} .cnt.warn i{background:var(--warn)}
  .cnt.down{color:var(--down)} .cnt.down i{background:var(--down)}
  .cnt.idle{color:var(--idle)} .cnt.idle i{background:var(--idle)}
  .cnt.unknown{color:var(--unknown)} .cnt.unknown i{background:var(--unknown)}
  .alerts{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .alert{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:700;border-radius:10px;padding:8px 13px}
  .alert.down{background:var(--down-soft);color:var(--down)} .alert.warn{background:var(--warn-soft);color:var(--warn)}
  /* ---- pulse chart ---- */
  .pulsecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 20px;margin-bottom:16px}
  .pulsecard h3{margin:0 0 2px;font-size:14px;font-weight:800}
  .pulsecard .sub{color:var(--faint);font-size:12px;margin-bottom:8px}
  .plegend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--txt-dim);margin-bottom:4px}
  .plegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
  /* ---- engine groups ---- */
  .grp-t{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
  .grp-t:after{content:"";flex:1;height:1px;background:var(--line2)}
  .engines{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:11px}
  .eng{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:13px 15px;position:relative;
    border-left-width:3px;transition:transform .12s}
  .eng:hover{transform:translateY(-2px)}
  .eng.ok{border-left-color:var(--ok)} .eng.warn{border-left-color:var(--warn)} .eng.down{border-left-color:var(--down)}
  .eng.idle{border-left-color:var(--idle)} .eng.unknown{border-left-color:var(--unknown)}
  .eng .led{position:absolute;top:14px;right:13px;width:9px;height:9px;border-radius:50%}
  .eng.ok .led{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:led 2.2s ease-out infinite}
  .eng.warn .led{background:var(--warn);box-shadow:0 0 0 0 var(--warn);animation:led 1.4s ease-out infinite}
  .eng.down .led{background:var(--down);box-shadow:0 0 0 0 var(--down);animation:led .9s ease-out infinite}
  .eng.idle .led{background:var(--idle)} .eng.unknown .led{background:var(--unknown)}
  @keyframes led{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 7px transparent;opacity:.9}100%{box-shadow:0 0 0 0 transparent}}
  @media(prefers-reduced-motion:reduce){.eng .led,.ring .pulse{animation:none!important}}
  .eng b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.01em;padding-right:16px}
  .eng .det{font-size:12px;color:var(--txt-dim);margin-top:4px;line-height:1.45;font-variant-numeric:tabular-nums}
  .eng .last{font-size:10.5px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
  .eng .st{display:inline-block;margin-top:7px;font-size:9.5px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;border-radius:12px;padding:2px 9px}
  .eng.ok .st{background:var(--ok-soft);color:var(--ok)} .eng.warn .st{background:var(--warn-soft);color:var(--warn)}
  .eng.down .st{background:var(--down-soft);color:var(--down)} .eng.idle .st{background:var(--idle-soft);color:var(--idle)}
  .eng.unknown .st{background:var(--idle-soft);color:var(--unknown)}
  .empty{color:var(--faint);text-align:center;padding:48px}
  .tr-theme-btn{position:fixed;right:16px;bottom:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px;z-index:50}
</style></head><body>
<nav class="tr-rail" id="trRail" aria-label="Primary navigation"></nav>
<div class="main">
  <div class="report-head">
    <div class="rh-left">
      <div><h1>Engine Room</h1><div class="rh-meta" id="meta">Every engine of the system — live, honest signals. Never a fake OK.</div></div>
    </div>
    <div class="rh-actions"><button class="btn" onclick="load()">Refresh now</button></div>
  </div>
  <div class="master" id="master"><div class="empty" style="grid-column:1/-1">Loading engines…</div></div>
  <div class="pulsecard">
    <h3>System pulse — last 24 hours</h3><div class="sub">Hourly activity across the floor</div>
    <div class="plegend"><span><i style="background:var(--accent)"></i>Outbound dials</span><span><i style="background:var(--ok)"></i>Inbound calls</span><span><i style="background:var(--warn)"></i>SMS</span></div>
    <svg id="pulse" width="100%" height="120"></svg>
  </div>
  <div id="groups"></div>
</div>
<button class="tr-theme-btn" title="Toggle light / dark" onclick="var e=document.documentElement,n=e.getAttribute('data-theme')==='light'?'dark':'light';e.setAttribute('data-theme',n);try{localStorage.setItem('tr-theme-v2',n)}catch(x){};this.textContent=n==='light'?'\u{1F319}':'☀️'">🌙</button>
<script>
(function(){try{var t=localStorage.getItem('tr-theme-v2');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var STATE_LABEL={ok:'Running',warn:'Attention',down:'DOWN',idle:'Idle',unknown:'Unknown'};
var GROUP_ORDER=['Calling','Intelligence','Builders','Autopilot','Core','Billing'];
var GROUP_ICONS={Calling:'📞',Intelligence:'🧠',Builders:'🏗️',Autopilot:'🤖',Core:'⚙️',Billing:'💳'};
function render(d){
  var counts=d.counts||{}, total=(d.engines||[]).length||1;
  var okN=counts.ok||0, ring=okN/total;
  var col=d.overall==='down'?'var(--down)':(d.overall==='warn'?'var(--warn)':'var(--ok)');
  var C=2*Math.PI*54;
  var alerts=(d.engines||[]).filter(function(e){return e.state==='down'||e.state==='warn';});
  document.getElementById('master').innerHTML=
    '<div class="ring"><svg viewBox="0 0 128 128">'+
      '<circle cx="64" cy="64" r="54" fill="none" stroke="var(--line2)" stroke-width="9"/>'+
      '<circle class="pulse" cx="64" cy="64" r="54" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(ring*C)+' '+C+'"/></svg>'+
      '<div class="mid"><b style="color:'+col+'">'+okN+'/'+total+'</b><span>engines OK</span></div></div>'+
    '<div><div class="mhead"><h2>'+(d.overall==='ok'?'All systems operational':(d.overall==='down'?'Engine failure detected':'Attention needed'))+'</h2>'+
      '<span style="color:var(--faint);font-size:12px">'+(d.calling_hours?'AU calling window OPEN':'outside AU calling window')+'</span></div>'+
      '<div class="counts">'+['ok','warn','down','idle','unknown'].map(function(s){return (counts[s]?'<span class="cnt '+s+'"><i></i>'+counts[s]+' '+STATE_LABEL[s]+'</span>':'');}).join('')+'</div>'+
      (alerts.length?'<div class="alerts">'+alerts.slice(0,5).map(function(e){return '<div class="alert '+e.state+'">'+(e.state==='down'?'⛔':'⚠️')+' <span>'+esc(e.name)+' — '+esc(e.detail)+'</span></div>';}).join('')+'</div>':'')+
    '</div>';
  // pulse chart
  drawPulse(d.pulse||[]);
  // engine groups
  var by={};
  (d.engines||[]).forEach(function(e){(by[e.group]=by[e.group]||[]).push(e);});
  document.getElementById('groups').innerHTML=GROUP_ORDER.filter(function(g){return by[g];}).map(function(g){
    return '<div class="grp-t">'+(GROUP_ICONS[g]||'')+' '+g+'</div><div class="engines">'+by[g].map(function(e){
      return '<div class="eng '+e.state+'"><span class="led"></span><b>'+esc(e.name)+'</b>'+
        '<div class="det">'+esc(e.detail)+'</div>'+
        (e.last?'<div class="last">last activity '+esc(e.last)+'</div>':'')+
        '<span class="st">'+STATE_LABEL[e.state]+'</span></div>';
    }).join('')+'</div>';
  }).join('');
  document.getElementById('meta').textContent='20 live engine signals · auto-refreshes every 20s · updated '+new Date().toLocaleTimeString();
}
function drawPulse(p){
  var svg=document.getElementById('pulse');
  var W=svg.clientWidth||900,H=120,padB=16,padT=6;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if(!p.length){svg.innerHTML='<text x="50%" y="55%" fill="var(--faint)" text-anchor="middle" font-size="12">quiet — no activity in the last 24h</text>';return;}
  var max=1; p.forEach(function(x){max=Math.max(max,x.dials+x.inbound,x.sms);});
  var iw=W/24, bw=Math.max(4,iw*0.5);
  var out='';
  // fill missing hours: build a 24-slot map by hour string suffix
  var now=new Date();
  var slots=[];
  for(var i=23;i>=0;i--){var t=new Date(now.getTime()-i*3600e3);slots.push({key:t.toISOString().slice(0,13),lab:t.getHours()});}
  var byh={}; p.forEach(function(x){byh[String(x.hour).slice(0,13).replace(' ','T')]=x;});
  slots.forEach(function(s,i){
    var x=byh[s.key]||{dials:0,inbound:0,sms:0};
    var X=i*iw+(iw-bw)/2;
    var hD=(x.dials/max)*(H-padB-padT), hI=(x.inbound/max)*(H-padB-padT), hS=(x.sms/max)*(H-padB-padT);
    var base=H-padB;
    out+='<rect x="'+X+'" y="'+(base-hD)+'" width="'+bw*0.55+'" height="'+Math.max(hD,1)+'" rx="1.5" fill="var(--accent)" opacity=".9"/>';
    out+='<rect x="'+(X+bw*0.55)+'" y="'+(base-hI)+'" width="'+bw*0.3+'" height="'+Math.max(hI,1)+'" rx="1.5" fill="var(--ok)" opacity=".9"/>';
    out+='<rect x="'+(X+bw*0.85)+'" y="'+(base-hS)+'" width="'+bw*0.3+'" height="'+Math.max(hS,1)+'" rx="1.5" fill="var(--warn)" opacity=".85"/>';
    if(i%4===0)out+='<text x="'+(X+bw/2)+'" y="'+(H-3)+'" fill="var(--faint)" font-size="9.5" text-anchor="middle">'+s.lab+':00</text>';
  });
  svg.innerHTML=out;
}
function load(){
  fetch('/api/status').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(render)
  .catch(function(e){document.getElementById('master').innerHTML='<div class="empty" style="grid-column:1/-1">Couldn\'t load ('+e.message+')</div>';});
}
window.load=load; load();
setInterval(load,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
</script>
<script>(function(){
  var P=location.pathname, S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
  var NAV=[
    ['/','/','Dashboard','<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'],
    ['/lisa-crm','/lisa-crm','Booked CRM','<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',1],
    ['/lisa','/lisa','Outbound Intelligence','<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',1],
    ['/tasks','/tasks','Tasks','<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l1.5 1.5L13 11"/><path d="M9 17h5"/>',3],
    ['/cost','/cost','Cost','<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',3],
    ['/status','/status','Engine Room','<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',1],
    ['/admin','/admin','Admin','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 0 1-4 0v-.11a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3a2 2 0 0 1 0-4h.11a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 .97-1.47V3a2 2 0 0 1 4 0v.11a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47.97H21a2 2 0 0 1 0 4h-.11a1.6 1.6 0 0 0-1.47.97z"/>',1]
  ];
  var BARS='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="13" width="4.3" height="7.6" rx="1.2" fill="currentColor" opacity=".92"/><rect x="9.85" y="8.2" width="4.3" height="12.4" rx="1.2" fill="#2fb9e6"/><rect x="16.3" y="3.6" width="4.3" height="17" rx="1.2" fill="#83c43a"/></svg>';
  var h='<a class="tr-rail-brand" href="/" title="Traffic Radius"><span class="barsic">'+BARS+'</span><img class="fulllogo" src="/logo.png" alt="Traffic Radius"/></a><div class="tr-rail-nav">';
  for(var i=0;i<NAV.length;i++){var n=NAV[i];
    var act=((n[1]==='/')?(P==='/'):(P===n[1]||P.indexOf(n[1]+'/')===0))?' active':'';
    h+='<a class="tr-rail-item'+act+(n[4]===2?' tr-sched':n[4]===3?' tr-owner':n[4]?' tr-admin':'')+'" href="'+n[0]+'" data-nav="'+n[1]+'"'+(n[4]?' style="display:none"':'')+' title="'+n[2]+'"><span class="ic">'+S+n[3]+'</svg></span><span class="lbl">'+n[2]+'</span></a>';
  }
  h+='</div><div class="tr-rail-foot"><a class="tr-rail-item" href="/logout" title="Sign out"><span class="ic">'+S+'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="lbl">Sign out</span></a><div class="tr-rail-user" title="Account"><span class="ic"><span class="av" id="trAv">&middot;</span></span><span class="lbl" id="trWho">Account</span></div></div>';
  var rail=document.getElementById('trRail'); if(rail) rail.innerHTML=h;
  fetch('/api/me').then(function(r){return r.json()}).then(function(m){
    if(!m)return;
    if(m.role==='admin'){document.querySelectorAll('.tr-rail .tr-admin').forEach(function(el){el.style.display='';});}
    if(m.crm_access){document.querySelectorAll('.tr-rail [data-nav="/lisa-crm"]').forEach(function(el){el.style.display='';});}if(m.lisa_access){document.querySelectorAll('.tr-rail [data-nav="/lisa"]').forEach(function(el){el.style.display='';});}
    if(m.tasks_access){document.querySelectorAll('.tr-rail .tr-owner').forEach(function(el){el.style.display='';});}
    var nm=(m.name||m.email||'').trim();var w=document.getElementById('trWho');if(w&&nm)w.textContent=nm;
    var av=document.getElementById('trAv');if(av&&nm)av.textContent=nm[0].toUpperCase();
  }).catch(function(){});
})();</script>
